[project]
name = "assistant"
version = "0.1.0"
description = "Личный Telegram-ассистент"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "notion-client>=2.2",
    "groq>=0.13",
    "anthropic>=0.40",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "apscheduler>=3.10",
    "redis>=5.0",
    "httpx>=0.27",
    # ZoneInfo (планировщик, src/scheduler/jobs.py) на Linux берёт
    # системную базу часовых поясов, на Windows системной базы нет —
    # без этого пакета падает ZoneInfoNotFoundError. Раньше приезжал
    # только транзитивно через apscheduler→tzlocal (см. TECHDEBT.md) —
    # объявляем прямо, не полагаясь на чужой transitive dependency.
    "tzdata>=2024.1",
    # request.form() (Phase 45, вход в веб-версию через код в чате с
    # ботом — обычные HTML-формы) — Starlette требует эту библиотеку
    # отдельно, сама её не тащит.
    "python-multipart>=0.0.12",
    # Метаданные и субтитры видео по ссылке (Phase 102, YouTube/Rutube/VK/
    # Vimeo). Видеохосты часто ломают экстракторы — при сбоях в первую
    # очередь обновить версию.
    "yt-dlp>=2025.10.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
