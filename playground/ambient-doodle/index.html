<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Ambient Doodle</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #05060a;
    height: 100%;
    cursor: crosshair;
  }
  canvas {
    display: block;
  }
  #hint {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.55);
    font: 13px/1.4 -apple-system, "Segoe UI", sans-serif;
    letter-spacing: 0.02em;
    text-align: center;
    pointer-events: none;
    transition: opacity 1.2s ease;
    white-space: nowrap;
  }
  #hint.hidden { opacity: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">move your mouse to paint &nbsp;·&nbsp; click for a burst &nbsp;·&nbsp; C clears &nbsp;·&nbsp; S saves</div>
<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');

  let W, H;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // fade the previous frame slightly instead of clearing -> trails
  function fadeFrame(alpha) {
    ctx.fillStyle = 'rgba(5, 6, 10, ' + alpha + ')';
    ctx.fillRect(0, 0, W, H);
  }
  ctx.fillStyle = '#05060a';
  ctx.fillRect(0, 0, W, H);

  let particles = [];
  const MAX_PARTICLES = 1400;

  let hue = 190; // slowly drifting base hue
  let mouse = { x: W / 2, y: H / 2, px: W / 2, py: H / 2, active: false };
  let lastMoveTime = performance.now();

  function spawn(x, y, vx, vy, opts) {
    opts = opts || {};
    particles.push({
      x, y, vx, vy,
      life: 0,
      maxLife: opts.maxLife || (60 + Math.random() * 60),
      radius: opts.radius || (1.5 + Math.random() * 2.5),
      hue: opts.hue !== undefined ? opts.hue : hue,
      sat: opts.sat || (70 + Math.random() * 30),
      light: opts.light || (55 + Math.random() * 20)
    });
    if (particles.length > MAX_PARTICLES) {
      particles.splice(0, particles.length - MAX_PARTICLES);
    }
  }

  function onMove(x, y) {
    const dx = x - mouse.px;
    const dy = y - mouse.py;
    const speed = Math.sqrt(dx * dx + dy * dy);
    mouse.px = mouse.x; mouse.py = mouse.y;
    mouse.x = x; mouse.y = y;
    mouse.active = true;
    lastMoveTime = performance.now();

    const count = Math.min(6, 1 + Math.floor(speed / 4));
    for (let i = 0; i < count; i++) {
      const angle = Math.atan2(dy, dx) + (Math.random() - 0.5) * 1.2;
      const spd = 0.3 + Math.random() * 1.2 + speed * 0.03;
      spawn(
        x + (Math.random() - 0.5) * 6,
        y + (Math.random() - 0.5) * 6,
        Math.cos(angle) * spd,
        Math.sin(angle) * spd
      );
    }
  }

  function burst(x, y) {
    const n = 90;
    for (let i = 0; i < n; i++) {
      const angle = (Math.PI * 2 * i) / n + Math.random() * 0.3;
      const spd = 1 + Math.random() * 4;
      spawn(x, y, Math.cos(angle) * spd, Math.sin(angle) * spd, {
        maxLife: 80 + Math.random() * 60,
        radius: 2 + Math.random() * 3
      });
    }
  }

  canvas.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY));
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    if (t) onMove(t.clientX, t.clientY);
  }, { passive: false });
  canvas.addEventListener('mousedown', (e) => burst(e.clientX, e.clientY));
  canvas.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    if (t) burst(t.clientX, t.clientY);
  }, { passive: true });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'c' || e.key === 'C') {
      ctx.fillStyle = '#05060a';
      ctx.fillRect(0, 0, W, H);
      particles = [];
    } else if (e.key === 's' || e.key === 'S') {
      const link = document.createElement('a');
      link.download = 'ambient-doodle.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  });

  let hintTimer = setTimeout(() => hint.classList.add('hidden'), 5000);
  window.addEventListener('mousemove', () => {
    hint.classList.remove('hidden');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => hint.classList.add('hidden'), 3000);
  });

  function ambientDrift(now) {
    // when idle, a few gentle particles keep the canvas alive
    if (now - lastMoveTime > 400 && Math.random() < 0.5) {
      const angle = Math.random() * Math.PI * 2;
      const r = Math.min(W, H) * (0.15 + Math.random() * 0.35);
      const cx = W / 2 + Math.cos(now * 0.00007) * W * 0.2;
      const cy = H / 2 + Math.sin(now * 0.00009) * H * 0.2;
      spawn(
        cx + Math.cos(angle) * r,
        cy + Math.sin(angle) * r,
        Math.cos(angle + Math.PI / 2) * 0.3,
        Math.sin(angle + Math.PI / 2) * 0.3,
        { maxLife: 150, radius: 1 + Math.random() * 1.5, sat: 40, light: 40 }
      );
    }
  }

  function tick(now) {
    fadeFrame(0.06);
    hue = (hue + 0.06) % 360;

    ambientDrift(now);

    ctx.globalCompositeOperation = 'lighter';
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life++;
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.985;
      p.vy *= 0.985;
      p.vy += 0.002; // faint gravity

      const t = p.life / p.maxLife;
      if (t >= 1) {
        particles.splice(i, 1);
        continue;
      }
      const alpha = Math.sin(Math.PI * (1 - t)) * 0.9;
      const r = p.radius * (1 - t * 0.4);

      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 4);
      grad.addColorStop(0, `hsla(${p.hue}, ${p.sat}%, ${p.light}%, ${alpha})`);
      grad.addColorStop(1, `hsla(${p.hue}, ${p.sat}%, ${p.light}%, 0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r * 4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
