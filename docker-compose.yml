services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assistant}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    # --proxy-headers/--forwarded-allow-ips (Phase 45) — без них uvicorn
    # видит только внутреннюю схему за Caddy (Caddy терминирует TLS и
    # проксирует внутрь по обычному HTTP), поэтому request.base_url/
    # request.url всегда отдавали "http://", даже когда снаружи всё по
    # https — сломало data-auth-url для Telegram Login Widget (виджет не
    # рендерился с "http://" в callback-URL). "*" безопасен здесь: api
    # достижим только из docker-сети, единственный внешний вход — сам
    # Caddy на 80/443, подделать заголовок X-Forwarded-Proto снаружи
    # напрямую нельзя.
    command: uv run uvicorn src.adapters.api:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips="*"
    env_file: .env
    volumes:
      # Лёгкий staging для Mini App (см. SPEC.md §5) — bind mount, а не
      # часть образа: чтобы проверить кандидата на /miniapp-staging/,
      # достаточно scp index.html сюда на хост, без пересборки и рестарта
      # api. Read-only — процесс внутри контейнера сюда не пишет.
      - ./staging_static:/app/staging_static:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - api

volumes:
  pg_data:
  redis_data:
  caddy_data:
