<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ассистент</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --card-bg: var(--tg-theme-secondary-bg-color, #f2f2f2);
      --text: var(--tg-theme-text-color, #111111);
      --text-muted: var(--tg-theme-hint-color, #8e8e93);
      --hairline: rgba(127, 127, 127, 0.2);
      --accent: var(--tg-theme-button-color, #2481cc);
      --accent-text: var(--tg-theme-button-text-color, #ffffff);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .section { margin-bottom: 24px; }
    .section-label {
      font-size: 13px;
      color: var(--text-muted);
      margin: 0 0 8px;
      padding: 0 2px;
    }
    .list {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 0.5px solid var(--hairline);
    }
    .row:last-child { border-bottom: none; }
    .empty {
      padding: 12px 14px;
      font-size: 14px;
      color: var(--text-muted);
    }
    .checkbox {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1.5px solid var(--text-muted);
      background: transparent;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #fff;
    }
    .checkbox.done {
      background: var(--accent);
      border-color: var(--accent);
    }
    .checkbox svg { display: none; width: 12px; height: 12px; }
    .checkbox.done svg { display: block; }
    .title {
      flex: 1;
      font-size: 15px;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .title.done {
      color: var(--text-muted);
      text-decoration: line-through;
    }
    .priority {
      font-size: 12px;
      color: var(--text-muted);
      flex-shrink: 0;
      white-space: nowrap;
    }
    .add-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .add-row input {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      background: var(--card-bg);
      color: var(--text);
      font-size: 15px;
      min-width: 0;
    }
    .add-row input::placeholder { color: var(--text-muted); }
    .icon-btn {
      border: none;
      border-radius: 10px;
      width: 40px;
      height: 40px;
      background: var(--accent);
      color: var(--accent-text);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .small-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 0;
    }
    .small-btn input[type="date"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      border: none;
      padding: 0;
    }
    .trash-btn { color: #e2504a; }
    .day-carousel {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      border-radius: 12px;
    }
    .day-carousel::-webkit-scrollbar { display: none; }
    .day-page {
      flex: 0 0 100%;
      min-width: 100%;
      scroll-snap-align: start;
    }
    .day-page .list { border-radius: 12px; }
    .day-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
    }
    .day-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      opacity: 0.35;
    }
    .day-dot.active { opacity: 1; }
    .digest { padding: 12px 14px; font-size: 14px; color: var(--text-muted); }
    button:disabled { opacity: 0.5; }
  </style>
</head>
<body>
  <div class="section">
    <p class="section-label" id="day-label">Сегодня</p>
    <div class="day-carousel" id="day-carousel">
      <div class="day-page"><div id="yesterday-list" class="list"></div></div>
      <div class="day-page"><div id="today-list" class="list"></div></div>
      <div class="day-page"><div id="tomorrow-list" class="list"></div></div>
    </div>
    <div class="day-dots">
      <span class="day-dot" data-index="0"></span>
      <span class="day-dot active" data-index="1"></span>
      <span class="day-dot" data-index="2"></span>
    </div>
    <div class="add-row">
      <input id="new-task-input" type="text" placeholder="Новая задача на сегодня" />
      <button id="add-task-btn" class="icon-btn" aria-label="Добавить задачу"></button>
    </div>
  </div>

  <div class="section">
    <p class="section-label">Инбокс</p>
    <div id="inbox-list" class="list"></div>
  </div>

  <div class="section">
    <p class="section-label">Утренний дайджест</p>
    <div id="digest" class="list digest">Загрузка…</div>
  </div>

  <div class="section">
    <p class="section-label">Привычки</p>
    <div id="habit-list" class="list"></div>
    <div class="add-row">
      <input id="new-habit-input" type="text" placeholder="Новая привычка" />
      <button id="add-habit-btn" class="icon-btn" aria-label="Добавить привычку"></button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    tg?.ready();
    tg?.expand();

    const initData = tg?.initData || "";

    async function api(path, options = {}) {
      const res = await fetch(path, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          ...(options.headers || {}),
          "X-Telegram-Init-Data": initData,
        },
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    function icon(inner, size) {
      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="${size}" height="${size}">${inner}</svg>`;
    }
    function checkIcon() {
      return '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3 3 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    }
    function calendarIcon() {
      return icon(
        '<rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="2.5" x2="8" y2="6"/><line x1="16" y1="2.5" x2="16" y2="6"/>',
        16
      );
    }
    function trashIcon() {
      return icon(
        '<line x1="4" y1="7" x2="20" y2="7"/><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/><path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/>',
        16
      );
    }
    function plusIcon() {
      return icon('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>', 18);
    }

    document.getElementById("add-task-btn").innerHTML = plusIcon();
    document.getElementById("add-habit-btn").innerHTML = plusIcon();

    function renderTaskRow(task, { showDateButton, showTrashButton }) {
      const row = document.createElement("div");
      row.className = "row";

      const checkbox = document.createElement("button");
      checkbox.className = "checkbox" + (task.done ? " done" : "");
      checkbox.setAttribute("aria-label", task.done ? "Снять отметку" : "Отметить выполненной");
      checkbox.innerHTML = checkIcon();
      checkbox.onclick = async () => {
        checkbox.disabled = true;
        try {
          await api(`/miniapp/api/tasks/${encodeURIComponent(task.notion_page_id)}/done`, {
            method: "POST",
            body: JSON.stringify({ done: !task.done }),
          });
          tg?.HapticFeedback?.notificationOccurred("success");
          await loadTasks();
        } catch (e) {
          checkbox.disabled = false;
        }
      };

      const title = document.createElement("span");
      title.className = "title" + (task.done ? " done" : "");
      title.textContent = task.title;

      row.append(checkbox, title);

      if (!task.done && task.priority) {
        const badge = document.createElement("span");
        badge.className = "priority";
        badge.textContent = task.priority;
        row.append(badge);
      }

      if (showDateButton && !task.done) {
        const dateBtn = document.createElement("button");
        dateBtn.className = "small-btn";
        dateBtn.setAttribute("aria-label", "Поставить дату");
        dateBtn.innerHTML = calendarIcon();

        const dateInput = document.createElement("input");
        dateInput.type = "date";
        dateInput.onchange = async () => {
          if (!dateInput.value) return;
          dateBtn.disabled = true;
          try {
            await api(`/miniapp/api/tasks/${encodeURIComponent(task.notion_page_id)}/due-date`, {
              method: "POST",
              body: JSON.stringify({ due_date: dateInput.value }),
            });
            tg?.HapticFeedback?.notificationOccurred("success");
            await loadTasks();
          } catch (e) {
            dateBtn.disabled = false;
          }
        };
        dateBtn.onclick = () => (dateInput.showPicker ? dateInput.showPicker() : dateInput.click());
        dateBtn.append(dateInput);
        row.append(dateBtn);
      }

      if (showTrashButton) {
        const trashBtn = document.createElement("button");
        trashBtn.className = "small-btn trash-btn";
        trashBtn.setAttribute("aria-label", "Удалить задачу");
        trashBtn.innerHTML = trashIcon();
        trashBtn.onclick = async () => {
          trashBtn.disabled = true;
          try {
            await api(`/miniapp/api/tasks/${encodeURIComponent(task.notion_page_id)}/archive`, {
              method: "POST",
            });
            tg?.HapticFeedback?.notificationOccurred("success");
            await loadTasks();
          } catch (e) {
            trashBtn.disabled = false;
            alert("Не удалось удалить — возможно, в Notion Tasks нет свойства TaskStatus.");
          }
        };
        row.append(trashBtn);
      }

      return row;
    }

    function renderList(container, tasks, opts) {
      container.innerHTML = "";
      if (tasks.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Пусто";
        container.append(empty);
        return;
      }
      tasks.forEach((t) => container.append(renderTaskRow(t, opts)));
    }

    const _dayNoTrashDate = { showDateButton: false, showTrashButton: false };

    async function loadTasks() {
      const inboxEl = document.getElementById("inbox-list");
      try {
        const board = await api("/miniapp/api/tasks");
        renderList(document.getElementById("yesterday-list"), board.days.yesterday.tasks, _dayNoTrashDate);
        renderList(document.getElementById("today-list"), board.days.today.tasks, _dayNoTrashDate);
        renderList(document.getElementById("tomorrow-list"), board.days.tomorrow.tasks, _dayNoTrashDate);
        renderList(inboxEl, board.inbox, { showDateButton: true, showTrashButton: true });
      } catch (e) {
        document.getElementById("today-list").innerHTML =
          '<div class="empty">Не удалось загрузить задачи.</div>';
        inboxEl.innerHTML = "";
      }
    }

    document.getElementById("add-task-btn").onclick = async () => {
      const input = document.getElementById("new-task-input");
      const value = input.value.trim();
      if (!value) return;
      const btn = document.getElementById("add-task-btn");
      btn.disabled = true;
      try {
        await api("/miniapp/api/tasks", { method: "POST", body: JSON.stringify({ title: value }) });
        input.value = "";
        tg?.HapticFeedback?.notificationOccurred("success");
        await loadTasks();
        scrollToDay(1);
      } catch (e) {
        alert("Не удалось создать задачу.");
      } finally {
        btn.disabled = false;
      }
    };
    document.getElementById("new-task-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("add-task-btn").click();
    });

    const _dayLabels = ["Вчера", "Сегодня", "Завтра"];
    const carousel = document.getElementById("day-carousel");
    const dayLabel = document.getElementById("day-label");
    const dayDots = Array.from(document.querySelectorAll(".day-dot"));

    function scrollToDay(index) {
      carousel.scrollTo({ left: carousel.clientWidth * index, behavior: "smooth" });
    }

    function updateDayLabel() {
      const index = Math.round(carousel.scrollLeft / carousel.clientWidth);
      dayLabel.textContent = _dayLabels[index] ?? "Сегодня";
      dayDots.forEach((dot, i) => dot.classList.toggle("active", i === index));
    }

    let _scrollTimeout;
    carousel.addEventListener("scroll", () => {
      clearTimeout(_scrollTimeout);
      _scrollTimeout = setTimeout(updateDayLabel, 80);
    });
    dayDots.forEach((dot) => {
      dot.addEventListener("click", () => scrollToDay(Number(dot.dataset.index)));
    });
    // Стартуем сразу на "сегодня" (страница 1), без анимации.
    carousel.scrollLeft = carousel.clientWidth;

    async function loadDigest() {
      const el = document.getElementById("digest");
      try {
        const data = await api("/miniapp/api/briefing");
        el.textContent = data.weather || "Погода не настроена";
      } catch (e) {
        el.textContent = "Не удалось загрузить.";
      }
    }

    function renderHabit(habit) {
      const row = document.createElement("div");
      row.className = "row";

      const name = document.createElement("span");
      name.className = "title";
      name.textContent = habit.name;

      const streak = document.createElement("span");
      streak.className = "priority";
      streak.textContent = `${habit.streak} дн.`;

      const btn = document.createElement("button");
      btn.className = "checkbox";
      btn.setAttribute("aria-label", "Отметить");
      btn.innerHTML = checkIcon();
      btn.querySelector("svg").style.display = "block";
      btn.onclick = async () => {
        btn.disabled = true;
        try {
          const result = await api(
            `/miniapp/api/habits/${encodeURIComponent(habit.notion_page_id)}/check`,
            { method: "POST" }
          );
          streak.textContent = `${result.streak} дн.`;
          btn.classList.add("done");
          tg?.HapticFeedback?.notificationOccurred("success");
        } finally {
          btn.disabled = false;
        }
      };

      row.append(name, streak, btn);
      return row;
    }

    async function loadHabits() {
      const el = document.getElementById("habit-list");
      try {
        const habits = await api("/miniapp/api/habits");
        if (habits.length === 0) {
          el.innerHTML = '<div class="empty">Привычек пока нет</div>';
          return;
        }
        el.innerHTML = "";
        habits.forEach((h) => el.append(renderHabit(h)));
      } catch (e) {
        el.innerHTML = '<div class="empty">Не удалось загрузить привычки.</div>';
      }
    }

    document.getElementById("add-habit-btn").onclick = async () => {
      const input = document.getElementById("new-habit-input");
      const value = input.value.trim();
      if (!value) return;
      const btn = document.getElementById("add-habit-btn");
      btn.disabled = true;
      try {
        await api("/miniapp/api/habits", { method: "POST", body: JSON.stringify({ name: value }) });
        input.value = "";
        tg?.HapticFeedback?.notificationOccurred("success");
        await loadHabits();
      } catch (e) {
        alert("Не удалось добавить привычку.");
      } finally {
        btn.disabled = false;
      }
    };
    document.getElementById("new-habit-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("add-habit-btn").click();
    });

    loadTasks();
    loadDigest();
    loadHabits();
  </script>
</body>
</html>
