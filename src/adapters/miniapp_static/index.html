<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ассистент</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --card-bg: var(--tg-theme-secondary-bg-color, #f2f2f2);
      --text: var(--tg-theme-text-color, #111111);
      --text-muted: var(--tg-theme-hint-color, #8e8e93);
      --hairline: rgba(127, 127, 127, 0.2);
      --accent: var(--tg-theme-button-color, #2481cc);
      --accent-text: var(--tg-theme-button-text-color, #ffffff);
      --pending-bg: rgba(36, 129, 204, 0.1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      /* Выделение текста нигде в приложении не нужно — только при правке
         текста задачи (см. .title-edit ниже), и то ради copy, не ради
         browse-режима. Заодно это чинит реальный баг: без touch-callout на
         телефоне долгое нажатие на текст строки перехватывалось нативным
         выделением/меню "Копировать" раньше, чем наш JS успевал увидеть
         продолжение жеста — перенос просто не срабатывал. */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    .section { margin-bottom: 24px; }
    .section-label {
      font-size: 13px;
      color: var(--text-muted);
      margin: 0 0 8px;
      padding: 0 2px;
    }
    .list {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 0.5px solid var(--hairline);
      transition: background-color 0.15s ease;
    }
    .row:last-child { border-bottom: none; }
    .row.pending { background: var(--pending-bg); }
    /* Перетаскивание для ручного порядка (Phase 13) — тень и приподнятый
       z-index на время жеста, у .swipe-wrap ещё и overflow:visible, иначе
       тень обрежется его обычным overflow:hidden (см. ниже). */
    .row.reorder-dragging {
      position: relative;
      z-index: 5;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
      background: var(--card-bg);
    }
    .empty {
      padding: 12px 14px;
      font-size: 14px;
      color: var(--text-muted);
    }
    .checkbox {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1.5px solid var(--text-muted);
      background: transparent;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #fff;
    }
    .checkbox.done {
      background: var(--accent);
      border-color: var(--accent);
    }
    .checkbox svg { display: none; width: 12px; height: 12px; }
    .checkbox.done svg { display: block; }
    .title {
      flex: 1;
      font-size: 15px;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .title.important {
      font-weight: 500;
    }
    .title.done {
      color: var(--text-muted);
      text-decoration: line-through;
    }
    /* Режим переноса (Phase 14) — текст показывается полностью, без
       усечения и без статуса/приоритета (см. renderReorderRow) — жирность
       и зачёркивание сюда специально не попадают, даже если у задачи есть
       done/важность. */
    .title-full {
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
      word-break: break-word;
    }
    /* Инлайн-правка текста — поле ввода занимает ровно то же место, что и
       заголовок-span, без визуального скачка при переключении. Доступна
       только в режиме переноса (Phase 14) — единственное место в
       приложении, где выделение текста снова разрешено (см. body выше),
       ради copy и двойного тапа "выделить всё". */
    .title-edit {
      flex: 1;
      font-size: 15px;
      min-width: 0;
      border: none;
      background: transparent;
      color: var(--text);
      padding: 0;
      font-family: inherit;
      -webkit-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
    }
    .title-edit:focus { outline: none; }
    .add-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .add-row input {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      background: var(--card-bg);
      color: var(--text);
      font-size: 15px;
      min-width: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .add-row input::placeholder { color: var(--text-muted); }
    .add-row input:focus {
      outline: none;
      /* Просто светлее фон вместо системной жёлтой подсветки при тапе —
         brightness одинаково хорошо работает и в светлой, и в тёмной теме. */
      filter: brightness(1.15);
    }
    /* Инбокс: необязательная дата прямо в строке ввода — значок календаря
       внутри поля справа, не отдельная кнопка снаружи. Задача с датой в
       инбокс не попадёт (см. build_task_board), это ожидаемо. */
    .input-with-icon { position: relative; flex: 1; min-width: 0; }
    .input-with-icon input[type="text"] { width: 100%; padding-right: 40px; }
    .input-with-icon .small-btn {
      position: absolute;
      right: 2px;
      top: 50%;
      transform: translateY(-50%);
    }
    .input-with-icon .small-btn.date-set { color: var(--accent); }
    .icon-btn {
      border: none;
      border-radius: 10px;
      width: 40px;
      height: 40px;
      background: var(--accent);
      color: var(--accent-text);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .small-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 0;
    }
    .small-btn input[type="date"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      border: none;
      padding: 0;
    }
    .archive-btn { color: var(--accent); }
    /* Свайп-шторка на строке задачи (Вчера/Сегодня/календарь — не Инбокс,
       там действия и так всегда на виду). Сама строка (.swipe-content)
       неподвижна; шторка с кнопками (.swipe-actions) наезжает поверх
       справа при перетаскивании, фон чуть светлее самой строки. */
    .swipe-wrap {
      position: relative;
      overflow: hidden;
      border-bottom: 0.5px solid var(--hairline);
    }
    .swipe-wrap:last-child { border-bottom: none; }
    .swipe-actions {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 0;
      overflow: hidden;
      display: flex;
      z-index: 1;
      background: color-mix(in srgb, var(--card-bg) 85%, white 15%);
      /* Пока шторка открыта, свайп вправо по всему её полю тоже закрывает —
         не отдаём горизонтальный жест внешней карусели, вертикальный
         скролл страницы работает как обычно. */
      touch-action: pan-y;
    }
    .swipe-btn {
      flex: 0 0 44px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      position: relative;
    }
    .swipe-btn + .swipe-btn::before {
      content: "";
      position: absolute;
      left: 0;
      top: 25%;
      bottom: 25%;
      width: 0.5px;
      background: var(--hairline);
    }
    .swipe-btn input[type="date"],
    .swipe-btn input[type="datetime-local"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      border: none;
      padding: 0;
    }
    .swipe-btn-archive { color: var(--accent); }
    .swipe-btn.active { color: var(--accent); }
    .swipe-content {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: var(--card-bg);
      /* Без pan-y здесь — жест вне зоны (см. .swipe-zone) должен спокойно
         уходить внешней карусели вчера/сегодня/неделя, как и на любом
         другом месте страницы. */
    }
    .swipe-wrap.pending .swipe-content { background: var(--pending-bg); }
    /* Единственное место, откуда стартует свайп самой задачи — узкая
       полоса у правого края (там же едва заметная ручка-подсказка). Только
       здесь touch-action:pan-y отбирает горизонтальный жест у страницы. */
    .swipe-zone {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 72px;
      touch-action: pan-y;
    }
    .swipe-handle {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      width: 4px;
      height: 20px;
      border-radius: 2px;
      background: var(--hairline);
      pointer-events: none;
    }
    .due-time {
      font-size: 13px;
      color: var(--accent);
      font-weight: 500;
      flex-shrink: 0;
    }
    .day-carousel {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .day-carousel::-webkit-scrollbar { display: none; }
    .day-page {
      flex: 0 0 100%;
      min-width: 100%;
      scroll-snap-align: start;
      /* Раньше резкий свайп мог по инерции пролететь сразу через страницу
         (напр. с "Вчера" сразу на "Неделя", мимо "Сегодня") — этот пункт
         спецификации CSS Scroll Snap как раз для этого: даже при сильном
         рывке скролл обязан остановиться на каждой точке привязки по
         очереди, не пропуская ни одной. На календарь (.week-page) это не
         распространяется — там оставляем как было. */
      scroll-snap-stop: always;
    }
    .day-page .list { border-radius: 12px; }
    .day-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
    }
    .day-dot {
      display: block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      opacity: 0.35;
    }
    .day-dot.active { opacity: 1; }
    .digest { padding: 12px 14px; font-size: 14px; color: var(--text-muted); }
    button:disabled { opacity: 0.5; }
    /* Полоска недель — три панели (пред./тек./след. неделя), но, в отличие
       от внешней карусели вчера/сегодня/календарь, БЕЗ нативного
       scroll-snap: у него на некоторых устройствах после плавного доезда
       по инерции идёт отдельная "довод-до-пикселя" коррекция от браузера,
       и на медленном свайпе это заметно как маленький срыв в самом конце.
       Вместо этого палец двигает .week-track напрямую через transform
       (JS ниже), а после отпускания — ровно один наш собственный CSS-
       transition до целевой недели, без вмешательства нативной физики. */
    .week-carousel {
      overflow: hidden;
    }
    .week-track {
      display: flex;
      gap: 8px;
      touch-action: pan-y;
    }
    .week-page {
      /* Ширина — в px через JS (applyWeekPanelSizes), от неё же зависит
         величина "peek" по бокам, см. WEEK_PANEL_RATIO в JS. */
      flex: 0 0 auto;
    }
    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 10px 4px;
    }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }
    .chevron {
      color: var(--text-muted);
      transition: transform 0.15s ease;
      display: flex;
    }
    .chevron.expanded { transform: rotate(180deg); }
    .week-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 6px 0;
      border-radius: 8px;
      background: transparent;
      border: 1.5px solid transparent;
    }
    /* Сегодняшний день — заливка, выбранный день — обводка. Оба берут цвет
       из одного и того же var(--accent), так что если оба условия
       совпали (сегодня и выбран), заливка и обводка естественно
       комбинируются на одной ячейке. */
    .week-cell.today { background: color-mix(in srgb, var(--accent) 18%, transparent); }
    .week-cell.selected { border-color: var(--accent); }
    .wc-label { font-size: 11px; color: var(--text-muted); }
    .wc-num { font-size: 14px; font-weight: 500; color: var(--text); }
    .week-dot { display: block; width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; background: transparent; }
    .week-dot.dim { background: var(--accent); opacity: 0.35; }
    .week-dot.medium { background: var(--accent); opacity: 0.65; }
    .week-dot.bright { background: var(--accent); opacity: 1; }
    #week-day-detail { margin-top: 8px; }
    /* Режим переноса (Phase 14) — вместо кружка статуса слева ручка,
       текст показывается полностью (см. .title-full выше), справа —
       отложенное удаление (архивируется пачкой при выходе из режима). */
    .grip {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      flex-shrink: 0;
      touch-action: none;
      cursor: grab;
    }
    .row.pending-archive {
      opacity: 0.45;
    }
    .reorder-archive-btn {
      color: var(--text-muted);
    }
    .reorder-archive-btn.marked {
      color: var(--accent);
    }
    /* Затемняющий фон на весь экран (Phase 14) — активный список рисуется
       выше него (см. .reorder-active-list), поэтому визуально оказывается
       "на переднем плане", а всё остальное (другие секции, add-row,
       карусель дней) просто перекрыто этим слоем — клики по нему не
       доходят до того, что под ним, ровно то и нужно ("некликабельно").
       Тап по самому затемнению — единственный выход из режима, кнопки
       "Готово" больше нет. */
    .reorder-scrim {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      z-index: 25;
    }
    .reorder-scrim.visible { display: block; }
    /* z-index выше затемнения — список остаётся на своём обычном месте в
       разметке (карусель/Инбокс не трогаем), просто "прорастает" поверх
       .reorder-scrim. Тень усиливает ощущение приподнятости. */
    .list.reorder-active-list {
      position: relative;
      z-index: 26;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
    }
  </style>
</head>
<body>
  <div class="section">
    <p class="section-label" id="day-label">Сегодня</p>
    <div class="day-carousel" id="day-carousel">
      <div class="day-page" data-day="yesterday">
        <div class="list" id="yesterday-list"></div>
        <div class="add-row">
          <input type="text" class="day-task-input" placeholder="Новая задача" />
          <button class="icon-btn day-task-add" aria-label="Добавить задачу"></button>
        </div>
      </div>
      <div class="day-page" data-day="today">
        <div class="list" id="today-list"></div>
        <div class="add-row">
          <input type="text" class="day-task-input" placeholder="Новая задача" />
          <button class="icon-btn day-task-add" aria-label="Добавить задачу"></button>
        </div>
      </div>
      <div class="day-page" data-day="calendar">
        <div class="week-carousel" id="week-carousel">
          <div class="week-track" id="week-track">
            <div class="week-page"><div class="week-grid" data-slot="prev"></div></div>
            <div class="week-page"><div class="week-grid" data-slot="current"></div></div>
            <div class="week-page"><div class="week-grid" data-slot="next"></div></div>
          </div>
        </div>
        <div id="week-day-detail"></div>
      </div>
    </div>
    <div class="day-dots">
      <span class="day-dot" data-index="0"></span>
      <span class="day-dot active" data-index="1"></span>
      <span class="day-dot" data-index="2"></span>
    </div>
  </div>

  <div class="section">
    <p class="section-label section-header" id="inbox-header">
      <span id="inbox-title">Инбокс</span>
      <span class="chevron" id="inbox-chevron"></span>
    </p>
    <div id="inbox-body" style="display: none;">
      <div id="inbox-list" class="list"></div>
    </div>
    <div class="add-row">
      <div class="input-with-icon">
        <input id="new-inbox-input" type="text" placeholder="Новая задача" />
        <button id="inbox-date-btn" class="small-btn" aria-label="Задать дату (необязательно)"></button>
      </div>
      <button id="add-inbox-btn" class="icon-btn" aria-label="Добавить задачу"></button>
    </div>
  </div>

  <div class="section">
    <p class="section-label">Утренний дайджест</p>
    <div id="digest" class="list digest">Загрузка…</div>
  </div>

  <div id="reorder-scrim" class="reorder-scrim"></div>

  <script>
    const tg = window.Telegram?.WebApp;
    tg?.ready();
    tg?.expand();

    const initData = tg?.initData || "";

    async function api(path, options = {}) {
      const res = await fetch(path, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          ...(options.headers || {}),
          "X-Telegram-Init-Data": initData,
        },
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    function icon(inner, size) {
      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="${size}" height="${size}">${inner}</svg>`;
    }
    function checkIcon() {
      return '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3 3 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    }
    function calendarIcon() {
      return icon(
        '<rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="2.5" x2="8" y2="6"/><line x1="16" y1="2.5" x2="16" y2="6"/>',
        16
      );
    }
    function archiveIcon() {
      return icon('<rect x="4" y="10" width="16" height="10" rx="1"/><path d="M12 3v8M9 8l3 3 3-3"/>', 16);
    }
    function plusIcon() {
      return icon('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>', 18);
    }
    function moveToTodayIcon() {
      return icon('<line x1="5" y1="12" x2="19" y2="12"/><path d="M13 6l6 6-6 6"/>', 16);
    }
    function chevronIcon() {
      return icon('<path d="M6 9l6 6 6-6"/>', 14);
    }
    function eventPinIcon() {
      return icon('<path d="M12 21c4-4.5 7-8 7-12a7 7 0 10-14 0c0 4 3 7.5 7 12z"/><circle cx="12" cy="9" r="2.3"/>', 13);
    }
    function gripIcon() {
      return icon('<line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/>', 18);
    }
    // Кнопка "важная задача" в шторке — само поле теперь показывает
    // важность жирным шрифтом (Phase 14), не флажком, но кнопке-тумблеру
    // в панели всё равно нужен свой значок.
    function importantIcon() {
      return icon('<line x1="12" y1="4" x2="12" y2="13"/><circle cx="12" cy="18" r="1" fill="currentColor"/>', 15);
    }
    function undoIcon() {
      return icon('<path d="M4 10h9a5 5 0 010 10H9"/><path d="M4 10l5-5M4 10l5 5"/>', 16);
    }

    // ---- Состояние. Рендер идёт из него, без похода в сеть на каждое действие
    // (optimistic UI) — сеть только подтверждает то, что уже видно на экране.
    let boardState = { days: {}, dated_tasks: [], inbox: [] };
    const pendingIds = new Set();

    // Порядок — ручной (Phase 13), хранится в task.sort_order (float),
    // приходит с бэкенда и обновляется через /reorder при перетаскивании.
    // Больше значение — ниже в списке. Отметка "выполнено" и любые другие
    // правки статуса sort_order не трогают — задача остаётся на месте, пока
    // её не перетащат руками (см. setTaskSortOrder).
    function sortByOrder(tasks) {
      return [...tasks].sort((a, b) => a.sort_order - b.sort_order);
    }

    // Кружок статуса — общий для Инбокса и Вчера/Сегодня/календаря
    // (Phase 14): выполнено — галочка, событие (не выполнено) — булавка
    // внутри кружка вместо отдельного значка рядом с текстом, иначе пусто.
    function renderStatusCircle(task, isPending, onClick) {
      const circle = document.createElement("button");
      circle.className = "checkbox" + (task.done ? " done" : "");
      circle.disabled = isPending;
      circle.setAttribute("aria-label", task.done ? "Снять отметку" : "Отметить выполненной");
      if (task.done) circle.innerHTML = checkIcon();
      else if (task.priority === "event") circle.innerHTML = eventPinIcon();
      circle.onclick = onClick;
      return circle;
    }

    // Важность — жирным шрифтом вместо отдельного флажка (Phase 14);
    // выполнено — тускло и зачёркнуто (см. CSS .title.done).
    function titleClass(task) {
      let cls = "title";
      if (!task.done && task.priority === "высокий") cls += " important";
      if (task.done) cls += " done";
      return cls;
    }

    // ---- Режим переноса (Phase 14) — зажимаешь список, кружки статуса
    // превращаются в ручки слева, текст показывается полностью без
    // статуса/приоритета, справа — отложенное удаление. Только один
    // список может быть в этом режиме одновременно (то же правило, что у
    // открытой шторки, см. openSwipeRow) — listKey однозначно определяет
    // список ("yesterday"/"today"/"inbox"/"cal:2026-09-01").
    let reorderActiveKey = null;
    let pendingArchiveIds = new Set();

    function isReorderActive(listKey) {
      return reorderActiveKey === listKey;
    }

    function enterReorderMode(listKey) {
      if (reorderActiveKey === listKey) return;
      closeOpenSwipeRow();
      reorderActiveKey = listKey;
      pendingArchiveIds = new Set();
      render();
    }

    function toggleReorderArchive(task) {
      if (pendingArchiveIds.has(task.id)) pendingArchiveIds.delete(task.id);
      else pendingArchiveIds.add(task.id);
      render();
    }

    // Тап по затемнению (см. .reorder-scrim) — единственный выход из
    // режима. Отмеченные задачи реально архивируются только сейчас, одним
    // batch-запросом, без подтверждения (сам режим переноса с явным
    // выходом — уже достаточная защита от случайного удаления).
    async function exitReorderMode() {
      const ids = Array.from(pendingArchiveIds);
      reorderActiveKey = null;
      pendingArchiveIds = new Set();
      if (ids.length === 0) {
        render();
        return;
      }
      ids.forEach((id) => pendingIds.add(id));
      render();
      try {
        await api("/miniapp/api/tasks/archive-batch", {
          method: "POST",
          body: JSON.stringify({ ids }),
        });
        ids.forEach((id) => removeTaskEverywhere(id));
      } catch (e) {
        alert("Не удалось удалить задачи.");
      } finally {
        ids.forEach((id) => pendingIds.delete(id));
        render();
      }
    }

    function removeTaskEverywhere(id) {
      for (const key of ["yesterday", "today"]) {
        if (!boardState.days[key]) continue;
        boardState.days[key].tasks = boardState.days[key].tasks.filter((t) => t.id !== id);
      }
      boardState.dated_tasks = (boardState.dated_tasks || []).filter((t) => t.id !== id);
      boardState.inbox = boardState.inbox.filter((t) => t.id !== id);
    }

    // Кладёт задачу во все секции, которым она сейчас соответствует (тот же
    // расчёт, что и на бэкенде в build_task_board) — используется после
    // любой правки done/due_date (и для вставки только что созданной задачи),
    // чтобы задача сама "переехала" куда нужно.
    function rebucketTask(task) {
      removeTaskEverywhere(task.id);
      const todayIso = boardState.days.today?.date;
      for (const key of ["yesterday", "today"]) {
        if (boardState.days[key] && task.due_date === boardState.days[key].date) {
          boardState.days[key].tasks.push(task);
        }
      }
      if (task.due_date) {
        boardState.dated_tasks.push(task);
      }
      if (todayIso && (task.due_date === null || (task.due_date < todayIso && !task.done))) {
        boardState.inbox.push(task);
      }
    }

    function tasksForDate(iso) {
      return (boardState.dated_tasks || []).filter((t) => t.due_date === iso);
    }

    function renderTaskRow(task, { showDateButton, showTrashButton, showMoveToToday }) {
      const row = document.createElement("div");
      row.className = "row" + (pendingIds.has(task.id) ? " pending" : "");
      const isPending = pendingIds.has(task.id);

      const checkbox = renderStatusCircle(task, isPending, () => toggleTaskDone(task));

      const title = document.createElement("span");
      title.className = titleClass(task);
      title.textContent = task.title;

      row.append(checkbox, title);

      if (showDateButton && !task.done) {
        const dateBtn = document.createElement("button");
        dateBtn.className = "small-btn";
        dateBtn.disabled = isPending;
        dateBtn.setAttribute("aria-label", "Поставить дату");
        dateBtn.innerHTML = calendarIcon();

        const dateInput = document.createElement("input");
        dateInput.type = "date";
        dateInput.onchange = () => {
          if (!dateInput.value) return;
          setTaskDueDate(task, dateInput.value);
        };
        dateBtn.onclick = () => (dateInput.showPicker ? dateInput.showPicker() : dateInput.click());
        dateBtn.append(dateInput);
        row.append(dateBtn);
      }

      if (showTrashButton) {
        const archiveBtn = document.createElement("button");
        archiveBtn.className = "small-btn archive-btn";
        archiveBtn.disabled = isPending;
        archiveBtn.setAttribute("aria-label", "Удалить задачу");
        archiveBtn.innerHTML = archiveIcon();
        archiveBtn.onclick = () => archiveTask(task);
        row.append(archiveBtn);
      }

      if (showMoveToToday && !task.done) {
        const moveBtn = document.createElement("button");
        moveBtn.className = "small-btn";
        moveBtn.disabled = isPending;
        moveBtn.setAttribute("aria-label", "Перенести на сегодня");
        moveBtn.innerHTML = moveToTodayIcon();
        moveBtn.onclick = () => setTaskDueDate(task, boardState.days.today.date);
        row.append(moveBtn);
      }

      return row;
    }

    const SWIPE_MAX_REVEAL = 176; // 4 кнопки по 44px
    const SWIPE_OPEN_THRESHOLD = SWIPE_MAX_REVEAL * 0.2; // открыть — лёгкий свайп, то же место (зона)
    const SWIPE_CLOSE_THRESHOLD = 28; // закрыть из зоны — хватит совсем лёгкого движения

    // Одна открытая шторка на всё приложение — открытие любой другой её
    // закрывает (см. setupSwipeDrag), плюс общий обработчик клика ниже.
    // openSwipeRow — хэндл ТЕКУЩЕГО DOM-инстанса шторки; openSwipeTaskId —
    // id задачи, чья шторка должна быть открыта, переживает render(). Кнопки
    // важности/события специально не закрывают шторку, а render() внутри
    // них пересоздаёт всю строку заново — без этого id открытая шторка
    // "забывалась" бы на первом же тапе по одной из этих кнопок.
    let openSwipeRow = null;
    let openSwipeTaskId = null;

    function closeOpenSwipeRow() {
      if (openSwipeRow) {
        openSwipeRow.close();
        openSwipeRow = null;
      }
      openSwipeTaskId = null;
    }

    // Клик где угодно, пока шторка открыта, закрывает её — включая клик по
    // левой (неподвижной) части этой же задачи вместо её обычного действия.
    // Кнопки внутри самой шторки и активный пикер даты/времени — исключение,
    // у них своя обработка. Слушаем на фазе перехвата и глушим событие, иначе
    // первый тап и закрыл бы шторку, и дошёл бы до чекбокса/т.п. под ней.
    document.addEventListener(
      "click",
      (e) => {
        if (!openSwipeRow) return;
        if (e.target.closest(".swipe-actions")) return;
        if (e.target.closest(".swipe-zone")) return;
        if (e.target.matches('input[type="date"], input[type="datetime-local"]')) return;
        closeOpenSwipeRow();
        e.stopPropagation();
        e.preventDefault();
      },
      true
    );

    // Палец двигает не саму строку, а ширину шторки с кнопками — строка
    // (.swipe-content) неподвижна, шторка (.swipe-actions) наезжает поверх
    // справа. Жест стартует только в узкой зоне у правого края (.swipe-zone,
    // см. CSS) — за её пределами палец достаётся внешней карусели
    // вчера/сегодня/неделя, как и на любом другом месте страницы.
    function setupSwipeDrag(zone, actions, taskId) {
      let startX = 0;
      let startY = 0;
      let curX = 0;
      let dragging = false;
      let open = false;

      function setReveal(px, animate) {
        actions.style.transition = animate ? "width 180ms ease" : "none";
        actions.style.width = px + "px";
      }

      const self = {
        close: () => {
          setReveal(0, true);
          open = false;
          if (openSwipeRow === self) {
            openSwipeRow = null;
            openSwipeTaskId = null;
          }
        },
        // Строка этой задачи только что пересоздана рендером, но её шторка
        // была открыта до этого (см. openSwipeTaskId) — восстанавливаем без
        // анимации, будто её никто и не закрывал.
        reopenInstant: () => {
          open = true;
          setReveal(SWIPE_MAX_REVEAL, false);
        },
      };

      zone.addEventListener("pointerdown", (e) => {
        startX = e.clientX;
        startY = e.clientY;
        curX = startX;
        dragging = false;
      });
      zone.addEventListener("pointermove", (e) => {
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if (!dragging) {
          // Жест больше вертикальный, чем горизонтальный — это скролл
          // страницы, не свайп задачи, не перехватываем.
          if (Math.abs(dx) < 6 || Math.abs(dy) > Math.abs(dx)) return;
          dragging = true;
          try {
            zone.setPointerCapture(e.pointerId);
          } catch (err) {
            // Не критично — жест продолжит работать и без захвата, просто
            // менее надёжно, если палец уйдёт далеко за пределы зоны.
          }
        }
        curX = e.clientX;
        let reveal = open ? SWIPE_MAX_REVEAL - dx : -dx;
        reveal = Math.max(0, Math.min(SWIPE_MAX_REVEAL, reveal));
        setReveal(reveal, false);
        e.preventDefault();
      });
      function endDrag() {
        if (!dragging) return;
        const dx = curX - startX;
        const wasOpen = open;
        const shouldOpen = wasOpen ? dx < SWIPE_CLOSE_THRESHOLD : dx < -SWIPE_OPEN_THRESHOLD;
        dragging = false;
        if (shouldOpen) {
          open = true;
          setReveal(SWIPE_MAX_REVEAL, true);
          if (openSwipeRow !== self) {
            closeOpenSwipeRow();
            openSwipeRow = self;
            openSwipeTaskId = taskId;
          }
        } else {
          // Через self.close() (не напрямую) — снаружи он переопределён,
          // чтобы применить отложенную пересортировку после смены
          // приоритета (см. renderSwipeableTaskRow).
          self.close();
        }
      }
      zone.addEventListener("pointerup", endDrag);
      zone.addEventListener("pointercancel", endDrag);

      // Пока шторка открыта, свайп вправо по всему её полю (не только по
      // зоне под ней) тоже закрывает — тем же лёгким порогом, что и
      // открытие. Так же гасим последующий клик по кнопке, если это был
      // именно свайп, а не тап — иначе после закрытия ещё и сработала бы
      // кнопка, на которой палец оказался в момент отпускания.
      let actionsStartX = 0;
      let actionsDragging = false;
      let actionsJustDragged = false;

      actions.addEventListener("pointerdown", (e) => {
        if (!open) return;
        actionsStartX = e.clientX;
        actionsDragging = false;
      });
      actions.addEventListener("pointermove", (e) => {
        if (!open) return;
        const dx = e.clientX - actionsStartX;
        if (!actionsDragging) {
          if (dx < 6) return; // движение влево или совсем небольшое — не наш жест
          actionsDragging = true;
          try {
            actions.setPointerCapture(e.pointerId);
          } catch (err) {
            // синтетические события в тестах — не критично
          }
        }
        setReveal(Math.max(0, Math.min(SWIPE_MAX_REVEAL, SWIPE_MAX_REVEAL - dx)), false);
        e.preventDefault();
      });
      function endActionsDrag(e) {
        if (!actionsDragging) return;
        const dx = e.clientX - actionsStartX;
        actionsDragging = false;
        actionsJustDragged = true;
        // На случай, если браузер вообще не синтезирует click после этого
        // драга (типично для тач-жестов) — флаг иначе остался бы висеть
        // true навсегда и глушил бы следующий, уже совсем не связанный тап.
        setTimeout(() => {
          actionsJustDragged = false;
        }, 300);
        if (dx >= SWIPE_OPEN_THRESHOLD) {
          self.close();
        } else {
          setReveal(SWIPE_MAX_REVEAL, true);
        }
      }
      actions.addEventListener("pointerup", endActionsDrag);
      actions.addEventListener("pointercancel", endActionsDrag);
      actions.addEventListener(
        "click",
        (e) => {
          if (!actionsJustDragged) return;
          actionsJustDragged = false;
          e.stopPropagation();
          e.preventDefault();
        },
        true
      );

      return self;
    }

    // Ручной порядок, только внутри режима переноса (Phase 14) — палец
    // двигает саму строку (translateY) через ручку слева, а её DOM-соседи
    // в том же списке уступают место: как только видимый центр
    // перетаскиваемой строки пересекает середину соседа, они меняются
    // местами через insertBefore, а накопленная разница высот
    // компенсируется в translateY — так что палец и строка остаются под
    // одним и тем же местом на экране всю дорогу, без скачков. Сам
    // boardState/render() не трогаем, пока палец не отпустили — это
    // только визуальное превью, реальный порядок пересчитывается и
    // сохраняется один раз на pointerup (см. persist/commitOrder ниже).
    // Деления на события/обычные больше нет (Phase 14) — сортируется всё
    // вместе, соседи ищутся среди ВСЕХ строк списка без фильтра по группе.
    const REORDER_HOLD_MS = 450;
    const REORDER_MOVE_THRESHOLD = 8;

    function dragSiblings(row, selector) {
      return Array.from(row.parentElement.children).filter((n) => n.matches(selector));
    }

    // Текущая FLIP-анимация каждого соседа (см. shiftSibling ниже) — нужна,
    // чтобы при смене направления свайпа корректно её прервать. Баг,
    // который здесь чинится: CSS-transition сбрасывался только на
    // следующий requestAnimationFrame, и если тот же сосед снова попадал
    // под свап раньше, чем этот кадр наступил (типичная ситуация именно
    // при развороте направления — палец снова пересекает недавно
    // пройденную границу), getBoundingClientRect() у "after" замерял
    // положение с ещё висящим старым transform поверх нового layout —
    // отсюда наложение/залипание. Web Animations API с явным .cancel()
    // решает это синхронно, без гонки за кадром (тот же класс бага,
    // независимо чинили во Flutter — see PR flutter/flutter#173241,
    // "ReorderableList items jumping when drag direction reverses
    // mid-animation").
    const siblingAnimations = new WeakMap();

    // Старт переноса — сразу с первого сдвига пальца после нажатия на
    // ручку, без задержки (удержание+вибро пробовали, но это чисто UX-слой
    // поверх самого фикса, на надёжность не влияет — убрали по просьбе,
    // усложняло жест). А вот что остаётся — и что как раз чинит исходный
    // баг ("работает, пока палец на самой ручке, ломается, стоит чуть
    // отклониться от вертикали"): pointermove/up/cancel слушаются на
    // document, а не на самой ручке. Раньше слушали прямо на ручке и
    // полагались на setPointerCapture, чтобы продолжать получать события,
    // даже когда палец уходит за её 22px-границы — но в Telegram WebView
    // это не всегда надёжно: стоило пальцу отклониться от вертикали за
    // пределы иконки, событий больше не приходило вовсе, перенос зависал
    // навсегда с повисшим transform и тенью поверх соседней задачи. На
    // document такой границы просто нет — не важно, где физически
    // находится палец, X-координата в самой логике переноса вообще не
    // участвует, только Y.
    function setupDragReorder({ row, trigger, rowSelector, getSortOrder, persist }) {
      let dragging = false;
      let moved = false; // реальный перенос состоялся — подавляет клик по названию
      let pointerId = null;
      let startY = 0; // точка отсчёта dy — пересчитывается на момент хвата (beginDrag), не на pointerdown
      let curY = 0; // последняя известная позиция пальца, обновляется всё время, пока указатель "нажат"
      let compensation = 0; // накопленная поправка от свапов соседей
      let lastDy = 0;
      let settleAnim = null; // доводка ЭТОЙ строки при отпускании (endDrag), если ещё идёт

      function applyTransform(dy) {
        lastDy = dy;
        row.style.transform = `translateY(${compensation + dy}px)`;
      }

      // Соседа, которого строка обгоняет, плавно сдвигаем на освободившееся
      // место (FLIP: запоминаем его позицию до перестановки DOM, применяем
      // разницу как мгновенный transform, затем этот transform анимируем в
      // 0) — без этого сосед просто телепортировался бы на новое место.
      // Порядок важен: "before" читаем ДО отмены старой анимации — это
      // реальная видимая позиция соседа прямо сейчас, даже если он ещё
      // едет по недоигранной анимации с прошлого свапа (иначе — тот же
      // "прыжок к устаревшей стартовой точке", что чинили во Flutter).
      // А вот "after" должен быть чистым — старую анимацию отменяем
      // именно между этими двумя замерами, до mutate/после before.
      function shiftSibling(sib, mutate) {
        const before = sib.getBoundingClientRect().top;
        const prevAnim = siblingAnimations.get(sib);
        if (prevAnim) prevAnim.cancel();
        mutate();
        const after = sib.getBoundingClientRect().top;
        const delta = before - after;
        siblingAnimations.delete(sib);
        if (delta === 0) return;
        const anim = sib.animate(
          [{ transform: `translateY(${delta}px)` }, { transform: "translateY(0px)" }],
          { duration: 160, easing: "ease" }
        );
        siblingAnimations.set(sib, anim);
        anim.finished.catch(() => {}).finally(() => {
          if (siblingAnimations.get(sib) === anim) siblingAnimations.delete(sib);
        });
      }

      // Цикл, а не одна перестановка за вызов — на резком рывке между
      // двумя pointermove палец может пролететь сразу через несколько
      // соседей, и если остановиться на первом же свапе, строка визуально
      // не "догонит" палец до конца жеста (см. баг с залипанием/наложением
      // при резком отпускании). Продолжаем, пока не перестанем находить,
      // кого обгонять.
      function tryReorder() {
        let swapped = true;
        while (swapped) {
          swapped = false;
          const rect = row.getBoundingClientRect();
          const centerY = rect.top + rect.height / 2;
          const all = dragSiblings(row, rowSelector);
          const rowIndex = all.indexOf(row);
          for (let i = 0; i < all.length; i++) {
            const sib = all[i];
            if (sib === row) continue;
            const sRect = sib.getBoundingClientRect();
            const sCenter = sRect.top + sRect.height / 2;
            if (i < rowIndex && centerY < sCenter) {
              shiftSibling(sib, () => row.parentElement.insertBefore(row, sib));
              compensation += sRect.height;
              applyTransform(lastDy);
              swapped = true;
              break;
            }
            if (i > rowIndex && centerY > sCenter) {
              shiftSibling(sib, () => row.parentElement.insertBefore(row, sib.nextSibling));
              compensation -= sRect.height;
              applyTransform(lastDy);
              swapped = true;
              break;
            }
          }
        }
      }

      function beginDrag() {
        closeOpenSwipeRow();
        if (!row.isConnected) {
          // Открытая шторка ЭТОЙ ЖЕ строки только что закрылась с
          // отложенной пересортировкой (needsResortOnClose, см.
          // renderSwipeableTaskRow) — render() внутри closeOpenSwipeRow уже
          // пересобрал список и заменил этот DOM-узел новым, продолжать
          // перенос старым узлом больше некуда, тихо отменяем.
          cleanupPointer();
          return;
        }
        // startY уже выставлен в pointerdown — не трогаем его здесь: это и
        // есть точка отсчёта для самого первого кадра переноса. (Раньше,
        // при удержании, тут был пересчёт на текущую позицию — но раз
        // старт мгновенный, curY на момент этого вызова равен той же
        // точке, что палец только что достиг, и пересчёт обнулил бы сам
        // первый скачок движения.)
        dragging = true;
        moved = true;
        // Строку схватили заново раньше, чем доспела доводка предыдущего
        // переноса — прерываем её синхронно (см. shiftSibling выше про
        // ту же идею для соседей): .cancel() не оставляет зависшего
        // transition, который иначе ехал бы поверх нового переноса.
        if (settleAnim) {
          settleAnim.cancel();
          settleAnim = null;
        }
        row.classList.add("reorder-dragging");
        compensation = 0;
        applyTransform(0);
      }

      function commitOrder() {
        const all = dragSiblings(row, rowSelector);
        const idx = all.indexOf(row);
        const prevOrder = idx > 0 ? getSortOrder(all[idx - 1]) : null;
        const nextOrder = idx < all.length - 1 ? getSortOrder(all[idx + 1]) : null;
        let newOrder;
        if (prevOrder != null && nextOrder != null) newOrder = (prevOrder + nextOrder) / 2;
        else if (prevOrder != null) newOrder = prevOrder + 1000;
        else if (nextOrder != null) newOrder = nextOrder - 1000;
        else return; // единственная строка в группе — переставлять некуда
        persist(newOrder);
      }

      function endDrag(commit) {
        if (dragging) {
          // Доводка — translateY плавно едет от текущего положения (то,
          // что прямо сейчас в row.style.transform) к 0 — это ровно её
          // место в DOM, все свапы уже применены. Тень/приподнятость
          // снимаем и boardState фиксируем только после того, как анимация
          // реально закончилась. Раньше сброс был мгновенным (плюс гонка
          // за requestAnimationFrame у соседей, см. shiftSibling) — на
          // резком рывке+отпускании это выглядело как строка, застрявшая
          // поверх соседней.
          const anim = row.animate(
            [{ transform: row.style.transform || "translateY(0px)" }, { transform: "translateY(0px)" }],
            { duration: 180, easing: "cubic-bezier(0.22, 1, 0.36, 1)" }
          );
          settleAnim = anim;
          anim.finished
            .then(() => {
              if (settleAnim !== anim) return; // отменена более новым переносом (см. beginDrag) — уже неактуальна
              settleAnim = null;
              row.classList.remove("reorder-dragging");
              row.style.transform = "";
              if (commit) commitOrder();
            })
            .catch(() => {
              // anim.cancel() отклоняет finished — ожидаемый путь, когда
              // строку схватили заново раньше, чем доспела эта доводка
              // (см. settleAnim.cancel() в beginDrag).
            });
        }
        dragging = false;
        pointerId = null;
      }

      // Слушатели висят на document только пока этот конкретный указатель
      // "нажат" (от pointerdown на ручке до pointerup/pointercancel) —
      // снимаются сразу же в cleanupPointer, а не остаются на весь срок
      // жизни строки: иначе на списке из десятков задач копились бы
      // десятки document-обработчиков одновременно.
      function onDocPointerMove(e) {
        if (pointerId === null || e.pointerId !== pointerId) return;
        curY = e.clientY;
        if (!dragging) {
          // Первый же сдвиг после нажатия на ручку — сразу перенос, без
          // задержки (beginDrag сам возьмёт curY как точку отсчёта).
          beginDrag();
          if (!dragging) return; // строка исчезла — см. beginDrag
        }
        applyTransform(curY - startY);
        tryReorder();
        e.preventDefault();
      }

      function onDocPointerUp(e) {
        if (pointerId === null || e.pointerId !== pointerId) return;
        endDrag(dragging);
        cleanupPointer();
      }

      function onDocPointerCancel(e) {
        if (pointerId === null || e.pointerId !== pointerId) return;
        endDrag(false);
        cleanupPointer();
      }

      function cleanupPointer() {
        document.removeEventListener("pointermove", onDocPointerMove);
        document.removeEventListener("pointerup", onDocPointerUp);
        document.removeEventListener("pointercancel", onDocPointerCancel);
        pointerId = null;
      }

      trigger.addEventListener("pointerdown", (e) => {
        if (pointerId !== null) return; // уже держим один палец — второй игнорируем
        pointerId = e.pointerId;
        startY = e.clientY;
        curY = e.clientY;
        dragging = false;
        moved = false;
        document.addEventListener("pointermove", onDocPointerMove);
        document.addEventListener("pointerup", onDocPointerUp);
        document.addEventListener("pointercancel", onDocPointerCancel);
      });

      return {
        // Клик по названию (инлайн-правка) проверяет это перед тем как
        // открыть поле ввода — реальный перенос не должен ещё и включить
        // редактирование текста тем же жестом.
        wasDragged: () => moved,
      };
    }

    // Строка задачи со свайп-шторкой — Вчера/Сегодня/календарь. Инбокс
    // держит свой renderTaskRow с всегда видимыми иконками (см. render()) —
    // там свайп ни к чему, действия там нужны мгновенно, без лишнего жеста.
    function renderSwipeableTaskRow(task, { showMoveToToday }) {
      const isPending = pendingIds.has(task.id);
      let swipeHandle = null; // назначим после setupSwipeDrag ниже
      // true, если приоритет поменяли, пока шторка была открыта — тогда
      // полный render() (пересортировка/смена группы) откладываем до
      // закрытия, см. syncPriorityUI и переопределение swipeHandle.close
      // ниже.
      let needsResortOnClose = false;

      const wrap = document.createElement("div");
      wrap.className = "swipe-wrap" + (isPending ? " pending" : "");

      const actions = document.createElement("div");
      actions.className = "swipe-actions";

      // Важность и событие — два независимых значка-переключателя вместо
      // одной кнопки-цикла: нажал один — стал ярким, нажал другой — первый
      // гаснет (оба значения живут в одном и том же поле priority, поэтому
      // взаимоисключающие). Повторный тап по уже активному — снятие,
      // возврат к нейтральному приоритету.
      const importantBtn = document.createElement("button");
      importantBtn.className = "swipe-btn" + (task.priority === "высокий" ? " active" : "");
      importantBtn.disabled = isPending;
      importantBtn.setAttribute("aria-label", "Важная задача");
      importantBtn.innerHTML = importantIcon();
      // Панель специально НЕ закрываем здесь — можно сразу передумать и
      // тапнуть другой значок, не открывая шторку заново. Полный render()
      // (который пересортировал бы список и мог унести строку в другую
      // группу) тоже откладываем — см. syncPriorityUI/needsResortOnClose
      // ниже: список перестроится только когда шторку закроют, а не прямо
      // во время работы с ней.
      importantBtn.onclick = () => {
        needsResortOnClose = true;
        setTaskPriority(
          task,
          task.priority === "высокий" ? "средний" : "высокий",
          syncPriorityUI
        );
      };

      const eventBtn = document.createElement("button");
      eventBtn.className = "swipe-btn" + (task.priority === "event" ? " active" : "");
      eventBtn.disabled = isPending;
      eventBtn.setAttribute("aria-label", "Событие");
      eventBtn.innerHTML = eventPinIcon();
      eventBtn.onclick = () => {
        needsResortOnClose = true;
        setTaskPriority(task, task.priority === "event" ? "средний" : "event", syncPriorityUI);
      };

      const dateBtn = document.createElement("button");
      dateBtn.className = "swipe-btn";
      dateBtn.disabled = isPending;
      dateBtn.setAttribute("aria-label", "Дата и время");
      dateBtn.innerHTML = calendarIcon();
      const dateInput = document.createElement("input");
      // Для события сразу дата+время одним пикером; для обычной задачи —
      // только дата, как и было, без лишнего поля под редкий случай.
      dateInput.type = task.priority === "event" ? "datetime-local" : "date";
      dateInput.onchange = () => {
        if (!dateInput.value) return;
        swipeHandle.close();
        setTaskDueDate(task, dateInput.value);
      };
      dateBtn.onclick = () => (dateInput.showPicker ? dateInput.showPicker() : dateInput.click());
      dateBtn.append(dateInput);

      const archiveBtn = document.createElement("button");
      archiveBtn.className = "swipe-btn swipe-btn-archive";
      archiveBtn.disabled = isPending;
      archiveBtn.setAttribute("aria-label", "Архивировать");
      archiveBtn.innerHTML = archiveIcon();
      archiveBtn.onclick = () => archiveTask(task);

      actions.append(importantBtn, eventBtn, dateBtn, archiveBtn);

      const content = document.createElement("div");
      content.className = "swipe-content";

      const checkbox = renderStatusCircle(task, isPending, () => toggleTaskDone(task));
      content.append(checkbox);

      // Текст только читается здесь — правка доступна лишь в режиме
      // переноса (Phase 14, см. renderReorderRow), поэтому у заголовка
      // намеренно нет обработчика клика.
      const title = document.createElement("span");
      title.className = titleClass(task);
      title.textContent = task.title;
      content.append(title);

      if (task.due_time) {
        const time = document.createElement("span");
        time.className = "due-time";
        time.textContent = task.due_time;
        content.append(time);
      }

      if (showMoveToToday && !task.done) {
        const moveBtn = document.createElement("button");
        moveBtn.className = "small-btn";
        moveBtn.disabled = isPending;
        moveBtn.setAttribute("aria-label", "Перенести на сегодня");
        moveBtn.innerHTML = moveToTodayIcon();
        moveBtn.onclick = () => setTaskDueDate(task, boardState.days.today.date);
        content.append(moveBtn);
      }

      const handle = document.createElement("span");
      handle.className = "swipe-handle";
      content.append(handle);

      // Узкая зона у правого края — единственное место, откуда стартует
      // свайп этой задачи (см. .swipe-zone в CSS). Вне её палец отдаём
      // внешней карусели вчера/сегодня/неделя, как везде на странице.
      const zone = document.createElement("span");
      zone.className = "swipe-zone";
      content.append(zone);

      // Обновляет активность значков важности/события, тип пикера даты
      // (для события — сразу с временем), содержимое кружка статуса и
      // жирность заголовка — без пересборки всей строки и без изменения
      // её позиции в списке. Вызывается вместо render() из
      // importantBtn/eventBtn, пока шторка открыта (см. needsResortOnClose
      // ниже).
      function syncPriorityUI() {
        importantBtn.classList.toggle("active", task.priority === "высокий");
        eventBtn.classList.toggle("active", task.priority === "event");
        const stillPending = pendingIds.has(task.id);
        importantBtn.disabled = stillPending;
        eventBtn.disabled = stillPending;
        dateInput.type = task.priority === "event" ? "datetime-local" : "date";

        checkbox.innerHTML = task.done ? checkIcon() : task.priority === "event" ? eventPinIcon() : "";
        title.className = titleClass(task);
      }

      wrap.append(actions, content);
      swipeHandle = setupSwipeDrag(zone, actions, task.id);

      // Если приоритет меняли при открытой шторке, список пересортируем и
      // перегруппируем только сейчас, в момент закрытия — не посреди
      // работы с панелью (вдруг следом ещё и дату хотели выбрать).
      const baseClose = swipeHandle.close;
      swipeHandle.close = () => {
        baseClose();
        if (needsResortOnClose) {
          needsResortOnClose = false;
          render();
        }
      };

      if (task.id === openSwipeTaskId) {
        // Эту же задачу только что пересобрал render() (например, после
        // закрытия шторки с изменённым приоритетом) — её шторка была
        // открыта, восстанавливаем без анимации.
        swipeHandle.reopenInstant();
        openSwipeRow = swipeHandle;
      }
      return wrap;
    }

    function renderEmpty(container) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Пусто";
      container.append(empty);
    }

    // Значок статуса и заголовок с курсором в точке тапа заменяются на
    // поле ввода — тянуть каретку в сторону не нужно, это уже умеет сам
    // телефон (нативная ручка-капелька под курсором есть у любого
    // сфокусированного текстового поля на iOS/Android).
    function startReorderInlineEdit(row, title, task, clickX) {
      const input = document.createElement("input");
      input.type = "text";
      input.className = "title-edit title-full";
      input.value = task.title;
      row.replaceChild(input, title);
      input.focus();
      let idx = task.title.length;
      try {
        const rect = row.getBoundingClientRect();
        const range = document.caretRangeFromPoint
          ? document.caretRangeFromPoint(clickX, rect.top + rect.height / 2)
          : null;
        if (range && row.contains(range.startContainer)) idx = range.startOffset;
      } catch (err) {
        // Не критично — просто останется курсор в конце.
      }
      input.setSelectionRange(idx, idx);

      function finish(commit) {
        input.removeEventListener("blur", onBlur);
        input.removeEventListener("keydown", onKeydown);
        input.removeEventListener("dblclick", onDblClick);
        if (commit) {
          const trimmed = input.value.trim();
          if (trimmed && trimmed !== task.title) {
            title.textContent = trimmed;
            renameTask(task, trimmed);
          }
        }
        row.replaceChild(title, input);
      }
      function onBlur() {
        finish(true);
      }
      function onKeydown(e) {
        if (e.key === "Enter") {
          e.preventDefault();
          input.blur();
        } else if (e.key === "Escape") {
          finish(false);
        }
      }
      // При 2 нажатии в режиме редактирования — выделить текст целиком.
      function onDblClick() {
        input.select();
      }
      input.addEventListener("blur", onBlur);
      input.addEventListener("keydown", onKeydown);
      input.addEventListener("dblclick", onDblClick);
    }

    // Строка в режиме переноса (Phase 14) — общая и для Вчера/Сегодня/
    // календаря, и для Инбокса: слева ручка вместо кружка статуса, текст
    // целиком без усечения и без жирности/зачёркивания (никакого
    // статуса/приоритета в этом режиме не показываем), справа — отложенное
    // удаление (архивируется пачкой при выходе из режима, см.
    // toggleReorderArchive/exitReorderMode).
    function renderReorderRow(task, ctx) {
      const isPending = pendingIds.has(task.id);
      const markedForArchive = pendingArchiveIds.has(task.id);

      const row = document.createElement("div");
      row.className =
        "row reorder-row" + (isPending ? " pending" : "") + (markedForArchive ? " pending-archive" : "");
      row.dataset.sortOrder = String(task.sort_order);

      const grip = document.createElement("span");
      grip.className = "grip";
      grip.setAttribute("aria-label", "Перетащить");
      grip.innerHTML = gripIcon();
      row.append(grip);

      const title = document.createElement("span");
      title.className = "title title-full";
      title.textContent = task.title;
      row.append(title);

      const dragCtl = setupDragReorder({
        row,
        trigger: grip,
        rowSelector: ".reorder-row",
        getSortOrder: (el) => parseFloat(el.dataset.sortOrder),
        persist: (newOrder) => setTaskSortOrder(task, newOrder),
      });

      title.onclick = (e) => {
        if (isPending || markedForArchive || dragCtl.wasDragged()) return;
        startReorderInlineEdit(row, title, task, e.clientX);
      };

      const archiveBtn = document.createElement("button");
      archiveBtn.className = "small-btn reorder-archive-btn" + (markedForArchive ? " marked" : "");
      archiveBtn.disabled = isPending;
      archiveBtn.setAttribute("aria-label", markedForArchive ? "Отменить удаление" : "Удалить задачу");
      archiveBtn.innerHTML = markedForArchive ? undoIcon() : archiveIcon();
      archiveBtn.onclick = () => toggleReorderArchive(task);
      row.append(archiveBtn);

      return row;
    }

    function renderList(container, tasks, ctx) {
      const reorderMode = isReorderActive(ctx.listKey);
      // Список в режиме переноса рисуется выше затемняющего фона (см.
      // .reorder-active-list в CSS) — тем самым и выглядит "на переднем
      // плане", а всё остальное на странице просто перекрыто .reorder-scrim.
      container.classList.toggle("reorder-active-list", reorderMode);
      container.innerHTML = "";
      const sorted = sortByOrder(tasks);
      if (sorted.length === 0) {
        renderEmpty(container);
        return;
      }
      sorted.forEach((t) => {
        if (reorderMode) {
          container.append(renderReorderRow(t, ctx));
        } else if (ctx.style === "swipe") {
          container.append(renderSwipeableTaskRow(t, ctx));
        } else {
          container.append(renderTaskRow(t, ctx));
        }
      });
    }

    // Долгое нажатие где угодно в поле списка (500мс без сдвига > 8px)
    // включает режим переноса для этого списка (см. enterReorderMode).
    // Исключены только элементы с собственной, уже занятой семантикой
    // жеста — чекбокс/кнопки/свайп-зона/шторка/поля ввода — иначе долгий
    // палец на них тоже включил бы перенос, отбирая жест у их обычного
    // тапа/свайпа.
    function attachReorderEntry(container, listKey) {
      let timer = null;
      let startX = 0;
      let startY = 0;
      function clear() {
        clearTimeout(timer);
        timer = null;
      }
      container.addEventListener("pointerdown", (e) => {
        if (isReorderActive(listKey)) return;
        if (e.target.closest(".checkbox, .small-btn, .swipe-zone, .swipe-actions, input")) return;
        startX = e.clientX;
        startY = e.clientY;
        clear();
        timer = setTimeout(() => enterReorderMode(listKey), REORDER_HOLD_MS);
      });
      container.addEventListener("pointermove", (e) => {
        if (!timer) return;
        if (Math.abs(e.clientX - startX) > REORDER_MOVE_THRESHOLD || Math.abs(e.clientY - startY) > REORDER_MOVE_THRESHOLD) {
          clear();
        }
      });
      container.addEventListener("pointerup", clear);
      container.addEventListener("pointercancel", clear);
    }

    const _dayOpts = {
      yesterday: { listKey: "yesterday", style: "swipe", showMoveToToday: true },
      today: { listKey: "today", style: "swipe", showMoveToToday: false },
    };

    const WEEKDAY_LABELS = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
    let selectedWeekDate = null;
    let weekStart = null; // ISO понедельника недели, которая сейчас показана

    function computeWeekStart(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d));
      const weekday = (dt.getUTCDay() + 6) % 7; // Пн=0 ... Вс=6
      dt.setUTCDate(dt.getUTCDate() - weekday);
      return dt.toISOString().slice(0, 10);
    }

    function weekDotState(tasks) {
      // Пустой день — совсем без точки (null), не отдельный визуальный
      // "пустой" вариант — раньше это был класс "empty", который случайно
      // совпадал с общим .empty (плейсхолдер "список пуст") и тянул чужие
      // стили.
      if (tasks.length === 0) return null;
      const important = tasks.some((t) => t.priority === "высокий" || t.priority === "event");
      if (important || tasks.length > 5) return "bright";
      if (tasks.length >= 4) return "medium";
      return "dim";
    }

    function fillWeekGrid(gridEl, wStart) {
      gridEl.innerHTML = "";
      const todayIso = boardState.days.today?.date;
      for (let i = 0; i < 7; i++) {
        const iso = addDaysIso(wStart, i);
        const tasks = tasksForDate(iso);
        const cell = document.createElement("button");
        cell.className =
          "week-cell" + (iso === todayIso ? " today" : "") + (iso === selectedWeekDate ? " selected" : "");

        const label = document.createElement("span");
        label.className = "wc-label";
        label.textContent = WEEKDAY_LABELS[i];

        const num = document.createElement("span");
        num.className = "wc-num";
        num.textContent = String(parseInt(iso.slice(8, 10), 10));

        const dot = document.createElement("span");
        const state = weekDotState(tasks);
        dot.className = "week-dot" + (state ? " " + state : "");

        cell.append(label, num, dot);
        cell.onclick = () => {
          selectedWeekDate = selectedWeekDate === iso ? null : iso;
          renderWeekCarousel();
          renderWeekDetail();
        };
        gridEl.append(cell);
      }
    }

    const _weekGridEls = {
      prev: document.querySelector('#week-carousel .week-grid[data-slot="prev"]'),
      current: document.querySelector('#week-carousel .week-grid[data-slot="current"]'),
      next: document.querySelector('#week-carousel .week-grid[data-slot="next"]'),
    };

    // Три панели (пред./тек./след. неделя) — контент недель-соседей уже
    // готов заранее, чтобы во время свайпа (перетаскивания .week-track)
    // они сразу были видны по бокам, ещё до того как мы решим, что жест
    // завершён.
    function renderWeekCarousel() {
      if (!weekStart) return;
      fillWeekGrid(_weekGridEls.prev, addDaysIso(weekStart, -7));
      fillWeekGrid(_weekGridEls.current, weekStart);
      fillWeekGrid(_weekGridEls.next, addDaysIso(weekStart, 7));
    }

    function renderWeekDetail() {
      const el = document.getElementById("week-day-detail");
      el.innerHTML = "";
      if (!selectedWeekDate) return;

      const listKey = "cal:" + selectedWeekDate;
      const listEl = document.createElement("div");
      listEl.className = "list";
      attachReorderEntry(listEl, listKey);
      renderList(listEl, tasksForDate(selectedWeekDate), {
        listKey,
        style: "swipe",
        showMoveToToday: false,
      });
      el.append(listEl);

      const addRow = document.createElement("div");
      addRow.className = "add-row";
      const input = document.createElement("input");
      input.type = "text";
      input.placeholder = "Новая задача";
      const btn = document.createElement("button");
      btn.className = "icon-btn";
      btn.setAttribute("aria-label", "Добавить задачу");
      btn.innerHTML = plusIcon();
      btn.onclick = () => {
        const value = input.value.trim();
        if (!value) return;
        input.value = "";
        createTaskFor(selectedWeekDate, value);
      };
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") btn.click();
      });
      addRow.append(input, btn);
      el.append(addRow);
    }

    function renderInboxHeader() {
      const title = document.getElementById("inbox-title");
      title.textContent = boardState.inbox.length ? `Инбокс (${boardState.inbox.length})` : "Инбокс";
    }

    function render() {
      for (const key of ["yesterday", "today"]) {
        const el = document.getElementById(`${key}-list`);
        if (boardState.days[key]) renderList(el, boardState.days[key].tasks, _dayOpts[key]);
      }
      renderList(document.getElementById("inbox-list"), boardState.inbox, {
        listKey: "inbox",
        style: "plain",
        showDateButton: true,
        showTrashButton: true,
      });
      renderInboxHeader();
      renderWeekCarousel();
      renderWeekDetail();
      document.getElementById("reorder-scrim").classList.toggle("visible", reorderActiveKey !== null);
    }

    function addDaysIso(iso, days) {
      const [y, m, d] = iso.split("-").map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d));
      dt.setUTCDate(dt.getUTCDate() + days);
      return dt.toISOString().slice(0, 10);
    }

    async function loadBoard() {
      try {
        boardState = await api("/miniapp/api/tasks");
        const firstLoad = weekStart === null;
        if (firstLoad) {
          const tomorrowIso = addDaysIso(boardState.days.today.date, 1);
          weekStart = computeWeekStart(tomorrowIso);
          selectedWeekDate = tomorrowIso;
        }
        render();
        // Центрируем полоску недель на "текущей" (средней) панели только
        // при первой загрузке — на каждой перерисовке (после отметки
        // задачи и т.д.) позицию свайпа трогать нельзя.
        if (firstLoad) recenterWeekCarousel();
      } catch (e) {
        document.getElementById("today-list").innerHTML =
          '<div class="empty">Не удалось загрузить задачи.</div>';
      }
    }

    async function toggleTaskDone(task) {
      const id = task.id;
      const newDone = !task.done;
      const prevDone = task.done;
      task.done = newDone;
      pendingIds.add(id);
      rebucketTask(task);
      render();
      try {
        await api(`/miniapp/api/tasks/${encodeURIComponent(id)}/done`, {
          method: "POST",
          body: JSON.stringify({ done: newDone }),
        });
      } catch (e) {
        task.done = prevDone;
        rebucketTask(task);
        alert("Не удалось обновить статус.");
      } finally {
        pendingIds.delete(id);
        render();
      }
    }

    async function setTaskDueDate(task, value) {
      // value — либо чистая дата ("2026-09-01", обычный <input type=date>),
      // либо datetime-local ("2026-09-01T14:30", событие со временем).
      // due_date локально остаётся чистой датой (им живёт вся бакетизация
      // по дням), время — отдельно в due_time; на бэкенд шлём value целиком,
      // там разбирается на timestamp.
      const id = task.id;
      const prevDate = task.due_date;
      const prevTime = task.due_time;
      const prevSortOrder = task.sort_order;
      task.due_date = value.slice(0, 10);
      task.due_time = value.length > 10 ? value.slice(11, 16) : null;
      // Как и на бэкенде (см. api.py set_task_due_date) — перенос на другой
      // день уносит задачу в конец списка того дня, а не оставляет её на
      // случайной позиции среди задач, с которыми она физически больше не
      // соседствует.
      task.sort_order = Date.now();
      pendingIds.add(id);
      rebucketTask(task);
      render();
      try {
        await api(`/miniapp/api/tasks/${encodeURIComponent(id)}/due-date`, {
          method: "POST",
          body: JSON.stringify({ due_date: value }),
        });
      } catch (e) {
        task.due_date = prevDate;
        task.due_time = prevTime;
        task.sort_order = prevSortOrder;
        rebucketTask(task);
        alert("Не удалось поставить дату.");
      } finally {
        pendingIds.delete(id);
        render();
      }
    }

    async function setTaskPriority(task, newPriority, onUpdate) {
      // onUpdate — необязательный "лёгкий" рендер вместо полного render():
      // пока свайп-шторка открыта, importantBtn/eventBtn передают сюда
      // syncPriorityUI, чтобы список не пересортировался прямо во время
      // работы с панелью (см. renderSwipeableTaskRow).
      const update = onUpdate || render;
      const id = task.id;
      const prevPriority = task.priority;
      const prevSortOrder = task.sort_order;
      task.priority = newPriority;
      // Как и на бэкенде (см. api.py set_task_priority) — смена приоритета
      // может переместить задачу между группой событий и обычных, поэтому
      // она уходит в конец новой группы, тем же правилом "новая — в конец".
      task.sort_order = Date.now();
      pendingIds.add(id);
      update();
      try {
        await api(`/miniapp/api/tasks/${encodeURIComponent(id)}/priority`, {
          method: "POST",
          body: JSON.stringify({ priority: task.priority }),
        });
      } catch (e) {
        task.priority = prevPriority;
        task.sort_order = prevSortOrder;
        update();
        alert("Не удалось изменить приоритет.");
      } finally {
        pendingIds.delete(id);
        update();
      }
    }

    // Перетаскивание (Phase 13) — newOrder уже посчитан вызывающей стороной
    // (setupDragReorder/commitOrder) как midpoint между финальными DOM-
    // соседями. Тот же optimistic-паттерн, что и у остальных правок задачи.
    async function setTaskSortOrder(task, newOrder) {
      const id = task.id;
      const prevOrder = task.sort_order;
      task.sort_order = newOrder;
      pendingIds.add(id);
      rebucketTask(task);
      render();
      try {
        await api(`/miniapp/api/tasks/${encodeURIComponent(id)}/reorder`, {
          method: "POST",
          body: JSON.stringify({ sort_order: newOrder }),
        });
      } catch (e) {
        task.sort_order = prevOrder;
        rebucketTask(task);
        alert("Не удалось изменить порядок.");
      } finally {
        pendingIds.delete(id);
        render();
      }
    }

    async function renameTask(task, newTitle) {
      const trimmed = newTitle.trim();
      if (!trimmed || trimmed === task.title) return;
      const id = task.id;
      const prevTitle = task.title;
      task.title = trimmed;
      pendingIds.add(id);
      render();
      try {
        await api(`/miniapp/api/tasks/${encodeURIComponent(id)}/title`, {
          method: "POST",
          body: JSON.stringify({ title: trimmed }),
        });
      } catch (e) {
        task.title = prevTitle;
        render();
        alert("Не удалось переименовать задачу.");
      } finally {
        pendingIds.delete(id);
        render();
      }
    }

    async function archiveTask(task) {
      const id = task.id;
      pendingIds.add(id);
      render();
      try {
        await api(`/miniapp/api/tasks/${encodeURIComponent(id)}/archive`, { method: "POST" });
        removeTaskEverywhere(id);
      } catch (e) {
        alert("Не удалось удалить задачу.");
      } finally {
        pendingIds.delete(id);
        render();
      }
    }

    async function createTaskFor(dueDate, title) {
      // dueDate === null — валидный случай (задача для инбокса, без даты).
      // undefined — реальная ошибка (не нашли дату дня-источника).
      if (dueDate === undefined) return;
      const tempId = "pending-" + Date.now();
      const tempTask = {
        id: tempId,
        title,
        due_date: dueDate,
        due_time: null,
        priority: "средний",
        done: false,
        // Заведомо больше всех существующих sort_order — "в конец" ровно
        // так же, как задаёт колонка по умолчанию на бэкенде (см.
        // models/task.py, default=time.time), пока сервер не подтвердит
        // настоящее значение.
        sort_order: Date.now(),
      };
      pendingIds.add(tempId);
      rebucketTask(tempTask);
      render();
      try {
        const result = await api("/miniapp/api/tasks", {
          method: "POST",
          body: JSON.stringify({ title, due_date: dueDate }),
        });
        tempTask.id = result.id;
      } catch (e) {
        removeTaskEverywhere(tempId);
        alert("Не удалось создать задачу.");
      } finally {
        pendingIds.delete(tempId);
        render();
      }
    }

    document.querySelectorAll(".day-page[data-day]").forEach((page) => {
      const day = page.dataset.day;
      const input = page.querySelector(".day-task-input");
      const btn = page.querySelector(".day-task-add");
      if (!input || !btn) return; // у страницы календаря своё динамическое поле ввода
      btn.innerHTML = plusIcon();
      btn.onclick = () => {
        const value = input.value.trim();
        if (!value) return;
        input.value = "";
        createTaskFor(boardState.days[day]?.date, value);
      };
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") btn.click();
      });
    });

    // Необязательная дата прямо в строке создания — значок календаря внутри
    // поля. Если дату выбрали, задача создаётся сразу с ней и в инбокс,
    // естественно, не попадёт (build_task_board берёт туда только задачи
    // без даты или просроченные).
    let inboxPendingDate = null;
    const inboxDateBtn = document.getElementById("inbox-date-btn");
    const inboxDateInput = document.createElement("input");
    inboxDateBtn.innerHTML = calendarIcon();
    inboxDateInput.type = "date";
    inboxDateInput.onchange = () => {
      inboxPendingDate = inboxDateInput.value || null;
      inboxDateBtn.classList.toggle("date-set", !!inboxPendingDate);
    };
    inboxDateBtn.onclick = () =>
      inboxDateInput.showPicker ? inboxDateInput.showPicker() : inboxDateInput.click();
    inboxDateBtn.append(inboxDateInput);

    function resetInboxDateIcon() {
      inboxPendingDate = null;
      inboxDateInput.value = "";
      inboxDateBtn.classList.remove("date-set");
    }

    document.getElementById("add-inbox-btn").innerHTML = plusIcon();
    document.getElementById("add-inbox-btn").onclick = () => {
      const input = document.getElementById("new-inbox-input");
      const value = input.value.trim();
      if (!value) return;
      input.value = "";
      const dueDate = inboxPendingDate;
      resetInboxDateIcon();
      createTaskFor(dueDate, value);
    };
    document.getElementById("new-inbox-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("add-inbox-btn").click();
    });

    // Инбокс свёрнут по умолчанию — только заголовок со счётчиком, тап
    // разворачивает список и поле добавления.
    let inboxExpanded = false;
    document.getElementById("inbox-chevron").innerHTML = chevronIcon();
    document.getElementById("inbox-header").onclick = () => {
      inboxExpanded = !inboxExpanded;
      document.getElementById("inbox-body").style.display = inboxExpanded ? "" : "none";
      document.getElementById("inbox-chevron").classList.toggle("expanded", inboxExpanded);
    };

    // Долгое нажатие включает режим переноса в каждом из статических
    // списков (Вчера/Сегодня/Инбокс) — контейнеры переживают render()
    // (чистится только их innerHTML), так что слушатель достаточно
    // навесить один раз при загрузке. У календаря список пересоздаётся
    // заново на каждый выбранный день — там attachReorderEntry вызывается
    // прямо в renderWeekDetail().
    attachReorderEntry(document.getElementById("yesterday-list"), "yesterday");
    attachReorderEntry(document.getElementById("today-list"), "today");
    attachReorderEntry(document.getElementById("inbox-list"), "inbox");

    // Тап по затемнению — единственный выход из режима переноса (кнопки
    // "Готово" больше нет): список рисуется выше .reorder-scrim (см. CSS),
    // так что клики внутри него сюда не долетают — только клики "мимо".
    document.getElementById("reorder-scrim").addEventListener("click", () => exitReorderMode());

    // Полоска недель — палец двигает .week-track напрямую через transform
    // (1:1, без нативного скролла), а после отпускания доезжает ровно
    // одним нашим CSS-transition до целевой недели. Три панели
    // (пред./тек./след.) переиспользуются: после доезда JS подменяет их
    // данные и мгновенно (без анимации) возвращает transform в центр —
    // имитация бесконечной прокрутки без похода в сеть.
    const weekCarousel = document.getElementById("week-carousel");
    const weekTrack = document.getElementById("week-track");
    const weekPages = Array.from(document.querySelectorAll("#week-track .week-page"));

    const WEEK_PANEL_RATIO = 0.88; // ширина панели — вместе с WEEK_GAP даёт ~4% видимого peek с каждой стороны
    const WEEK_GAP = 8; // должен совпадать с gap в .week-track — съедает часть отступа между панелями
    const WEEK_DRAG_THRESHOLD = 0.22; // доля шага панели, после которой при отпускании переключаем неделю
    const WEEK_FLING_VELOCITY = 0.5; // px/мс — быстрый флик переключает неделю независимо от пройденного расстояния

    function weekGeometry() {
      const vw = weekCarousel.clientWidth;
      const pw = vw * WEEK_PANEL_RATIO;
      return { vw, pw, step: pw + WEEK_GAP };
    }

    function applyWeekPanelSizes() {
      const { pw } = weekGeometry();
      weekPages.forEach((el) => {
        el.style.width = pw + "px";
      });
    }

    function weekRestX(index) {
      const { vw, pw, step } = weekGeometry();
      return vw / 2 - (index * step + pw / 2);
    }

    function setWeekTrackTransform(x, withTransition) {
      weekTrack.style.transition = withTransition ? "transform 240ms cubic-bezier(0.22, 1, 0.36, 1)" : "none";
      weekTrack.style.transform = `translateX(${x}px)`;
    }

    function recenterWeekCarousel() {
      applyWeekPanelSizes();
      setWeekTrackTransform(weekRestX(1), false);
    }

    let weekDrag = null;
    let weekSettling = false;

    weekTrack.addEventListener("pointerdown", (e) => {
      if (weekSettling) return;
      weekDrag = {
        pointerId: e.pointerId,
        startX: e.clientX,
        baseX: weekRestX(1),
        dragging: false,
        lastX: e.clientX,
        lastTime: e.timeStamp,
        velocity: 0,
      };
    });

    weekTrack.addEventListener("pointermove", (e) => {
      if (!weekDrag || e.pointerId !== weekDrag.pointerId) return;
      const dx = e.clientX - weekDrag.startX;
      if (!weekDrag.dragging) {
        if (Math.abs(dx) < 6) return; // ещё не ясно, тап это или свайп — не мешаем клику по ячейке
        weekDrag.dragging = true;
        weekTrack.setPointerCapture(weekDrag.pointerId);
      }
      const dt = e.timeStamp - weekDrag.lastTime;
      if (dt > 0) weekDrag.velocity = (e.clientX - weekDrag.lastX) / dt;
      weekDrag.lastX = e.clientX;
      weekDrag.lastTime = e.timeStamp;
      setWeekTrackTransform(weekDrag.baseX + dx, false);
      e.preventDefault();
    });

    function endWeekDrag(e) {
      if (!weekDrag || e.pointerId !== weekDrag.pointerId) return;
      const drag = weekDrag;
      weekDrag = null;
      if (!drag.dragging) return; // тап — ничего не двигали, клик по ячейке отработает сам

      const dx = e.clientX - drag.startX;
      const { step } = weekGeometry();
      let targetIndex = 1;
      if (Math.abs(drag.velocity) > WEEK_FLING_VELOCITY) {
        targetIndex = drag.velocity < 0 ? 2 : 0;
      } else if (Math.abs(dx) > step * WEEK_DRAG_THRESHOLD) {
        targetIndex = dx < 0 ? 2 : 0;
      }
      settleWeekCarousel(targetIndex);
    }

    weekTrack.addEventListener("pointerup", endWeekDrag);
    weekTrack.addEventListener("pointercancel", endWeekDrag);

    function settleWeekCarousel(targetIndex) {
      weekSettling = true;
      setWeekTrackTransform(weekRestX(targetIndex), true);
      weekTrack.addEventListener(
        "transitionend",
        () => {
          weekSettling = false;
          if (targetIndex === 1) return; // просто откатились назад — неделя не поменялась
          weekStart = addDaysIso(weekStart, (targetIndex === 0 ? -1 : 1) * 7);
          selectedWeekDate = null;
          renderWeekCarousel();
          recenterWeekCarousel();
          renderWeekDetail();
          updateDayLabel();
        },
        { once: true }
      );
    }

    const MONTH_NAMES = [
      "январь", "февраль", "март", "апрель", "май", "июнь",
      "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь",
    ];

    function monthLabelForWeek(wStart) {
      const endIso = addDaysIso(wStart, 6);
      const startMonth = parseInt(wStart.slice(5, 7), 10) - 1;
      const endMonth = parseInt(endIso.slice(5, 7), 10) - 1;
      if (startMonth === endMonth) return MONTH_NAMES[startMonth];
      return `${MONTH_NAMES[startMonth]} — ${MONTH_NAMES[endMonth]}`;
    }

    const _dayLabels = ["Вчера", "Сегодня", "Неделя"];
    const carousel = document.getElementById("day-carousel");
    const dayLabel = document.getElementById("day-label");
    const dayDots = Array.from(document.querySelectorAll(".day-dot"));

    function scrollToDay(index) {
      carousel.scrollTo({ left: carousel.clientWidth * index, behavior: "smooth" });
    }

    function updateDayLabel() {
      const index = Math.round(carousel.scrollLeft / carousel.clientWidth);
      if (index === 2 && weekStart) {
        dayLabel.textContent = `Неделя, ${monthLabelForWeek(weekStart)}`;
      } else {
        dayLabel.textContent = _dayLabels[index] ?? "Сегодня";
      }
      dayDots.forEach((dot, i) => dot.classList.toggle("active", i === index));
    }

    // rAF-троттлинг вместо debounce на таймауте — точки следуют за пальцем
    // в реальном времени, а не с задержкой после остановки скролла.
    let _tracking = false;
    carousel.addEventListener("scroll", () => {
      if (_tracking) return;
      _tracking = true;
      requestAnimationFrame(() => {
        updateDayLabel();
        _tracking = false;
      });
    });
    dayDots.forEach((dot) => {
      dot.addEventListener("click", () => scrollToDay(Number(dot.dataset.index)));
    });
    // Стартуем сразу на "сегодня" (страница 1), без анимации.
    carousel.scrollLeft = carousel.clientWidth;

    async function loadDigest() {
      const el = document.getElementById("digest");
      try {
        const data = await api("/miniapp/api/briefing");
        el.textContent = data.weather || "Погода не настроена";
      } catch (e) {
        el.textContent = "Не удалось загрузить.";
      }
    }

    loadBoard();
    loadDigest();
  </script>
</body>
</html>
