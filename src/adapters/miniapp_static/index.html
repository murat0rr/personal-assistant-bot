    async function setTaskPriority(task, newPriority, onUpdate) {
      // onUpdate — необязательный "лёгкий" рендер вместо полного render():
      // пока свайп-шторка открыта, importantBtn/eventBtn передают сюда
      // syncPriorityUI, чтобы список не пересортировался прямо во время
      // работы с панелью (см. renderSwipeableTaskRow).
      const update = onUpdate || render;
      const id = task.id;
      const prevPriority = task.priority;
      const prevSortOrder = task.sort_order;
      task.priority = newPriority;
      // Как и на бэкенде (см. api.py set_task_priority) — смена приоритета
      // может переместить задачу между группой событий и обычных, поэтому
      // она уходит в конец новой группы, тем же правилом "новая — в конец".
      task.sort_order = Date.now();
      pendingIds.add(id);
      update();
      try {
        await api(`/miniapp/api/tasks/${encodeURIComponent(id)}/priority`, {
          method: "POST",
          body: JSON.stringify({ priority: task.priority }),
        });
      } catch (e) {
        task.priority = prevPriority;
        task.sort_order = prevSortOrder;
        update();
        alert("Не удалось изменить приоритет.");
      } finally {
        pendingIds.delete(id);
        update();
      }
    }

    // Перетаскивание (Phase 13) — newOrder уже посчитан вызывающей стороной
    // (setupDragReorder/commitOrder) как midpoint между финальными DOM-
    // соседями. Тот же optimistic-паттерн, что и у остальных правок задачи.
    async function setTaskSortOrder(task, newOrder) {
      const id = task.id;
      const prevOrder = task.sort_order;
      task.sort_order = newOrder;
      pendingIds.add(id);
      rebucketTask(task);
      render();
      try {
        await api(`/miniapp/api/tasks/${encodeURIComponent(id)}/reorder`, {
          method: "POST",
          body: JSON.stringify({ sort_order: newOrder }),
        });
      } catch (e) {
        task.sort_order = prevOrder;
        rebucketTask(task);
        alert("Не удалось изменить порядок.");
      } finally {
        pendingIds.delete(id);
        render();
      }
    }

    async function renameTask(task, newTitle) {
      const trimmed = newTitle.trim();
      if (!trimmed || trimmed === task.title) return;
      const id = task.id;
      const prevTitle = task.title;
      task.title = trimmed;
      pendingIds.add(id);
      render();
      try {
        await api(`/miniapp/api/tasks/${encodeURIComponent(id)}/title`, {
          method: "POST",
          body: JSON.stringify({ title: trimmed }),
        });
      } catch (e) {
        task.title = prevTitle;
        render();
        alert("Не удалось переименовать задачу.");
      } finally {
        pendingIds.delete(id);
        render();
      }
    }

    async function archiveTask(task) {
      const id = task.id;
      pendingIds.add(id);
      render();
      try {
        await api(`/miniapp/api/tasks/${encodeURIComponent(id)}/archive`, { method: "POST" });
        removeTaskEverywhere(id);
      } catch (e) {
        alert("Не удалось удалить задачу.");
      } finally {
        pendingIds.delete(id);
        render();
      }
    }

    async function createTaskFor(dueDate, title) {
      // dueDate === null — валидный случай (задача для инбокса, без даты).
      // undefined — реальная ошибка (не нашли дату дня-источника).
      if (dueDate === undefined) return;
      const tempId = "pending-" + Date.now();
      const tempTask = {
        id: tempId,
        title,
        due_date: dueDate,
        due_time: null,
        priority: "средний",
        done: false,
        // Заведомо больше всех существующих sort_order — "в конец" ровно
        // так же, как задаёт колонка по умолчанию на бэкенде (см.
        // models/task.py, default=time.time), пока сервер не подтвердит
        // настоящее значение.
        sort_order: Date.now(),
      };
      pendingIds.add(tempId);
      rebucketTask(tempTask);
      render();
      try {
        const result = await api("/miniapp/api/tasks", {
          method: "POST",
          body: JSON.stringify({ title, due_date: dueDate }),
        });
        tempTask.id = result.id;
      } catch (e) {
        removeTaskEverywhere(tempId);
        alert("Не удалось создать задачу.");
      } finally {
        pendingIds.delete(tempId);
        render();
      }
    }

    // Тап по шаблону в обычном режиме — мгновенно создаёт задачу с тем же

    // ---- Проекты (Phase 19) — тот же optimistic-паттерн.

    async function loadProjects() {
      try {
        projectsData = await api("/miniapp/api/projects");
      } catch (e) {
        projectsData = [];
      }
      render();
      // Гант в аналитике (Phase 24) читает projectsData напрямую, вне
      // общего render()-цикла — держим его в курсе каждый раз, когда
      // список проектов реально мог поменяться.
      if (document.getElementById("analytics-gantt")) renderGanttChart();
    }

    async function createProject(draft) {
      try {
        const result = await api("/miniapp/api/projects", {
          method: "POST",
          body: JSON.stringify({
            title: draft.title.trim(),
            description: draft.description ? draft.description.trim() : null,
            sphere: draft.sphere || null,
            start_date: draft.start || null,
            end_date: draft.end || null,
            color: draft.color || null,
            analyze: !!draft.analyze,
          }),
        });
        projectsData.push(result);
      } catch (e) {
        alert("Не удалось создать проект.");
      } finally {
        render();
        if (document.getElementById("analytics-gantt")) renderGanttChart();
      }
    }

    // Правка (Phase 28) — в отличие от createProject, не дописывает
    // локальный кэш вручную, а перечитывает список целиком: у edit-
    // эндпоинта поле со значением null означает "не трогать", а не
    // "очистить" (см. core/projects.py::update_project) — ручное
    // слияние на фронтенде рисковало разойтись с тем, что реально
    // сохранилось в БД. Ничего из уже привязанных задач эта операция не
    // трогает — эндпоинт правит только сам проект.
    async function editProject(id, draft) {
      try {
        await api(`/miniapp/api/projects/${id}/edit`, {
          method: "POST",
          body: JSON.stringify({
            title: draft.title.trim(),
            description: draft.description ? draft.description.trim() : null,
            sphere: draft.sphere || null,
            start_date: draft.start || null,
            end_date: draft.end || null,
          }),
        });
        await loadProjects();
      } catch (e) {
        alert("Не удалось сохранить проект.");
      }
    }

    async function createGoal(draft) {
      try {
        const result = await api("/miniapp/api/goals", {
          method: "POST",
          body: JSON.stringify({
            sphere: draft.sphere,
            tier: draft.tier,
            text: draft.title.trim(),
            analyze: !!draft.analyze,
            reference_date: draft.referenceDate || null,
          }),
        });
        goalsData.push(result);
      } catch (e) {
        alert("Не удалось создать цель.");
      } finally {
        render();
      }
    }

    // Правка цели (Phase 28) — та же логика, что editProject: период
    // пересчитывается сервером из тира+опорной даты, локально не трогаем
    // ничего вручную, просто перечитываем список. Задачи, уже привязанные
    // по sphere, эта операция не трогает.
    async function editGoal(id, draft) {
      try {
        await api(`/miniapp/api/goals/${id}/edit`, {
          method: "POST",
          body: JSON.stringify({
            text: draft.title.trim(),
            sphere: draft.sphere || null,
            tier: draft.tier,
            reference_date: draft.referenceDate || null,
          }),
        });
        await loadGoals();
      } catch (e) {
        alert("Не удалось сохранить цель.");
      }
    }

    // ---- Форма создания/правки проекта/цели (Phase 26/28) — один sheet
    // на обе сущности и на оба режима, содержимое зависит от
    // createEntityKind/createEntityEditingId.

    const GOAL_TIER_LABELS = {
      weekly: "неделя",
      monthly: "месяц",
      yearly: "год",
    };

    function emptyEntityDraft(kind, prefillTitle) {
      return kind === "project"
        ? { title: prefillTitle || "", description: "", sphere: "", start: "", end: "", color: "", analyze: false }
        : { title: prefillTitle || "", sphere: "", tier: "weekly", analyze: false, referenceDate: "" };
    }

    function openCreateEntitySheet(kind, prefillTitle) {
      createEntityKind = kind;
      createEntityEditingId = null;
      createEntityDraft = emptyEntityDraft(kind, prefillTitle);
      render();
    }

    // Долгое нажатие по строке (см. attachEntityLongPress) — та же форма,
    // предзаполненная текущими значениями сущности.
    function openEditEntitySheet(entity, kind) {
      createEntityKind = kind;
      createEntityEditingId = entity.id;
      createEntityDraft =
        kind === "project"
          ? {
              title: entity.title || "",
              description: entity.description || "",
              sphere: entity.sphere || "",
              start: entity.start_date || "",
              end: entity.end_date || "",
              color: entity.color || "",
              analyze: false,
            }
          : {
              title: entity.text || "",
              sphere: entity.sphere || "",
              tier: entity.tier || "weekly",
              analyze: false,
              referenceDate: entity.period_start || "",
            };
      render();
    }

    // Единая точка сохранения (Phase 28) — вызывается и явной кнопкой
    // "Готово", и закрытием шторки свайпом/тапом по фону (см.
    // closeCreateEntitySheet): что бы ни закрыло форму, попытка
    // сохранить одна и та же. Без названия/формулировки, либо без сферы
    // у цели (единственное по-настоящему обязательное после названия) —
    // просто ничего не создаём/не сохраняем, без алертов, форма и так
    // уже закрывается. Цвет проекта — единственное исключение из
    // "недозаполнено": при отсутствии выбора назначается случайно, а не
    // подсвечивается плиткой (см. isEntityIncomplete).
    function commitEntityForm() {
      const kind = createEntityKind;
      if (!kind) return;
      const draft = createEntityDraft;
      const isProject = kind === "project";
      const titleText = (draft.title || "").trim();
      if (!titleText) return;
      if (!isProject && !draft.sphere) return;

      if (isProject) {
        if (!draft.color) {
          draft.color = PROJECT_COLORS[Math.floor(Math.random() * PROJECT_COLORS.length)];
        }
        if (createEntityEditingId != null) editProject(createEntityEditingId, draft);
        else createProject(draft);
      } else if (createEntityEditingId != null) {
        editGoal(createEntityEditingId, draft);
      } else {
        createGoal(draft);
      }
    }

    function closeCreateEntitySheet() {
      commitEntityForm();
      createEntityKind = null;
      createEntityEditingId = null;
      render();
    }

    function formatDateBtnLabel(iso, placeholder) {
      return iso ? formatShortDate(iso) : placeholder;
    }

    function renderCreateEntityForm() {
      const container = document.getElementById("create-entity-form");
      const titleEl = document.getElementById("create-entity-title");
      container.innerHTML = "";
      if (!createEntityKind) return;

      const isProject = createEntityKind === "project";
      const isEditing = createEntityEditingId != null;
      titleEl.textContent = isProject
        ? isEditing
          ? "Изменить проект"
          : "Новый проект"
        : isEditing
          ? "Изменить цель"
          : "Новая цель";

      const titleInput = document.createElement("input");
      titleInput.className = "entity-form-field";
      titleInput.type = "text";
      titleInput.placeholder = isProject ? "Название проекта" : "Формулировка цели";
      titleInput.value = createEntityDraft.title;
      titleInput.addEventListener("input", () => (createEntityDraft.title = titleInput.value));
      container.append(titleInput);

      if (isProject) {
        const descInput = document.createElement("input");
        descInput.className = "entity-form-field";
        descInput.type = "text";
        descInput.placeholder = "Описание (необязательно)";
        descInput.value = createEntityDraft.description;
        descInput.addEventListener("input", () => (createEntityDraft.description = descInput.value));
        container.append(descInput);
      }

      if (!isProject) {
        const tierRow = document.createElement("div");
        tierRow.className = "entity-form-tier-row";
        for (const tier of GOAL_TIERS) {
          const chip = document.createElement("button");
          chip.type = "button";
          chip.className = "sphere-chip" + (createEntityDraft.tier === tier ? " selected" : "");
          chip.textContent = GOAL_TIER_LABELS[tier];
          chip.onclick = () => {
            createEntityDraft.tier = tier;
            render();
          };
          tierRow.append(chip);
        }
        container.append(tierRow);
      }

      container.append(
        renderSphereChips(createEntityDraft.sphere, (value) => {
          createEntityDraft.sphere = value;
          render();
        })
      );

      if (isProject) {
        const datesWrap = document.createElement("div");
        datesWrap.className = "entity-form-dates";
        const startBtn = document.createElement("button");
        startBtn.type = "button";
        startBtn.className = "entity-date-btn" + (createEntityDraft.start ? " date-set" : "");
        startBtn.innerHTML = calendarIcon() + `<span>${formatDateBtnLabel(createEntityDraft.start, "Начало")}</span>`;
        startBtn.onclick = () =>
          openDatePicker(createEntityDraft.start, (iso) => {
            createEntityDraft.start = iso || "";
            render();
          });
        const endBtn = document.createElement("button");
        endBtn.type = "button";
        endBtn.className = "entity-date-btn" + (createEntityDraft.end ? " date-set" : "");
        endBtn.innerHTML = calendarIcon() + `<span>${formatDateBtnLabel(createEntityDraft.end, "Конец")}</span>`;
        endBtn.onclick = () =>
          openDatePicker(createEntityDraft.end, (iso) => {
            createEntityDraft.end = iso || "";
            render();
          });
        datesWrap.append(startBtn, endBtn);
        container.append(datesWrap);

        const colorGrid = document.createElement("div");
        colorGrid.className = "palette-grid";
        colorGrid.style.margin = "10px 0";
        for (const hex of PROJECT_COLORS) {
          const sw = document.createElement("div");
          sw.className = "swatch" + (createEntityDraft.color === hex ? " selected" : "");
          sw.style.background = hex;
          sw.onclick = () => {
            createEntityDraft.color = createEntityDraft.color === hex ? "" : hex;
            render();
          };
          colorGrid.append(sw);
        }
        container.append(colorGrid);
      } else {
        // Опорная дата периода (Phase 28) — по ней сервер считает
        // week_bounds/month_bounds/year_bounds; не выбрана — период
        // считается от сегодня, как раньше (см. core/goals.py::
        // create_goal_now/update_goal).
        const dateRow = document.createElement("div");
        dateRow.className = "entity-form-dates";
        const refBtn = document.createElement("button");
        refBtn.type = "button";
        refBtn.className = "entity-date-btn" + (createEntityDraft.referenceDate ? " date-set" : "");
        refBtn.innerHTML =
          calendarIcon() + `<span>${formatDateBtnLabel(createEntityDraft.referenceDate, "Период: сегодня")}</span>`;
        refBtn.onclick = () =>
          openDatePicker(createEntityDraft.referenceDate, (iso) => {
            createEntityDraft.referenceDate = iso || "";
            render();
          });
        dateRow.append(refBtn);
        container.append(dateRow);
      }

      const toggleRow = document.createElement("div");
      toggleRow.className = "entity-form-toggle-row";
      const toggleLabel = document.createElement("span");
      toggleLabel.textContent = "Проанализировать задачи и добавить";
      const toggleBtn = document.createElement("button");
      toggleBtn.type = "button";
      toggleBtn.className = "entity-form-toggle" + (createEntityDraft.analyze ? " on" : "");
      toggleBtn.setAttribute("aria-label", "Проанализировать задачи и добавить");
      toggleBtn.onclick = () => {
        createEntityDraft.analyze = !createEntityDraft.analyze;
        render();
      };
      toggleRow.append(toggleLabel, toggleBtn);
      container.append(toggleRow);

      const submitBtn = document.createElement("button");
      submitBtn.type = "button";
      submitBtn.className = "entity-form-submit";
      submitBtn.textContent = "Готово";
      // closeCreateEntitySheet сама сохраняет (см. commitEntityForm) —
      // кнопка ничем не отличается от свайпа/тапа по фону, просто ещё
      // один явный способ закрыть.
      submitBtn.onclick = () => closeCreateEntitySheet();
      container.append(submitBtn);
    }

    // ---- Всплывающий календарь (Phase 28) — общий для дат проекта и
    // опорной даты периода цели. Небольшая карточка поверх формы (см.
    // CSS #date-picker-sheet), не ещё один bottom-sheet той же высоты.
    function openDatePicker(initialIso, onPick) {
      const base = initialIso ? new Date(initialIso + "T00:00:00") : new Date();
      datePickerYear = base.getFullYear();
      datePickerMonth = base.getMonth() + 1;
      datePickerSelectedIso = initialIso || null;
      datePickerOnPick = onPick;
      datePickerOpen = true;
      render();
    }

    function closeDatePickerSheet() {
      datePickerOpen = false;
      datePickerOnPick = null;
      render();
    }

    function renderDatePickerGrid() {
      const grid = document.getElementById("date-picker-grid");
      const titleEl = document.getElementById("date-picker-title");
      if (!datePickerOpen) {
        grid.innerHTML = "";
        return;
      }
      titleEl.textContent = `${MONTH_NAMES_FULL[datePickerMonth - 1]} ${datePickerYear}`;
      grid.innerHTML = "";

      const firstOfMonth = new Date(Date.UTC(datePickerYear, datePickerMonth - 1, 1));
      const firstWeekday = (firstOfMonth.getUTCDay() + 6) % 7;
      const thisMonthDays = daysInMonth(datePickerYear, datePickerMonth);
      const todayIso = boardState.days.today ? boardState.days.today.date : null;

      const prevMonth = datePickerMonth === 1 ? 12 : datePickerMonth - 1;
      const prevYear = datePickerMonth === 1 ? datePickerYear - 1 : datePickerYear;
      const prevMonthDays = daysInMonth(prevYear, prevMonth);
      const nextMonth = datePickerMonth === 12 ? 1 : datePickerMonth + 1;
      const nextYear = datePickerMonth === 12 ? datePickerYear + 1 : datePickerYear;
      const totalCells = Math.ceil((firstWeekday + thisMonthDays) / 7) * 7;
      const trailingCount = totalCells - firstWeekday - thisMonthDays;

      const cells = [];
      for (let i = 0; i < firstWeekday; i++) {
        cells.push({ d: prevMonthDays - firstWeekday + 1 + i, year: prevYear, month: prevMonth, other: true });
      }
      for (let d = 1; d <= thisMonthDays; d++) {
        cells.push({ d, year: datePickerYear, month: datePickerMonth, other: false });
      }
      for (let i = 0; i < trailingCount; i++) {
        cells.push({ d: i + 1, year: nextYear, month: nextMonth, other: true });
      }

      cells.forEach((cell) => {
        const btn = document.createElement("button");
        btn.className = "month-cal-day";
        if (cell.other) btn.classList.add("other-month");
        const iso = `${cell.year}-${pad2(cell.month)}-${pad2(cell.d)}`;
        if (iso === todayIso) btn.classList.add("today");
        if (iso === datePickerSelectedIso) btn.classList.add("selected");
        const num = document.createElement("span");
        num.className = "month-cal-num";
        num.textContent = String(cell.d);
        btn.append(num);
        btn.onclick = () => {
          const cb = datePickerOnPick;
          closeDatePickerSheet();
          if (cb) cb(iso);
        };
        grid.append(btn);
      });
    }

    // Привязка задачи к проекту — из picker'а (5-я кнопка свайп-шторки).
    async function assignTaskProject(task, projectId) {
      closeProjectPicker();
      const id = task.id;
      const prevProjectId = task.project_id;
      task.project_id = projectId;
      pendingIds.add(id);
      render();
      try {
        await api(`/miniapp/api/tasks/${encodeURIComponent(id)}/project`, {
          method: "POST",
          body: JSON.stringify({ project_id: projectId }),
        });
        loadProjects(); // прогресс-бар задетого проекта(ов) мог измениться
      } catch (e) {
        task.project_id = prevProjectId;
        alert("Не удалось привязать проект.");
      } finally {
        pendingIds.delete(id);
        render();
      }
    }

    // ---- Аналитика (Phase 24) — независимо от боевого render()-цикла:
    // читается один раз при загрузке, каждая диаграмма рисуется в свой
    // контейнер напрямую (не через общий render(), сюда не нужен
    // optimistic UI — данные только для чтения).

    // Тот же порядок, что SPHERES, — фиксированная палитра, чтобы цвет
    // сферы был одним и тем же везде, где она встречается на странице.
    const SPHERE_COLORS = {
      учёба: "#5b8def",
      работа: "#e0a52c",
      спорт: "#4caf7d",
      развитие: "#a06fe0",
      отношения: "#e0637a",
    };
    function sphereColor(sphere) {
      return SPHERE_COLORS[sphere] || "var(--text-muted)";
    }

    function renderSphereChart(data) {
      const el = document.getElementById("analytics-spheres");
      el.innerHTML = '<p class="chart-title">Задачи по сферам</p>';
      const total = data.reduce((sum, s) => sum + s.count, 0);
      if (total === 0) {
        el.innerHTML += '<div class="chart-empty">Пока нет задач со сферой</div>';
        return;
      }

      // Столбчатая диаграмма вместо тортика (item 4, Phase 33) — один
      // столбец на сферу, нижняя часть темнее (выполнено), верхняя —
      // обычный цвет сферы (не выполнено). Тот же приём color-mix, что
      // уже даёт .gantt-bar-progress (только к белому — для
      // противоположного эффекта, здесь к чёрному — темнее). Компоновка
      // (item 5, Phase 34) — график слева, легенда справа (не друг под
      // другом): подписи под столбцами убраны (в легенде и так есть
      // название сферы), столбцы уже, график занимает меньше ширины.
      const max = Math.max(1, ...data.map((s) => s.count));
      const w = 100;
      const h = 130;
      const padLeft = 20;
      const padBottom = 4;
      const padTop = 4;
      const plotW = w - padLeft - 4;
      const plotH = h - padTop - padBottom;
      const barGap = 6;
      const barW = (plotW - barGap * (data.length - 1)) / data.length;

      const yTicks = Array.from(new Set([0, Math.round(max / 2), max]));
      const yToPx = (v) => padTop + plotH - (v / max) * plotH;
      const gridLines = yTicks
        .map((v) => {
          const y = yToPx(v);
          return (
            `<line x1="${padLeft}" y1="${y}" x2="${w - 4}" y2="${y}" stroke="var(--hairline)" stroke-width="1"/>` +
            `<text x="${padLeft - 4}" y="${y + 3}" font-size="8" fill="var(--text-muted)" text-anchor="end">${v}</text>`
          );
        })
        .join("");

      const bars = data
        .map((s, i) => {
          const color = sphereColor(s.sphere);
          const darker = `color-mix(in srgb, ${color} 65%, black 35%)`;
          const x = padLeft + i * (barW + barGap);
          const totalH = (s.count / max) * plotH;
          const doneH = s.count ? totalH * (s.done / s.count) : 0;
          const notDoneH = totalH - doneH;
          const topY = padTop + plotH - totalH;
          const doneY = padTop + plotH - doneH;
          let bar = "";
          if (notDoneH > 0) {
            bar += `<rect x="${x}" y="${topY}" width="${barW}" height="${notDoneH}" fill="${color}"/>`;
          }
          if (doneH > 0) {
            bar += `<rect x="${x}" y="${doneY}" width="${barW}" height="${doneH}" fill="${darker}"/>`;
          }
          return bar;
        })
        .join("");

      const svg = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="flex-shrink:0">${gridLines}${bars}</svg>`;
      const legend = data
        .map(
          (s) =>
            `<div class="sphere-legend-row"><span class="sphere-swatch" style="background:${sphereColor(s.sphere)}"></span>` +
            `<span class="sphere-legend-label">${escapeHtml(s.sphere)}</span>` +
            `<span class="sphere-legend-value">${s.done}/${s.count} · ${Math.round((s.count / total) * 100)}%</span></div>`
        )
        .join("");
      el.innerHTML += `<div class="sphere-chart-row">${svg}<div class="sphere-legend">${legend}</div></div>`;
    }

    function renderMonthChart(data) {
      const el = document.getElementById("analytics-month");
      el.innerHTML = '<p class="chart-title">Выполнено задач в этом месяце</p>';
      const counts = data.all_counts || [];
      const max = Math.max(1, ...counts);
      if (counts.every((c) => c === 0)) {
        el.innerHTML += '<div class="chart-empty">В этом месяце пока ничего не отмечено</div>';
        return;
      }

      // Оси (item 9, Phase 29) — раньше был голый график без единиц: не
      // видно ни какое число дня под какой полоской, ни какой счёт
      // соответствует высоте. Слева — счёт (0/середина/максимум),
      // снизу — числа месяца через 5 (плюс 1-е и последнее), пунктиром —
      // текущий день, если он в этом месяце.
      const w = 300;
      const h = 110;
      const padLeft = 18;
      const padBottom = 12;
      const padTop = 4;
      const plotW = w - padLeft - 2;
      const plotH = h - padTop - padBottom;
      const barW = plotW / counts.length;

      const yTicks = Array.from(new Set([0, Math.round(max / 2), max]));
      const yToPx = (v) => padTop + plotH - (v / max) * plotH;
      const gridLines = yTicks
        .map((v) => {
          const y = yToPx(v);
          return (
            `<line x1="${padLeft}" y1="${y}" x2="${w - 2}" y2="${y}" stroke="var(--hairline)" stroke-width="1"/>` +
            `<text x="${padLeft - 4}" y="${y + 3}" font-size="8" fill="var(--text-muted)" text-anchor="end">${v}</text>`
          );
        })
        .join("");

      const bars = counts
        .map((c, i) => {
          const barH = (c / max) * plotH;
          const x = padLeft + i * barW;
          const y = padTop + plotH - barH;
          return `<rect x="${x + 0.5}" y="${y}" width="${Math.max(barW - 1, 1)}" height="${Math.max(barH, c > 0 ? 1 : 0)}" fill="var(--accent)" rx="1"/>`;
        })
        .join("");

      const todayIso = boardState.days.today ? boardState.days.today.date : null;
      const todayDay = todayIso ? Number(todayIso.slice(8, 10)) : null;
      const todayLine =
        todayDay && todayDay <= counts.length
          ? `<line x1="${padLeft + (todayDay - 0.5) * barW}" y1="${padTop}" x2="${padLeft + (todayDay - 0.5) * barW}" y2="${padTop + plotH}" stroke="var(--neutral-blue)" stroke-width="1.5" stroke-dasharray="2 2"/>`
          : "";

      const xLabels = counts
        .map((c, i) => {
          const dayNum = i + 1;
          if (dayNum !== 1 && dayNum !== counts.length && dayNum % 5 !== 0) return "";
          const x = padLeft + i * barW + barW / 2;
          return `<text x="${x}" y="${h - 1}" font-size="8" fill="var(--text-muted)" text-anchor="middle">${dayNum}</text>`;
        })
        .join("");

      const svg = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">${gridLines}${bars}${todayLine}${xLabels}</svg>`;
      el.innerHTML += svg;

      const projects = data.projects || [];
      if (projects.length) {
        const rows = projects
          .slice(0, 6)
          .map(
            (p) =>
              `<div class="month-project-row"><span class="month-project-title">${escapeHtml(p.title)}</span>` +
              `<span class="month-project-count">${p.total}</span></div>`
          )
          .join("");
        el.innerHTML += `<p class="chart-title" style="margin-top:14px;">По проектам</p>${rows}`;
      }
    }

    function renderGanttChart() {
      const el = document.getElementById("analytics-gantt");
      el.innerHTML = '<p class="chart-title">Проекты</p>';
      const withDates = projectsData.filter((p) => p.start_date && p.end_date);
      if (withDates.length === 0) {
        el.innerHTML += '<div class="chart-empty">Нет проектов со сроками</div>';
        return;
      }

      const starts = withDates.map((p) => new Date(p.start_date).getTime());
      const ends = withDates.map((p) => new Date(p.end_date).getTime());
      const min = Math.min(...starts);
      const max = Math.max(...ends);
      const span = Math.max(max - min, 86400000);

      // Шкала месяцев + линия "сегодня" (item 10, Phase 29) — без этого
      // непонятно, на какой календарный период приходятся полоски: две
      // одинаковые на вид полоски могли означать и "весь январь", и "весь
      // год" — теперь видно явно.
      const monthTicks = [];
      const cursor = new Date(min);
      cursor.setDate(1);
      while (cursor.getTime() <= max) {
        // Первый месяц может начинаться раньше самой ранней даты проекта
        // (min попал на середину месяца) — не даём подписи уехать за
        // пределы шкалы, иначе она визуально "утекает" на соседнюю
        // страницу карусели (см. .gantt-axis-tick — position:absolute).
        const pct = Math.max(0, Math.min(100, ((cursor.getTime() - min) / span) * 100));
        monthTicks.push({ pct, label: MONTH_NAMES_FULL[cursor.getMonth()].slice(0, 3) });
        cursor.setMonth(cursor.getMonth() + 1);
      }
      const axisHtml = monthTicks
        .map((t) => `<span class="gantt-axis-tick" style="left:${t.pct}%">${t.label}</span>`)
        .join("");

      const now = Date.now();
      const todayPct = ((now - min) / span) * 100;
      const todayLineHtml =
        todayPct >= 0 && todayPct <= 100 ? `<div class="gantt-today-line" style="left:${todayPct}%"></div>` : "";

      const rows = withDates
        .map((p) => {
          const left = ((new Date(p.start_date).getTime() - min) / span) * 100;
          const width = Math.max(
            ((new Date(p.end_date).getTime() - new Date(p.start_date).getTime()) / span) * 100,
            2
          );
          const pct = p.task_count ? Math.round((p.done_count / p.task_count) * 100) : 0;
          const progressWidth = width * (pct / 100);
          return (
            '<div class="gantt-row">' +
            `<div class="gantt-row-label"><span class="gantt-row-title">${escapeHtml(p.title)}</span>` +
            `<span class="gantt-row-meta">${formatShortDate(p.start_date)}–${formatShortDate(p.end_date)} · ${p.done_count}/${p.task_count} · ${pct}%</span></div>` +
            '<div class="gantt-track">' +
            `<div class="gantt-bar" style="left:${left}%;width:${width}%;"></div>` +
            `<div class="gantt-bar-progress" style="left:${left}%;width:${progressWidth}%;"></div>` +
            "</div></div>"
          );
        })
        .join("");
      el.innerHTML += `<div class="gantt-axis">${axisHtml}</div><div class="gantt-body">${todayLineHtml}${rows}</div>`;
    }

    function renderAiSummary(text) {
      const el = document.getElementById("analytics-ai");

      el.innerHTML += `<div class="ai-summary-text">${text ? escapeHtml(text) : "Пока не набралось данных для анализа."}</div>`;

        ) +

    // ---- Месячный календарь (Phase 26) — только текущий месяц, только
    // события (не вся загрузка дня — для этого есть график в аналитике).

    const MONTH_NAMES_FULL = [
      "январь", "февраль", "март", "апрель", "май", "июнь",
      "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь",
    ];
    const today0 = new Date();
    let calYear = today0.getFullYear();
    let calMonth = today0.getMonth() + 1; // 1-12
    let calSelectedDay = null;
    // Кэш по месяцам ("YYYY-MM" -> events/moods) — карусель держит
    // пред./тек./след. месяц отрендеренными одновременно (см. ниже), так
    // что данные нужны на все три сразу; кэш экономит повторный сетевой
    // запрос при свайпе туда-обратно по уже посещённым месяцам.
    let calEventsByMonth = {};
    let calMoodsByMonth = {};

    function pad2(n) {
      return String(n).padStart(2, "0");
    }

    function daysInMonth(year, month) {
      return new Date(Date.UTC(year, month, 0)).getUTCDate();
    }

    function monthKey(year, month) {
      return `${year}-${pad2(month)}`;
    }

    function adjMonth(year, month, delta) {
      let m = month + delta;
      let y = year;
      if (m < 1) {
        m = 12;
        y -= 1;
      } else if (m > 12) {
        m = 1;
        y += 1;
      }
      return { year: y, month: m };
    }

    async function ensureMonthData(year, month) {
      const key = monthKey(year, month);
      if (calEventsByMonth[key] && calMoodsByMonth[key]) return;
      const [events, moods] = await Promise.all([
        api(`/miniapp/api/calendar/month?month=${key}`).catch(() => ({})),
        api(`/miniapp/api/calendar/month-moods?month=${key}`).catch(() => ({})),
      ]);
      calEventsByMonth[key] = events;
      calMoodsByMonth[key] = moods;
    }

    // Подгружает текущий + соседние месяцы разом — карусель (см. ниже)
    // держит все три панели отрендеренными постоянно, не только в
    // момент активного свайпа, иначе при перетаскивании было бы видно
    // пустые соседние панели вместо реального контента.
    async function loadMonthEvents() {
      const prev = adjMonth(calYear, calMonth, -1);
      const next = adjMonth(calYear, calMonth, 1);
      await Promise.all([
        ensureMonthData(calYear, calMonth),
        ensureMonthData(prev.year, prev.month),
        ensureMonthData(next.year, next.month),
      ]);
      renderMonthCalendar();
    }

    function moodClass(avg) {
      if (avg >= 2.34) return "mood-good";
      if (avg >= 1.67) return "mood-mid";
      return "mood-low";
    }

    function pluralizeRu(n, one, few, many) {
      const mod10 = n % 10;
      const mod100 = n % 100;
      if (mod10 === 1 && mod100 !== 11) return one;
      if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return few;
      return many;
    }

    // Рисует сетку одного месяца в конкретный контейнер — вызывается три
    // раза на каждый renderMonthCalendar() (пред./тек./след. панель
    // карусели), поэтому ничего не берёт из глобального calYear/calMonth
    // напрямую, только из переданных year/month.
    function renderMonthGridInto(grid, year, month) {
      grid.innerHTML = "";
      const key = monthKey(year, month);
      const events = calEventsByMonth[key] || {};
      const moods = calMoodsByMonth[key] || {};

      const firstOfMonth = new Date(Date.UTC(year, month - 1, 1));
      const firstWeekday = (firstOfMonth.getUTCDay() + 6) % 7; // Пн=0
      const thisMonthDays = daysInMonth(year, month);
      const todayIso = boardState.days.today ? boardState.days.today.date : null;

      // Соседние месяцы — чтобы заполнить ведущие/хвостовые плитки
      // реальными числами вместо пустых (item 3, Phase 27), с корректным
      // переходом года на границе декабрь/январь.
      const prev = adjMonth(year, month, -1);
      const prevMonthDays = daysInMonth(prev.year, prev.month);
      const next = adjMonth(year, month, 1);

      // Ровно до конца последней недели месяца — без лишней 6-й строки,
      // когда месяц укладывается в 5 недель.
      const totalCells = Math.ceil((firstWeekday + thisMonthDays) / 7) * 7;
      const trailingCount = totalCells - firstWeekday - thisMonthDays;

      const cells = [];
      for (let i = 0; i < firstWeekday; i++) {
        cells.push({ d: prevMonthDays - firstWeekday + 1 + i, year: prev.year, month: prev.month, other: true });
      }
      for (let d = 1; d <= thisMonthDays; d++) {
        cells.push({ d, year, month, other: false });
      }
      for (let i = 0; i < trailingCount; i++) {
        cells.push({ d: i + 1, year: next.year, month: next.month, other: true });
      }

      cells.forEach((cell, index) => {
        const btn = document.createElement("button");
        btn.className = "month-cal-day";
        const weekdayIndex = index % 7; // Пн=0 .. Вс=6
        if (index < 7) btn.classList.add("first-row");
        if (weekdayIndex >= 5) btn.classList.add("weekend");
        if (cell.other) btn.classList.add("other-month");

        const iso = `${cell.year}-${pad2(cell.month)}-${pad2(cell.d)}`;
        if (iso === todayIso) btn.classList.add("today");
        if (iso === calSelectedDay) btn.classList.add("selected");

        if (index < 7) {
          const wd = document.createElement("span");
          wd.className = "month-cal-weekday-label";
          wd.textContent = WEEKDAY_LABELS[weekdayIndex];
          btn.append(wd);
        }

        const num = document.createElement("span");
        num.className = "month-cal-num";
        num.textContent = String(cell.d);
        btn.append(num);

        // Плитка показывает максимум один индикатор: для сегодня/будущего
        // с событием — сам текст события (item 3, Phase 29); для
        // прошлого с заполненной вечерней рефлексией — цветной кружок
        // "как прошёл день" (по среднему баллу physical/social/
        // productivity/happiness, вдохновлено привычным паттерном mood-
        // календарей вроде Daylio — один цвет на плитку, читается с
        // одного взгляда).
        if (!cell.other) {
          const isPastDay = todayIso !== null && iso < todayIso;
          const dayEvents = events[iso];
          if (!isPastDay && dayEvents && dayEvents.length) {
            // БАГ (Phase 34, item 4): при 2+ событиях "заголовок +N" почти
            // всегда обрезался по CSS-эллипсису ДО того места, где стоит
            // "+N" — счётчик был физически не виден, выглядело как одно
            // (криво обрезанное) событие вместо явных "2 события". При
            // нескольких событиях показываем короткое "N событие/события/
            // событий" вместо заголовка — оно всегда короче тайла и
            // никогда не обрезается; заголовок остаётся только когда
            // событие ровно одно.
            const label = document.createElement("span");
            label.className = "month-cal-event-text";
            label.textContent =
              dayEvents.length > 1
                ? `${dayEvents.length} ${pluralizeRu(dayEvents.length, "событие", "события", "событий")}`
                : dayEvents[0];
            btn.append(label);
          } else if (isPastDay && moods[iso] != null) {
            const dot = document.createElement("span");
            dot.className = "month-cal-mood-dot " + moodClass(moods[iso]);
            btn.append(dot);
          }
        }

        btn.onclick = () => {
          // item 5 (Phase 29) — тап по плитке только выбирает день и
          // показывает информацию о нём, каким бы месяцем эта плитка ни
          // была (в т.ч. "чужой" месяц с края сетки) — сам показанный
          // месяц календаря тапом никогда не меняется, только свайпом/
          // кнопками ‹ ›.
          calSelectedDay = calSelectedDay === iso ? null : iso;
          renderMonthCalendar();
          showDayInfo(calSelectedDay);
          if (calSelectedDay) {
            // item 1 — экран адаптируется так, чтобы надпись месяца была
            // вверху видимой области, а не терялась выше открывшегося
            // блока информации о дне.
            document.getElementById("month-cal-section").scrollIntoView({ behavior: "smooth", block: "start" });
          }
        };
        grid.append(btn);
      });
    }

    function renderMonthCalendar() {
      document.getElementById("month-cal-title").textContent = `${MONTH_NAMES_FULL[calMonth - 1]} ${calYear}`;
      const prev = adjMonth(calYear, calMonth, -1);
      const next = adjMonth(calYear, calMonth, 1);
      renderMonthGridInto(monthPanelGrids[0], prev.year, prev.month);
      renderMonthGridInto(monthPanelGrids[1], calYear, calMonth);
      renderMonthGridInto(monthPanelGrids[2], next.year, next.month);
    }

    async function goToMonth(delta) {
      const target = adjMonth(calYear, calMonth, delta);
      calYear = target.year;
      calMonth = target.month;
      calSelectedDay = null;
      document.getElementById("month-cal-day-info").classList.remove("visible");
      renderMonthDayDetail(null);
      await loadMonthEvents();
    }

    document.getElementById("month-cal-prev").onclick = () => goToMonth(-1);
    document.getElementById("month-cal-next").onclick = () => goToMonth(1);

    // Карусель месяцев (item 4, Phase 29) — тот же приём "палец двигает
    // трек 1:1, после отпускания один CSS-transition до целевой панели,
    // потом мгновенный незаметный возврат в центр с обновлёнными
    // данными", что уже отработан у недельной карусели
    // (recenterWeekCarousel) — просто без "peek" по краям (панель на всю
    // ширину, не 88%). Слушатели на document — та же дисциплина, что и у
    // остальных жестов приложения (Telegram WebView не всегда продолжает
    // доставлять pointermove именно в исходный target).
    const monthCarousel = document.getElementById("month-cal-carousel");
    const monthTrack = document.getElementById("month-cal-track");
    const monthPanelGrids = Array.from(document.querySelectorAll("#month-cal-track .month-cal-grid"));

    const MONTH_DRAG_THRESHOLD = 0.22;
    const MONTH_FLING_VELOCITY = 0.5; // px/мс

    function monthPanelWidth() {
      return monthCarousel.clientWidth;
    }
    function monthRestX(index) {
      return -index * monthPanelWidth();
    }
    function setMonthTrackTransform(x, withTransition) {
      monthTrack.style.transition = withTransition ? "transform 240ms cubic-bezier(0.22, 1, 0.36, 1)" : "none";
      monthTrack.style.transform = `translateX(${x}px)`;
    }
    function recenterMonthCarousel() {
      setMonthTrackTransform(monthRestX(1), false);
    }
    recenterMonthCarousel();

    let monthDrag = null;
    let monthSettling = false;

    monthTrack.addEventListener("pointerdown", (e) => {
      if (monthSettling) return;
      monthDrag = {
        pointerId: e.pointerId,
        startX: e.clientX,
        startY: e.clientY,
        baseX: monthRestX(1),
        horizontal: null,
        lastX: e.clientX,
        lastTime: e.timeStamp,
        velocity: 0,
      };
    });
    document.addEventListener("pointermove", (e) => {
      if (!monthDrag || e.pointerId !== monthDrag.pointerId) return;
      const dx = e.clientX - monthDrag.startX;
      const dy = e.clientY - monthDrag.startY;
      if (monthDrag.horizontal === null) {
        if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
        monthDrag.horizontal = Math.abs(dx) > Math.abs(dy);
        if (!monthDrag.horizontal) {
          monthDrag = null; // вертикальный жест — не мешаем обычному скроллу экрана
          return;
        }
      }
      const dt = e.timeStamp - monthDrag.lastTime;
      if (dt > 0) monthDrag.velocity = (e.clientX - monthDrag.lastX) / dt;
      monthDrag.lastX = e.clientX;
      monthDrag.lastTime = e.timeStamp;
      setMonthTrackTransform(monthDrag.baseX + dx, false);
    });
    function endMonthDrag(e) {
      if (!monthDrag || e.pointerId !== monthDrag.pointerId) return;
      const drag = monthDrag;
      monthDrag = null;
      if (drag.horizontal !== true) return; // тап или вертикальный жест — трек не двигали
      const dx = e.clientX - drag.startX;
      const pw = monthPanelWidth();
      let targetIndex = 1;
      if (Math.abs(drag.velocity) > MONTH_FLING_VELOCITY) {
        targetIndex = drag.velocity < 0 ? 2 : 0;
      } else if (Math.abs(dx) > pw * MONTH_DRAG_THRESHOLD) {
        targetIndex = dx < 0 ? 2 : 0;
      }
      settleMonthCarousel(targetIndex);
    }
    document.addEventListener("pointerup", endMonthDrag);
    document.addEventListener("pointercancel", endMonthDrag);

    function settleMonthCarousel(targetIndex) {
      monthSettling = true;
      setMonthTrackTransform(monthRestX(targetIndex), true);

      const willChange = targetIndex !== 1;
      const delta = targetIndex === 2 ? 1 : -1;
      const target = willChange ? adjMonth(calYear, calMonth, delta) : null;

      if (willChange) {
        // Подпись месяца — сразу, не дожидаясь конца анимации/сети:
        // иначе видно, как она "отстаёт" от уже едущей карусели (баг).
        document.getElementById("month-cal-title").textContent =
          `${MONTH_NAMES_FULL[target.month - 1]} ${target.year}`;
      }

      monthTrack.addEventListener(
        "transitionend",
        async () => {
          if (willChange) {
            calYear = target.year;
            calMonth = target.month;
            calSelectedDay = null;
            document.getElementById("month-cal-day-info").classList.remove("visible");
            await loadMonthEvents();
          }
          recenterMonthCarousel();
          monthSettling = false;
        },
        { once: true }
      );
    }

    document.getElementById("date-picker-prev").onclick = () => {
      datePickerMonth -= 1;
      if (datePickerMonth < 1) {
        datePickerMonth = 12;
        datePickerYear -= 1;
      }
      renderDatePickerGrid();
    };
    document.getElementById("date-picker-next").onclick = () => {
      datePickerMonth += 1;
      if (datePickerMonth > 12) {
        datePickerMonth = 1;
        datePickerYear += 1;
      }
      renderDatePickerGrid();
    };
    document.getElementById("date-picker-clear").onclick = () => {
      const cb = datePickerOnPick;
      closeDatePickerSheet();
      if (cb) cb(null);
    };

    // Список задач выбранного дня в месячном календаре (item 3, Phase 35)
    // — тот же компонент и тот же персистентный-узел паттерн, что уже
    // отработан у недельного вида (см. подробный комментарий у
    // weekDetailListEl/renderWeekDetail выше): пересоздание узла на
    // каждый render() ломает applyReorderElevation, поэтому узел создаётся
    // один раз и живёт, пока в месячном календаре вообще что-то выбрано.
    let monthDetailListEl = null;

    function renderMonthDayDetail(iso) {
      const el = document.getElementById("month-day-detail-list");
      if (!iso) {
        el.innerHTML = "";
        monthDetailListEl = null;
        return;
      }
      const listKey = "month:" + iso;
      if (!monthDetailListEl) {
        monthDetailListEl = document.createElement("div");
        monthDetailListEl.className = "list";
        attachReorderEntry(monthDetailListEl, () => "month:" + calSelectedDay);
        el.innerHTML = "";
        el.append(monthDetailListEl);
      }
      renderList(monthDetailListEl, tasksForDate(iso), {
        listKey,
        style: "swipe",
        showMoveToToday: false,
        showTemplatesPicker: true,
        dateFor: () => calSelectedDay,
      });
    }

    // Обновляет список задач выбранного дня после любой правки где-либо
    // (галочка, перенос даты и т.д.) — вызывается из общего render(), как
    // и renderWeekDetail(). Для дня в прошлом список не нужен (там ревью
    // дневника, не зависящее от задач) — не трогаем его тут, тяжёлый
    // сетевой поход за ревью не должен повторяться на каждый render().
    function refreshMonthDayDetail() {
      if (!calSelectedDay) return;
      const todayIso = boardState.days.today ? boardState.days.today.date : null;
      if (todayIso !== null && calSelectedDay >= todayIso) {
        renderMonthDayDetail(calSelectedDay);
      }
    }

    async function showDayInfo(iso) {
      const el = document.getElementById("month-cal-day-info");
      if (!iso) {
        el.classList.remove("visible");
        renderMonthDayDetail(null);
        return;
      }
      const todayIso = boardState.days.today ? boardState.days.today.date : null;
      const [y, m, d] = iso.split("-");
      const label = `${d}.${m}.${y}`;

      if (todayIso !== null && iso >= todayIso) {
        // Сегодня/будущее — полноценный список задач дня вместо прежнего
        // упрощённого read-only списка (item 3, Phase 35): тот же
        // компонент, что и в недельном виде, с чекбоксами, свайпом,
        // переносом и добавлением задач прямо на этот день.
        el.classList.remove("visible");
        renderMonthDayDetail(iso);
        return;
      }

      // Прошлое — ревью дня из дневника (Notion), если заполнено; список
      // задач тут не показываем (у прошлого дня список неактуален, а
      // ревью — единственное место в приложении, где он вообще виден, не
      // трогаем эту ветку, Phase 29).
      renderMonthDayDetail(null);
      el.classList.add("visible");
      el.innerHTML = `<p class="day-info-title">${label}</p><div style="color:var(--text-muted)">Загрузка…</div>`;
      try {
        const entry = await api(`/miniapp/api/diary/${iso}`);
        if (!entry) {
          el.innerHTML = `<p class="day-info-title">${label}</p><div style="color:var(--text-muted)">Дневник не заполнен</div>`;
          return;
        }
        const ratingLine = (label2, value) =>
          value != null ? `<span class="day-info-rating">${label2} <b>${value}</b></span>` : "";
        el.innerHTML =
          `<p class="day-info-title">${label} — ревью дня</p>` +
          `<div class="day-info-ratings">${ratingLine("физ.", entry.physical)}${ratingLine("соц.", entry.social)}${ratingLine("продукт.", entry.productivity)}${ratingLine("счастье", entry.happiness)}</div>` +
          (entry.highlight ? `<div>${escapeHtml(entry.highlight)}</div>` : "");
      } catch (e) {
        el.innerHTML = `<p class="day-info-title">${label}</p><div style="color:var(--text-muted)">Не удалось загрузить.</div>`;
      }
    }

    // Инбокс свёрнут по умолчанию — только заголовок со счётчиком, тап
    // разворачивает список и поле добавления.
    let inboxExpanded = false;
    document.getElementById("inbox-chevron").innerHTML = chevronIcon();
    document.getElementById("inbox-header").onclick = () => {
      inboxExpanded = !inboxExpanded;
      document.getElementById("inbox-body").style.display = inboxExpanded ? "" : "none";
      document.getElementById("inbox-chevron").classList.toggle("expanded", inboxExpanded);
    };

    // Долгое нажатие включает режим переноса в каждом из статических
    // списков (Вчера/Сегодня/Инбокс) — контейнеры переживают render()
    // (чистится только их innerHTML), так что слушатель достаточно
    // навесить один раз при загрузке. У календаря список пересоздаётся
    // заново на каждый выбранный день — там attachReorderEntry вызывается
    // прямо в renderWeekDetail().
    attachReorderEntry(document.getElementById("yesterday-list"), "yesterday");
    attachReorderEntry(document.getElementById("today-list"), "today");
    attachReorderEntry(document.getElementById("inbox-list"), "inbox");
    attachReorderEntry(document.getElementById("templates-list"), "templates");

    attachSheetOverswipeClose(
      document.getElementById("templates-sheet"),
      document.getElementById("templates-list"),
      closeTemplatesPicker,
      () => isReorderActive("templates")
    );
    attachSheetOverswipeClose(
      document.getElementById("project-picker-sheet"),
      document.getElementById("project-picker-list"),
      closeProjectPicker
    );
    attachSheetOverswipeClose(
      document.getElementById("color-picker-sheet"),
      document.getElementById("color-picker-list"),
      closeColorPicker
    );
    // create-entity-sheet больше не .bottom-sheet (Phase 33) — окно по
    // центру, закрывается крестиком/тапом по фону/кнопкой "Готово", без
    // свайпа (см. .entity-window в CSS и комментарий там же).
    document.getElementById("create-entity-close").addEventListener("click", closeCreateEntitySheet);

    attachScreenTransition();

    // Тап по затемнению — единственный выход из режима переноса (кнопки
    // "Готово" больше нет): список рисуется выше .reorder-scrim (см. CSS),
    // так что клики внутри него сюда не долетают — только клики "мимо".
    document.getElementById("reorder-scrim").addEventListener("click", () => {
      // Тап по затемнению: если в этот момент активен режим переноса
      // (в т.ч. для шаблонов) — обычный выход из него (архивирует
      // отмеченное). Иначе, если просто открыт picker шаблонов без
      // режима переноса — закрывает его без побочных эффектов.
      if (reorderActiveKey !== null) {
        exitReorderMode();
      } else if (templatesPickerOpen) {
        closeTemplatesPicker();
      } else if (projectPickerOpen) {
        closeProjectPicker();
      } else if (colorPickerProject !== null) {
        closeColorPicker();
      } else if (datePickerOpen) {
        // Проверяем раньше createEntityKind — календарь открыт поверх
        // формы (см. z-index #date-picker-sheet), тап мимо карточки
        // должен закрыть именно его, форма под ним остаётся открытой.
        closeDatePickerSheet();
      } else if (createEntityKind !== null) {
        closeCreateEntitySheet();
      } else if (helpSheetOpen) {
        closeHelpSheet();
      } else if (sideDrawerOpen) {
        closeSideDrawer();
      }
    });

    // Полоска недель — палец двигает .week-track напрямую через transform
    // (1:1, без нативного скролла), а после отпускания доезжает ровно
    // одним нашим CSS-transition до целевой недели. Три панели
    // (пред./тек./след.) переиспользуются: после доезда JS подменяет их
    // данные и мгновенно (без анимации) возвращает transform в центр —
    // имитация бесконечной прокрутки без похода в сеть.
    const weekCarousel = document.getElementById("week-carousel");
    const weekTrack = document.getElementById("week-track");
    const weekPages = Array.from(document.querySelectorAll("#week-track .week-page"));

    const WEEK_PANEL_RATIO = 0.88; // ширина панели — вместе с WEEK_GAP даёт ~4% видимого peek с каждой стороны
    const WEEK_GAP = 8; // должен совпадать с gap в .week-track — съедает часть отступа между панелями
    const WEEK_DRAG_THRESHOLD = 0.22; // доля шага панели, после которой при отпускании переключаем неделю
    const WEEK_FLING_VELOCITY = 0.5; // px/мс — быстрый флик переключает неделю независимо от пройденного расстояния

    function weekGeometry() {
      const vw = weekCarousel.clientWidth;
      const pw = vw * WEEK_PANEL_RATIO;
      return { vw, pw, step: pw + WEEK_GAP };
    }

    function applyWeekPanelSizes() {
      const { pw } = weekGeometry();
      weekPages.forEach((el) => {
        el.style.width = pw + "px";
      });
    }

    function weekRestX(index) {
      const { vw, pw, step } = weekGeometry();
      return vw / 2 - (index * step + pw / 2);
    }

    function setWeekTrackTransform(x, withTransition) {
      weekTrack.style.transition = withTransition ? "transform 240ms cubic-bezier(0.22, 1, 0.36, 1)" : "none";
      weekTrack.style.transform = `translateX(${x}px)`;
    }

    function recenterWeekCarousel() {
      applyWeekPanelSizes();
      setWeekTrackTransform(weekRestX(1), false);
    }

    let weekDrag = null;
    let weekSettling = false;

    weekTrack.addEventListener("pointerdown", (e) => {
      if (weekSettling) return;
      weekDrag = {
        pointerId: e.pointerId,
        startX: e.clientX,
        baseX: weekRestX(1),
        dragging: false,
        lastX: e.clientX,
        lastTime: e.timeStamp,
        velocity: 0,
      };
    });

    weekTrack.addEventListener("pointermove", (e) => {
      if (!weekDrag || e.pointerId !== weekDrag.pointerId) return;
      const dx = e.clientX - weekDrag.startX;
      if (!weekDrag.dragging) {
        if (Math.abs(dx) < 6) return; // ещё не ясно, тап это или свайп — не мешаем клику по ячейке
        weekDrag.dragging = true;
        weekTrack.setPointerCapture(weekDrag.pointerId);
      }
      const dt = e.timeStamp - weekDrag.lastTime;
      if (dt > 0) weekDrag.velocity = (e.clientX - weekDrag.lastX) / dt;
      weekDrag.lastX = e.clientX;
      weekDrag.lastTime = e.timeStamp;
      setWeekTrackTransform(weekDrag.baseX + dx, false);
      e.preventDefault();
    });

    function endWeekDrag(e) {
      if (!weekDrag || e.pointerId !== weekDrag.pointerId) return;
      const drag = weekDrag;
      weekDrag = null;
      if (!drag.dragging) return; // тап — ничего не двигали, клик по ячейке отработает сам

      const dx = e.clientX - drag.startX;
      const { step } = weekGeometry();
      let targetIndex = 1;
      if (Math.abs(drag.velocity) > WEEK_FLING_VELOCITY) {
        targetIndex = drag.velocity < 0 ? 2 : 0;
      } else if (Math.abs(dx) > step * WEEK_DRAG_THRESHOLD) {
        targetIndex = dx < 0 ? 2 : 0;
      }
      settleWeekCarousel(targetIndex);
    }

    weekTrack.addEventListener("pointerup", endWeekDrag);
    weekTrack.addEventListener("pointercancel", endWeekDrag);

    function settleWeekCarousel(targetIndex) {
      weekSettling = true;
      setWeekTrackTransform(weekRestX(targetIndex), true);
      weekTrack.addEventListener(
        "transitionend",
        () => {
          weekSettling = false;
          if (targetIndex === 1) return; // просто откатились назад — неделя не поменялась
          weekStart = addDaysIso(weekStart, (targetIndex === 0 ? -1 : 1) * 7);
          selectedWeekDate = null;
          renderWeekCarousel();
          recenterWeekCarousel();
          renderWeekDetail();
          updateDayLabel();
        },
        { once: true }
      );
    }

    const MONTH_NAMES = [
      "январь", "февраль", "март", "апрель", "май", "июнь",
      "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь",
    ];

    function monthLabelForWeek(wStart) {
      const endIso = addDaysIso(wStart, 6);
      const startMonth = parseInt(wStart.slice(5, 7), 10) - 1;
      const endMonth = parseInt(endIso.slice(5, 7), 10) - 1;
      if (startMonth === endMonth) return MONTH_NAMES[startMonth];
      return `${MONTH_NAMES[startMonth]} — ${MONTH_NAMES[endMonth]}`;
    }

    const _dayLabels = ["Вчера", "Сегодня", "Неделя"];
    const carousel = document.getElementById("day-carousel");
    const dayLabel = document.getElementById("day-label");
    const dayDots = Array.from(document.querySelectorAll(".day-dot"));
    const dayPages = Array.from(document.querySelectorAll(".day-page[data-day]"));

    function scrollToDay(index) {
      carousel.scrollTo({ left: carousel.clientWidth * index, behavior: "smooth" });
    }

    function updateDayLabel() {
      const index = Math.round(carousel.scrollLeft / carousel.clientWidth);
      if (index === 2 && weekStart) {
        dayLabel.textContent = `Неделя, ${monthLabelForWeek(weekStart)}`;
      } else {
        dayLabel.textContent = _dayLabels[index] ?? "Сегодня";
      }
      dayDots.forEach((dot, i) => dot.classList.toggle("active", i === index));

      // Карусель дней прокручивается нативно, без единого render() — если
      // на предыдущем экране был сфокусирован инпут (например, поле новой
      // задачи), он остаётся ровно тем же DOM-узлом и клавиатура не
      // закрывается сама, хотя экран уже другой (и, того хуже, набранное
      // дальше летит в инпут, которого не видно). Сам текст никуда не
      // девается — черновик уже сохраняется в addTaskDrafts при каждом
      // input-событии, так что просто снимаем фокус; при возврате на этот
      // экран заново фокусировать НЕ нужно — только показать, что уже есть.
      const active = document.activeElement;
      if (active && active.tagName === "INPUT") {
        const page = active.closest(".day-page[data-day]");
        if (page && dayPages[index] !== page) {
          active.blur();
        }
      }
    }

    // rAF-троттлинг вместо debounce на таймауте — точки следуют за пальцем
    // в реальном времени, а не с задержкой после остановки скролла.
    let _tracking = false;
    carousel.addEventListener("scroll", () => {
      if (_tracking) return;
      _tracking = true;
      requestAnimationFrame(() => {
        updateDayLabel();
        _tracking = false;
      });
    });
    dayDots.forEach((dot) => {
      dot.addEventListener("click", () => scrollToDay(Number(dot.dataset.index)));
    });
    // Стартуем сразу на "сегодня" (страница 1), без анимации.
    carousel.scrollLeft = carousel.clientWidth;

    async function loadDigest() {
      const el = document.getElementById("digest");
      try {
        const data = await api("/miniapp/api/briefing");
        el.textContent = data.weather || "Погода не настроена";
      } catch (e) {
        el.textContent = "Не удалось загрузить.";
      }
    }

    loadBoard();
    loadDigest();
    loadTemplates();
    loadProjects();
    loadAnalytics();
    loadGoals();
    loadMonthEvents();
  </script>
</body>
</html>
