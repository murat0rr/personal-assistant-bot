      actions.addEventListener("pointerdown", (e) => {
        if (!open) return;
        actionsStartX = e.clientX;
        actionsDragging = false;
      });
      actions.addEventListener("pointermove", (e) => {
        if (!open) return;
        const dx = e.clientX - actionsStartX;
        if (!actionsDragging) {
          if (dx < 6) return; // движение влево или совсем небольшое — не наш жест
          actionsDragging = true;
          try {
            actions.setPointerCapture(e.pointerId);
          } catch (err) {
            // синтетические события в тестах — не критично
          }
        }
        setReveal(Math.max(0, Math.min(SWIPE_MAX_REVEAL, SWIPE_MAX_REVEAL - dx)), false);
        e.preventDefault();
      });
      function endActionsDrag(e) {
        if (!actionsDragging) return;
        const dx = e.clientX - actionsStartX;
        actionsDragging = false;
        actionsJustDragged = true;
        // На случай, если браузер вообще не синтезирует click после этого
        // драга (типично для тач-жестов) — флаг иначе остался бы висеть
        // true навсегда и глушил бы следующий, уже совсем не связанный тап.
        setTimeout(() => {
          actionsJustDragged = false;
        }, 300);
        if (dx >= SWIPE_OPEN_THRESHOLD) {
          self.close();
        } else {
          setReveal(SWIPE_MAX_REVEAL, true);
        }
      }
      actions.addEventListener("pointerup", endActionsDrag);
      actions.addEventListener("pointercancel", endActionsDrag);
      actions.addEventListener(
        "click",
        (e) => {
          if (!actionsJustDragged) return;
          actionsJustDragged = false;
          e.stopPropagation();
          e.preventDefault();
        },
        true
      );

      return self;
    }

    // Ручной порядок, только внутри режима переноса (Phase 14) — палец
    // двигает саму строку (translateY) через ручку слева, а её DOM-соседи
    // в том же списке уступают место: как только видимый центр
    // перетаскиваемой строки пересекает середину соседа, они меняются
    // местами через insertBefore, а накопленная разница высот
    // компенсируется в translateY — так что палец и строка остаются под
    // одним и тем же местом на экране всю дорогу, без скачков. Сам
    // boardState/render() не трогаем, пока палец не отпустили — это
    // только визуальное превью, реальный порядок пересчитывается и
    // сохраняется один раз на pointerup (см. persist/commitOrder ниже).
    // Деления на события/обычные больше нет (Phase 14) — сортируется всё
    // вместе, соседи ищутся среди ВСЕХ строк списка без фильтра по группе.
    const REORDER_HOLD_MS = 450;
    const REORDER_MOVE_THRESHOLD = 8;

    function dragSiblings(row, selector) {
      return Array.from(row.parentElement.children).filter((n) => n.matches(selector));
    }

    // Текущая FLIP-анимация каждого соседа (см. shiftSibling ниже) — нужна,
    // чтобы при смене направления свайпа корректно её прервать. Баг,
    // который здесь чинится: CSS-transition сбрасывался только на
    // следующий requestAnimationFrame, и если тот же сосед снова попадал
    // под свап раньше, чем этот кадр наступил (типичная ситуация именно
    // при развороте направления — палец снова пересекает недавно
    // пройденную границу), getBoundingClientRect() у "after" замерял
    // положение с ещё висящим старым transform поверх нового layout —
    // отсюда наложение/залипание. Web Animations API с явным .cancel()
    // решает это синхронно, без гонки за кадром (тот же класс бага,
    // независимо чинили во Flutter — see PR flutter/flutter#173241,
    // "ReorderableList items jumping when drag direction reverses
    // mid-animation").
    const siblingAnimations = new WeakMap();

    // Старт переноса — сразу с первого сдвига пальца после нажатия на
    // ручку, без задержки (удержание+вибро пробовали, но это чисто UX-слой
    // поверх самого фикса, на надёжность не влияет — убрали по просьбе,
    // усложняло жест). А вот что остаётся — и что как раз чинит исходный
    // баг ("работает, пока палец на самой ручке, ломается, стоит чуть
    // отклониться от вертикали"): pointermove/up/cancel слушаются на
    // document, а не на самой ручке. Раньше слушали прямо на ручке и
    // полагались на setPointerCapture, чтобы продолжать получать события,
    // даже когда палец уходит за её 22px-границы — но в Telegram WebView
    // это не всегда надёжно: стоило пальцу отклониться от вертикали за
    // пределы иконки, событий больше не приходило вовсе, перенос зависал
    // навсегда с повисшим transform и тенью поверх соседней задачи. На
    // document такой границы просто нет — не важно, где физически
    // находится палец, X-координата в самой логике переноса вообще не
    // участвует, только Y.
    function setupDragReorder({ row, trigger, rowSelector, getSortOrder, persist }) {
      let dragging = false;
      let moved = false; // реальный перенос состоялся — подавляет клик по названию
      let pointerId = null;
      let startY = 0; // точка отсчёта dy — пересчитывается на момент хвата (beginDrag), не на pointerdown
      let curY = 0; // последняя известная позиция пальца, обновляется всё время, пока указатель "нажат"
      let compensation = 0; // накопленная поправка от свапов соседей
      let lastDy = 0;
      let settleAnim = null; // доводка ЭТОЙ строки при отпускании (endDrag), если ещё идёт

      function applyTransform(dy) {
        lastDy = dy;
        row.style.transform = `translateY(${compensation + dy}px)`;
      }

      // Соседа, которого строка обгоняет, плавно сдвигаем на освободившееся
      // место (FLIP: запоминаем его позицию до перестановки DOM, применяем
      // разницу как мгновенный transform, затем этот transform анимируем в
      // 0) — без этого сосед просто телепортировался бы на новое место.
      // Порядок важен: "before" читаем ДО отмены старой анимации — это
      // реальная видимая позиция соседа прямо сейчас, даже если он ещё
      // едет по недоигранной анимации с прошлого свапа (иначе — тот же
      // "прыжок к устаревшей стартовой точке", что чинили во Flutter).
      // А вот "after" должен быть чистым — старую анимацию отменяем
      // именно между этими двумя замерами, до mutate/после before.
      function shiftSibling(sib, mutate) {
        const before = sib.getBoundingClientRect().top;
        const prevAnim = siblingAnimations.get(sib);
        if (prevAnim) prevAnim.cancel();
        mutate();
        const after = sib.getBoundingClientRect().top;
        const delta = before - after;
        siblingAnimations.delete(sib);
        if (delta === 0) return;
        const anim = sib.animate(
          [{ transform: `translateY(${delta}px)` }, { transform: "translateY(0px)" }],
          { duration: 160, easing: "ease" }
        );
        siblingAnimations.set(sib, anim);
        anim.finished.catch(() => {}).finally(() => {
          if (siblingAnimations.get(sib) === anim) siblingAnimations.delete(sib);
        });
      }

      // Цикл, а не одна перестановка за вызов — на резком рывке между
      // двумя pointermove палец может пролететь сразу через несколько
      // соседей, и если остановиться на первом же свапе, строка визуально
      // не "догонит" палец до конца жеста (см. баг с залипанием/наложением
      // при резком отпускании). Продолжаем, пока не перестанем находить,
      // кого обгонять.
      function tryReorder() {
        let swapped = true;
        while (swapped) {
          swapped = false;
          const rect = row.getBoundingClientRect();
          const centerY = rect.top + rect.height / 2;
          const all = dragSiblings(row, rowSelector);
          const rowIndex = all.indexOf(row);
          for (let i = 0; i < all.length; i++) {
            const sib = all[i];
            if (sib === row) continue;
            const sRect = sib.getBoundingClientRect();
            const sCenter = sRect.top + sRect.height / 2;
            if (i < rowIndex && centerY < sCenter) {
              shiftSibling(sib, () => row.parentElement.insertBefore(row, sib));
              compensation += sRect.height;
              applyTransform(lastDy);
              swapped = true;
              break;
            }
            if (i > rowIndex && centerY > sCenter) {
              shiftSibling(sib, () => row.parentElement.insertBefore(row, sib.nextSibling));
              compensation -= sRect.height;
              applyTransform(lastDy);
              swapped = true;
              break;
            }
          }
        }
      }

      function beginDrag() {
        closeOpenSwipeRow();
        if (!row.isConnected) {
          // Открытая шторка ЭТОЙ ЖЕ строки только что закрылась с
          // отложенной пересортировкой (needsResortOnClose, см.
          // renderSwipeableTaskRow) — render() внутри closeOpenSwipeRow уже
          // пересобрал список и заменил этот DOM-узел новым, продолжать
          // перенос старым узлом больше некуда, тихо отменяем.
          cleanupPointer();
          return;
        }
        // startY уже выставлен в pointerdown — не трогаем его здесь: это и
        // есть точка отсчёта для самого первого кадра переноса. (Раньше,
        // при удержании, тут был пересчёт на текущую позицию — но раз
        // старт мгновенный, curY на момент этого вызова равен той же
        // точке, что палец только что достиг, и пересчёт обнулил бы сам
        // первый скачок движения.)
        dragging = true;
        moved = true;
        // Строку схватили заново раньше, чем доспела доводка предыдущего
        // переноса — прерываем её синхронно (см. shiftSibling выше про
        // ту же идею для соседей): .cancel() не оставляет зависшего
        // transition, который иначе ехал бы поверх нового переноса.
        if (settleAnim) {
          settleAnim.cancel();
          settleAnim = null;
        }
        row.classList.add("reorder-dragging");
        compensation = 0;
        applyTransform(0);
      }

      function commitOrder() {
        const all = dragSiblings(row, rowSelector);
        const idx = all.indexOf(row);
        const prevOrder = idx > 0 ? getSortOrder(all[idx - 1]) : null;
        const nextOrder = idx < all.length - 1 ? getSortOrder(all[idx + 1]) : null;
        let newOrder;
        if (prevOrder != null && nextOrder != null) newOrder = (prevOrder + nextOrder) / 2;
        else if (prevOrder != null) newOrder = prevOrder + 1000;
        else if (nextOrder != null) newOrder = nextOrder - 1000;
        else return; // единственная строка в группе — переставлять некуда
        persist(newOrder);
      }

      function endDrag(commit) {
        if (dragging) {
          // Доводка — translateY плавно едет от текущего положения (то,
          // что прямо сейчас в row.style.transform) к 0 — это ровно её
          // место в DOM, все свапы уже применены. Тень/приподнятость
          // снимаем и boardState фиксируем только после того, как анимация
          // реально закончилась. Раньше сброс был мгновенным (плюс гонка
          // за requestAnimationFrame у соседей, см. shiftSibling) — на
          // резком рывке+отпускании это выглядело как строка, застрявшая
          // поверх соседней.
          const anim = row.animate(
            [{ transform: row.style.transform || "translateY(0px)" }, { transform: "translateY(0px)" }],
            { duration: 180, easing: "cubic-bezier(0.22, 1, 0.36, 1)" }
          );
          settleAnim = anim;
          anim.finished
            .then(() => {
              if (settleAnim !== anim) return; // отменена более новым переносом (см. beginDrag) — уже неактуальна
              settleAnim = null;
              row.classList.remove("reorder-dragging");
              row.style.transform = "";
              if (commit) commitOrder();
            })
            .catch(() => {
              // anim.cancel() отклоняет finished — ожидаемый путь, когда
              // строку схватили заново раньше, чем доспела эта доводка
              // (см. settleAnim.cancel() в beginDrag).
            });
        }
        dragging = false;
        pointerId = null;
      }

      // Слушатели висят на document только пока этот конкретный указатель
      // "нажат" (от pointerdown на ручке до pointerup/pointercancel) —
      // снимаются сразу же в cleanupPointer, а не остаются на весь срок
      // жизни строки: иначе на списке из десятков задач копились бы
      // десятки document-обработчиков одновременно.
      function onDocPointerMove(e) {
        if (pointerId === null || e.pointerId !== pointerId) return;
        curY = e.clientY;
        if (!dragging) {
          // Первый же сдвиг после нажатия на ручку — сразу перенос, без
          // задержки (beginDrag сам возьмёт curY как точку отсчёта).
          beginDrag();
          if (!dragging) return; // строка исчезла — см. beginDrag
        }
        applyTransform(curY - startY);
        tryReorder();
        e.preventDefault();
      }

      function onDocPointerUp(e) {
        if (pointerId === null || e.pointerId !== pointerId) return;
        endDrag(dragging);
        cleanupPointer();
      }

      function onDocPointerCancel(e) {
        if (pointerId === null || e.pointerId !== pointerId) return;
        endDrag(false);
        cleanupPointer();
      }

      function cleanupPointer() {
        document.removeEventListener("pointermove", onDocPointerMove);
        document.removeEventListener("pointerup", onDocPointerUp);
        document.removeEventListener("pointercancel", onDocPointerCancel);
        pointerId = null;
      }

      trigger.addEventListener("pointerdown", (e) => {
        if (pointerId !== null) return; // уже держим один палец — второй игнорируем
        pointerId = e.pointerId;
        startY = e.clientY;
        curY = e.clientY;
        dragging = false;
        moved = false;
        document.addEventListener("pointermove", onDocPointerMove);
        document.addEventListener("pointerup", onDocPointerUp);
        document.addEventListener("pointercancel", onDocPointerCancel);
      });

      return {
        // Клик по названию (инлайн-правка) проверяет это перед тем как
        // открыть поле ввода — реальный перенос не должен ещё и включить
        // редактирование текста тем же жестом.
        wasDragged: () => moved,
      };
    }

    // Строка задачи со свайп-шторкой — Вчера/Сегодня/календарь. Инбокс
    // держит свой renderTaskRow с всегда видимыми иконками (см. render()) —
    // там свайп ни к чему, действия там нужны мгновенно, без лишнего жеста.
    function renderSwipeableTaskRow(task, { showMoveToToday }) {
      const isPending = pendingIds.has(task.id);
      let swipeHandle = null; // назначим после setupSwipeDrag ниже
      // true, если приоритет поменяли, пока шторка была открыта — тогда
      // полный render() (пересортировка/смена группы) откладываем до
      // закрытия, см. syncPriorityUI и переопределение swipeHandle.close
      // ниже.
      let needsResortOnClose = false;

      const wrap = document.createElement("div");
      wrap.className = "swipe-wrap" + (isPending ? " pending" : "");

      const actions = document.createElement("div");
      actions.className = "swipe-actions";

      // Важность и событие — два независимых значка-переключателя вместо
      // одной кнопки-цикла: нажал один — стал ярким, нажал другой — первый
      // гаснет (оба значения живут в одном и том же поле priority, поэтому
      // взаимоисключающие). Повторный тап по уже активному — снятие,
      // возврат к нейтральному приоритету.
      const importantBtn = document.createElement("button");
      importantBtn.className = "swipe-btn" + (task.priority === "высокий" ? " active" : "");
      importantBtn.disabled = isPending;
      importantBtn.setAttribute("aria-label", "Важная задача");
      importantBtn.innerHTML = importantIcon();
      // Панель специально НЕ закрываем здесь — можно сразу передумать и
      // тапнуть другой значок, не открывая шторку заново. Полный render()
      // (который пересортировал бы список и мог унести строку в другую
      // группу) тоже откладываем — см. syncPriorityUI/needsResortOnClose
      // ниже: список перестроится только когда шторку закроют, а не прямо
      // во время работы с ней.
      importantBtn.onclick = () => {
        needsResortOnClose = true;
        setTaskPriority(
          task,
          task.priority === "высокий" ? "средний" : "высокий",
          syncPriorityUI
        );
      };

      const eventBtn = document.createElement("button");
      eventBtn.className = "swipe-btn" + (task.priority === "event" ? " active" : "");
      eventBtn.disabled = isPending;
      eventBtn.setAttribute("aria-label", "Событие");
      eventBtn.innerHTML = eventPinIcon();
      eventBtn.onclick = () => {
        needsResortOnClose = true;
        setTaskPriority(task, task.priority === "event" ? "средний" : "event", syncPriorityUI);
      };

      const dateBtn = document.createElement("button");
      dateBtn.className = "swipe-btn";
      dateBtn.disabled = isPending;
      dateBtn.setAttribute("aria-label", "Дата и время");
      dateBtn.innerHTML = calendarIcon();
      const dateInput = document.createElement("input");
      // Для события сразу дата+время одним пикером; для обычной задачи —
      // только дата, как и было, без лишнего поля под редкий случай.
      dateInput.type = task.priority === "event" ? "datetime-local" : "date";
      dateInput.onchange = () => {
        if (!dateInput.value) return;
        swipeHandle.close();
        setTaskDueDate(task, dateInput.value);
      };
      dateBtn.onclick = () => (dateInput.showPicker ? dateInput.showPicker() : dateInput.click());
      dateBtn.append(dateInput);

      // Проект (Phase 19) — открывает picker (тот же bottom sheet
      // паттерн, что шаблоны), активная привязка подсвечена.
      const projectBtn = document.createElement("button");
      projectBtn.className = "swipe-btn" + (task.project_id ? " active" : "");
      projectBtn.disabled = isPending;
      projectBtn.setAttribute("aria-label", "Проект");
      projectBtn.innerHTML = projectIcon();
      projectBtn.onclick = () => {
        swipeHandle.close();
        openProjectPicker(task);
      };

      const archiveBtn = document.createElement("button");
      archiveBtn.className = "swipe-btn swipe-btn-archive";
      archiveBtn.disabled = isPending;
      archiveBtn.setAttribute("aria-label", "Архивировать");
      archiveBtn.innerHTML = archiveIcon();
      archiveBtn.onclick = () => archiveTask(task);

      actions.append(importantBtn, eventBtn, dateBtn, projectBtn, archiveBtn);

      const content = document.createElement("div");
      content.className = "swipe-content";

      const checkbox = renderStatusCircle(task, isPending, () => toggleTaskDone(task));
      content.append(checkbox);

      // Текст только читается здесь — правка доступна лишь в режиме
      // переноса (Phase 14, см. renderReorderRow), поэтому у заголовка
      // намеренно нет обработчика клика.
      const title = document.createElement("span");
      title.className = titleClass(task);
      title.textContent = task.title;
      content.append(title);

      if (task.due_time) {
        const time = document.createElement("span");
        time.className = "due-time";
        time.textContent = task.due_time;
        content.append(time);
      }

      if (showMoveToToday && !task.done) {
        const moveBtn = document.createElement("button");
        moveBtn.className = "small-btn";
        moveBtn.disabled = isPending;
        moveBtn.setAttribute("aria-label", "Перенести на сегодня");
        moveBtn.innerHTML = moveToTodayIcon();
        moveBtn.onclick = () => setTaskDueDate(task, boardState.days.today.date);
        content.append(moveBtn);
      }

      const handle = document.createElement("span");
      handle.className = "swipe-handle";
      content.append(handle);

      // Узкая зона у правого края — единственное место, откуда стартует
      // свайп этой задачи (см. .swipe-zone в CSS). Вне её палец отдаём
      // внешней карусели вчера/сегодня/неделя, как везде на странице.
      const zone = document.createElement("span");
      zone.className = "swipe-zone";
      content.append(zone);

      // Обновляет активность значков важности/события, тип пикера даты
      // (для события — сразу с временем), содержимое кружка статуса и
      // жирность заголовка — без пересборки всей строки и без изменения
      // её позиции в списке. Вызывается вместо render() из
      // importantBtn/eventBtn, пока шторка открыта (см. needsResortOnClose
      // ниже).
      function syncPriorityUI() {
        importantBtn.classList.toggle("active", task.priority === "высокий");
        eventBtn.classList.toggle("active", task.priority === "event");
        const stillPending = pendingIds.has(task.id);
        importantBtn.disabled = stillPending;
        eventBtn.disabled = stillPending;
        dateInput.type = task.priority === "event" ? "datetime-local" : "date";

        checkbox.innerHTML = task.done ? checkIcon() : task.priority === "event" ? eventPinIcon() : "";
        title.className = titleClass(task);
      }

      wrap.append(actions, content);
      swipeHandle = setupSwipeDrag(zone, actions, task.id);

      // Если приоритет меняли при открытой шторке, список пересортируем и
      // перегруппируем только сейчас, в момент закрытия — не посреди
      // работы с панелью (вдруг следом ещё и дату хотели выбрать).
      const baseClose = swipeHandle.close;
      swipeHandle.close = () => {
        baseClose();
        if (needsResortOnClose) {
          needsResortOnClose = false;
          render();
        }
      };

      if (task.id === openSwipeTaskId) {
        // Эту же задачу только что пересобрал render() (например, после
        // закрытия шторки с изменённым приоритетом) — её шторка была
        // открыта, восстанавливаем без анимации.
        swipeHandle.reopenInstant();
        openSwipeRow = swipeHandle;
      }
      return wrap;
    }

    function renderEmpty(container) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Пусто";
      container.append(empty);
    }

    // Значок статуса и заголовок с курсором в точке тапа заменяются на
    // поле ввода — тянуть каретку в сторону не нужно, это уже умеет сам
    // телефон (нативная ручка-капелька под курсором есть у любого
    // сфокусированного текстового поля на iOS/Android).
    function startReorderInlineEdit(row, title, task, clickX, renameFn = renameTask) {
      // Курсор считаем ДО подмены span на input (item 2, Phase 32, БАГ):
      // caretRangeFromPoint надёжно бьёт по обычному тексту (title —
      // span с текстовым узлом), но не по <input> — там за offset
      // возвращается DOM-индекс дочернего узла, а не позиция символа в
      // значении поля. Раньше это считалось уже ПОСЛЕ row.replaceChild,
      // то есть всегда против уже вставленного input — первый тап
      // промахивался (курсор уезжал к 1-му символу), только второй тап
      // (когда caretRangeFromPoint для той же позиции экрана иначе не
      // пересчитывался, input уже был там) случайно совпадал.
      let idx = task.title.length;
      try {
        const rect = row.getBoundingClientRect();
        const range = document.caretRangeFromPoint
          ? document.caretRangeFromPoint(clickX, rect.top + rect.height / 2)
          : null;
        if (range && row.contains(range.startContainer)) idx = range.startOffset;
      } catch (err) {
        // Не критично — просто останется курсор в конце.
      }

      const input = document.createElement("input");
      input.type = "text";
      input.className = "title-edit title-full";
      input.value = task.title;
      row.replaceChild(input, title);
      input.focus();
      input.setSelectionRange(idx, idx);

      function finish(commit) {
        input.removeEventListener("blur", onBlur);
        input.removeEventListener("keydown", onKeydown);
        input.removeEventListener("dblclick", onDblClick);
        if (commit) {
          const trimmed = input.value.trim();
          if (trimmed && trimmed !== task.title) {
            title.textContent = trimmed;
            renameFn(task, trimmed);
          }
        }
        row.replaceChild(title, input);
      }
      function onBlur() {
        finish(true);
      }
      function onKeydown(e) {
        if (e.key === "Enter") {
          e.preventDefault();
          input.blur();
        } else if (e.key === "Escape") {
          finish(false);
        }
      }
      // При 2 нажатии в режиме редактирования — выделить текст целиком.
      function onDblClick() {
        input.select();
      }
      input.addEventListener("blur", onBlur);
      input.addEventListener("keydown", onKeydown);
      input.addEventListener("dblclick", onDblClick);
    }

    // Строка в режиме переноса (Phase 14) — общая и для Вчера/Сегодня/
    // календаря, и для Инбокса: слева ручка вместо кружка статуса, текст
    // целиком без усечения и без жирности/зачёркивания (никакого
    // статуса/приоритета в этом режиме не показываем), справа — отложенное
    // удаление (архивируется пачкой при выходе из режима, см.
    // toggleReorderArchive/exitReorderMode).
    function renderReorderRow(task, ctx) {
      const isPending = pendingIds.has(task.id);
      const markedForArchive = pendingArchiveIds.has(task.id);

      const row = document.createElement("div");
      row.className =
        "row reorder-row" + (isPending ? " pending" : "") + (markedForArchive ? " pending-archive" : "");
      row.dataset.sortOrder = String(task.sort_order);

      const grip = document.createElement("span");
      grip.className = "grip";
      grip.setAttribute("aria-label", "Перетащить");
      grip.innerHTML = gripIcon();
      row.append(grip);

      // Зачёркивание выполненных видно и в режиме переноса (item 3,
      // Phase 33) — раньше строка не показывала done вообще (Phase 14 —
      // "текст показывается полностью без статуса/приоритета", но
      // зачёркивание это не статус-кружок/приоритет, а как раз то, что
      // помогает не перепутать задачи, пока их двигаешь).
      const title = document.createElement("span");
      title.className = "title title-full" + (task.done ? " done" : "");
      title.textContent = task.title;
      row.append(title);

      const dragCtl = setupDragReorder({
        row,
        trigger: grip,
        rowSelector: ".reorder-row",
        getSortOrder: (el) => parseFloat(el.dataset.sortOrder),
        persist: (newOrder) => setTaskSortOrder(task, newOrder),
      });

      title.onclick = (e) => {
        if (isPending || markedForArchive || dragCtl.wasDragged()) return;
        startReorderInlineEdit(row, title, task, e.clientX);
      };

      const archiveBtn = document.createElement("button");
      archiveBtn.className = "small-btn reorder-archive-btn" + (markedForArchive ? " marked" : "");
      archiveBtn.disabled = isPending;
      archiveBtn.setAttribute("aria-label", markedForArchive ? "Отменить удаление" : "Удалить задачу");
      archiveBtn.innerHTML = markedForArchive ? undoIcon() : archiveIcon();
      archiveBtn.onclick = () => toggleReorderArchive(task);
      row.append(archiveBtn);

      return row;
    }

    // Строка шаблона в режиме переноса (Phase 18) — двойник renderReorderRow
    // выше, с поправкой на источник данных (шаблоны, не задачи) и своим
    // набором эндпоинтов. Не обобщаю в одну общую функцию с
    // renderReorderRow — риск задеть уже отлаженный путь для задач выше
    // пользы; дублирование тут ровно то, что почистит будущая разбивка
    // index.html на модули (SPEC.md §5), не стоит делать это попутно здесь.
    function renderTemplateReorderRow(template) {
      const isPending = pendingTemplateIds.has(template.id);
      const markedForArchive = pendingArchiveIds.has(template.id);

      const row = document.createElement("div");
      row.className =
        "row reorder-row" + (isPending ? " pending" : "") + (markedForArchive ? " pending-archive" : "");
      row.dataset.sortOrder = String(template.sort_order);

      const grip = document.createElement("span");
      grip.className = "grip";
      grip.setAttribute("aria-label", "Перетащить");
      grip.innerHTML = gripIcon();
      row.append(grip);

      const title = document.createElement("span");
      title.className = "title title-full";
      title.textContent = template.title;
      row.append(title);

      const dragCtl = setupDragReorder({
        row,
        trigger: grip,
        rowSelector: ".reorder-row",
        getSortOrder: (el) => parseFloat(el.dataset.sortOrder),
        persist: (newOrder) => setTemplateSortOrder(template, newOrder),
      });

      title.onclick = (e) => {
        if (isPending || markedForArchive || dragCtl.wasDragged()) return;
        startReorderInlineEdit(row, title, template, e.clientX, renameTemplate);
      };

      const archiveBtn = document.createElement("button");
      archiveBtn.className = "small-btn reorder-archive-btn" + (markedForArchive ? " marked" : "");
      archiveBtn.disabled = isPending;
      archiveBtn.setAttribute("aria-label", markedForArchive ? "Отменить удаление" : "Удалить шаблон");
      archiveBtn.innerHTML = markedForArchive ? undoIcon() : archiveIcon();
      archiveBtn.onclick = () => toggleReorderArchive(template);
      row.append(archiveBtn);

      return row;
    }

    // Строка шаблона в обычном режиме (Phase 18) — только текст, тап
    // мгновенно создаёт задачу (см. useTemplate). Никакого кружка статуса
    // или даты — пункт 1 требований прямо это исключает.
    function renderTemplateRow(template) {
      const isPending = pendingTemplateIds.has(template.id);
      const row = document.createElement("div");
      row.className = "row template-row" + (isPending ? " pending" : "");

      const title = document.createElement("span");
      title.className = "title title-full";
      title.textContent = template.title;
      row.append(title);

      row.onclick = () => {
        if (isPending) return;
        useTemplate(template);
      };

      return row;
    }

    // Строка добавления нового шаблона внизу sheet — тот же паттерн, что
    // renderAddTaskRow, но без даты/статуса и своего эндпоинта создания.
    let templateDraft = "";
    function renderAddTemplateRow() {
      const row = document.createElement("div");
      row.className = "row add-task-row";

      const input = document.createElement("input");
      input.type = "text";
      input.placeholder = "Новый шаблон";
      input.value = templateDraft;
      row.append(input);

      const submitBtn = document.createElement("button");
      submitBtn.className = "icon-btn add-task-submit";
      submitBtn.setAttribute("aria-label", "Добавить шаблон");
      submitBtn.innerHTML = plusIcon();
      submitBtn.disabled = !templateDraft.trim();
      input.addEventListener("input", () => {
        templateDraft = input.value;
        submitBtn.disabled = !input.value.trim();
      });

      const submit = () => {
        const value = input.value.trim();
        if (!value) return;
        templateDraft = "";
        createTemplate(value);
      };
      submitBtn.onclick = submit;
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") submit();
      });
      row.append(submitBtn);

      return row;
    }

    // Рендерит #templates-list — вызывается из общего render(), как
    // остальные списки. Тот же переключатель обычный/reorder режим, что и
    // renderList, но своя реализация: коллекция шаблонов не участвует в
    // группировке по дням/событиям, ей это не нужно.
    function renderTemplatesList() {
      const container = document.getElementById("templates-list");
      const reorderMode = isReorderActive("templates");
      container.classList.toggle("reorder-active-list", reorderMode);
      container.innerHTML = "";
      const sorted = [...templatesData].sort((a, b) => a.sort_order - b.sort_order);
      if (sorted.length === 0) {
        renderEmpty(container);
      } else {
        sorted.forEach((t) => {
          container.append(reorderMode ? renderTemplateReorderRow(t) : renderTemplateRow(t));
        });
      }
      container.append(renderAddTemplateRow());
    }

    function openTemplatesPicker(dateFor) {
      templatesPickerDateFor = dateFor;
      templatesPickerOpen = true;
      render();
    }

    function closeTemplatesPicker() {
      templatesPickerOpen = false;
      templatesPickerDateFor = null;
      render();
    }

    function renderSphereChips(selected, onSelect) {
      const wrap = document.createElement("div");
      wrap.className = "sphere-chips";
      const options = [["", "без сферы"], ...SPHERES.map((s) => [s, s])];
      for (const [value, label] of options) {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "sphere-chip" + (selected === value ? " selected" : "");
        chip.textContent = label;
        chip.onclick = () => onSelect(value);
        wrap.append(chip);
      }
      return wrap;
    }

    // ---- Проекты/цели в стиле задач (Phase 26) — переключатель-свайп
    // (тот же паттерн, что у аналитики), строки как у задач: кружок
    // статуса + заголовок + краткие данные справа + свайп-шторка.

    function formatShortDate(iso) {
      const [, m, d] = iso.split("-");
      return `${d}.${m}`;
    }

    function projectMeta(p) {
      if (p.start_date && p.end_date) {
        return `${formatShortDate(p.start_date)}–${formatShortDate(p.end_date)} · ${p.done_count}/${p.task_count}`;
      }
      return `${p.done_count}/${p.task_count}`;
    }

    // "Не дозаполнено" (Phase 28) — только у проектов: у них реально
    // много необязательных полей (описание/сфера/даты). У целей сфера
    // обязательна уже на создании (см. commitEntityForm), остальное либо
    // не редактируется отдельно, либо всегда имеет разумное значение по
    // умолчанию — подсвечивать там нечего. Цвет проекта — сознательно не
    // в списке: при отсутствии выбора он назначается случайно, не
    // остаётся "пустым" полем.
    function isEntityIncomplete(entity, kind) {
      if (kind !== "project") return false;
      return !entity.description || !entity.sphere || !entity.start_date || !entity.end_date;
    }

    // Долгое нажатие по строке проекта/цели — открывает форму правки,
    // предзаполненную текущими значениями (Phase 28). Тот же паттерн
    // "таймер + отмена по сдвигу/отпусканию", что и у остальных
    // long-press жестов приложения (см. attachReorderEntry) — слушатели
    // движения/отпускания на document, не на самом элементе.
    function attachEntityLongPress(el, entity, kind) {
      const HOLD_MS = 450;
      const MOVE_THRESHOLD = 8;
      let timer = null;
      let startX = 0;
      let startY = 0;
      let pointerId = null;

      function clear() {
        clearTimeout(timer);
        timer = null;
      }

      el.addEventListener("pointerdown", (e) => {
        if (e.target.closest(".checkbox, .swipe-zone, .swipe-handle")) return;
        startX = e.clientX;
        startY = e.clientY;
        pointerId = e.pointerId;
        clearTimeout(timer);
        timer = setTimeout(() => {
          timer = null;
          tg?.HapticFeedback?.impactOccurred("medium");
          openEditEntitySheet(entity, kind);
        }, HOLD_MS);
      });
      document.addEventListener("pointermove", (e) => {
        if (!timer || e.pointerId !== pointerId) return;
        if (Math.abs(e.clientX - startX) > MOVE_THRESHOLD || Math.abs(e.clientY - startY) > MOVE_THRESHOLD) {
          clear();
        }
      });
      document.addEventListener("pointerup", (e) => {
        if (e.pointerId === pointerId) clear();
      });
      document.addEventListener("pointercancel", (e) => {
        if (e.pointerId === pointerId) clear();
      });
    }

    // Общая строка проекта/цели в стиле задачи: кружок статуса слева,
    // заголовок, краткие данные справа, свайп открывает 1-2 действия
    // (архивировать, для проекта ещё и цвет). taskId в setupSwipeDrag
    // получает строковый префикс — id проекта/цели/задачи не должны
    // путаться в общем openSwipeTaskId (см. комментарий у переменной).
    function renderEntityRow(entity, kind) {
      const wrap = document.createElement("div");
      wrap.className = "swipe-wrap" + (isEntityIncomplete(entity, kind) ? " entity-incomplete" : "");

      const actions = document.createElement("div");
      actions.className = "swipe-actions";

      if (kind === "project") {
        const colorBtn = document.createElement("button");
        colorBtn.className = "swipe-btn";
        colorBtn.setAttribute("aria-label", "Цвет");
        colorBtn.innerHTML = icon('<circle cx="12" cy="12" r="8"/>', 16);
        colorBtn.style.color = entity.color || "var(--text-muted)";
        colorBtn.onclick = () => {
          swipeHandle.close();
          openColorPicker(entity);
        };
        actions.append(colorBtn);
      }

      const archiveBtn = document.createElement("button");
      archiveBtn.className = "swipe-btn swipe-btn-archive";
      archiveBtn.setAttribute("aria-label", "Архивировать");
      archiveBtn.innerHTML = archiveIcon();
      archiveBtn.onclick = () => archiveEntity(entity, kind);
      actions.append(archiveBtn);

      const content = document.createElement("div");
      content.className = "swipe-content";

      const checkbox = document.createElement("button");
      checkbox.className = "checkbox" + (entity.done ? " done" : "");
      checkbox.setAttribute("aria-label", entity.done ? "Снять отметку" : "Отметить выполненным");
      if (entity.done) checkbox.innerHTML = checkIcon();
      checkbox.onclick = () => setEntityDone(entity, kind, !entity.done);
      content.append(checkbox);

      const title = document.createElement("span");
      title.className = "title title-full" + (entity.done ? " done" : "");
      title.textContent = kind === "project" ? entity.title : entity.text;
      content.append(title);

      if (kind === "project" && entity.color) {
        const dot = document.createElement("span");
        dot.className = "entity-color-dot";
        dot.style.background = entity.color;
        content.append(dot);
      }

      const meta = document.createElement("span");
      meta.className = "entity-meta";
      meta.textContent = kind === "project" ? projectMeta(entity) : entity.sphere;
      content.append(meta);

      const handle = document.createElement("span");
      handle.className = "swipe-handle";
      content.append(handle);
      const zone = document.createElement("span");
      zone.className = "swipe-zone";
      content.append(zone);

      wrap.append(actions, content);
      const swipeHandle = setupSwipeDrag(zone, actions, (kind === "project" ? "project-" : "goal-") + entity.id);
      attachEntityLongPress(content, entity, kind);
      return wrap;
    }

    // Строка добавления внизу списка проектов/целей (Phase 28) — тот же
    // визуальный паттерн, что renderAddTaskRow у задач: поле + "+".
    // В отличие от задач, тап по "+" не создаёт сущность мгновенно —
    // открывает форму (openCreateEntitySheet), предзаполненную введённым
    // текстом, чтобы можно было сразу дозаполнить остальные поля.
    // draftKey — "project" или "goal-<tier>" (у каждого тира свой
    // черновик, как у addTaskDrafts). tierForGoal — какой тир
    // предвыбрать в форме, если добавляем цель со страницы конкретного
    // тира.
    function renderAddEntityRow(kind, draftKey, tierForGoal) {
      const draft = addEntityDrafts[draftKey] || (addEntityDrafts[draftKey] = { title: "" });

      const row = document.createElement("div");
      row.className = "row add-task-row";

      const input = document.createElement("input");
      input.type = "text";
      input.placeholder = kind === "project" ? "Новый проект" : "Новая цель";
      input.value = draft.title;
      input.addEventListener("input", () => (draft.title = input.value));
      row.append(input);

      const submitBtn = document.createElement("button");
      submitBtn.className = "icon-btn add-task-submit";
      submitBtn.setAttribute("aria-label", kind === "project" ? "Создать проект" : "Создать цель");
      submitBtn.innerHTML = plusIcon();

      const submit = () => {
        const value = input.value.trim();
        addEntityDrafts[draftKey] = { title: "" };
        openCreateEntitySheet(kind, value);
        if (kind === "goal" && tierForGoal) createEntityDraft.tier = tierForGoal;
        render();
      };
      submitBtn.onclick = submit;
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") submit();
      });
      row.append(submitBtn);

      return row;
    }

    function renderEntityList(containerId, items, kind, draftKey, tierForGoal) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";
      if (items.length === 0) {
        renderEmpty(container);
      } else {
        for (const item of items) container.append(renderEntityRow(item, kind));
      }
      container.append(renderAddEntityRow(kind, draftKey, tierForGoal));
    }

    const GOAL_TIERS = ["weekly", "monthly", "yearly"];

    function renderProjectsPage() {
      renderEntityList("pg-projects", projectsData, "project", "project");
    }

    function renderGoalsPages() {
      for (const tier of GOAL_TIERS) {
        const items = goalsData.filter((g) => g.tier === tier);
        renderEntityList("pg-goals-" + tier, items, "goal", "goal-" + tier, tier);
      }
    }

    async function setEntityDone(entity, kind, done) {
      const prev = entity.done;
      entity.done = done;
      renderProjectsPage();
      renderGoalsPages();
      try {
        const path = kind === "project" ? `/miniapp/api/projects/${entity.id}/done` : `/miniapp/api/goals/${entity.id}/done`;
        await api(path, { method: "POST", body: JSON.stringify({ done }) });
      } catch (e) {
        entity.done = prev;
        renderProjectsPage();
        renderGoalsPages();
        alert("Не удалось обновить статус.");
      }
    }

    async function archiveEntity(entity, kind) {
      try {
        const path = kind === "project" ? `/miniapp/api/projects/${entity.id}/archive` : `/miniapp/api/goals/${entity.id}/archive`;
        await api(path, { method: "POST" });
        if (kind === "project") {
          projectsData = projectsData.filter((p) => p.id !== entity.id);
          renderProjectsPage();
        } else {
          goalsData = goalsData.filter((g) => g.id !== entity.id);
          renderGoalsPages();
        }
      } catch (e) {
        alert("Не удалось архивировать.");
      }
    }

    async function loadGoals() {
      try {
        goalsData = await api("/miniapp/api/goals");
      } catch (e) {
        goalsData = [];
      }
      renderGoalsPages();
    }

    // Sheet выбора цвета проекта — свой отдельный sheet (не переиспользуем
    // project-picker-sheet: у того своя видимость через render()/
    // projectPickerOpen, смешивать состояния рискованно), но по тому же
    // паттерну (state-переменная + рендер внутри общего render()).
    let colorPickerProject = null;

    function openColorPicker(project) {
      colorPickerProject = project;
      render();
    }

    function closeColorPicker() {
      colorPickerProject = null;
      render();
    }

    function renderColorPickerList() {
      const list = document.getElementById("color-picker-list");
      list.innerHTML = "";
      if (!colorPickerProject) return;

      const noneRow = document.createElement("div");
      noneRow.className = "row template-row";
      noneRow.textContent = "Без цвета";
      noneRow.onclick = () => setProjectColor(colorPickerProject, null);
      list.append(noneRow);

      const grid = document.createElement("div");
      grid.className = "palette-grid";
      grid.style.margin = "10px 0";
      for (const hex of PROJECT_COLORS) {
        const sw = document.createElement("div");
        sw.className = "swatch" + (colorPickerProject.color === hex ? " selected" : "");
        sw.style.background = hex;
        sw.onclick = () => setProjectColor(colorPickerProject, hex);
        grid.append(sw);
      }
      list.append(grid);
    }

    async function setProjectColor(project, color) {
      closeColorPicker();
      const prev = project.color;
      project.color = color;
      renderProjectsPage();
      try {
        await api(`/miniapp/api/projects/${project.id}/color`, {
          method: "POST",
          body: JSON.stringify({ color }),
        });
      } catch (e) {
        project.color = prev;
        renderProjectsPage();
        alert("Не удалось изменить цвет.");
      }
    }

    // ---- Sheet выбора проекта для задачи (5-я кнопка в свайп-шторке).

    function openProjectPicker(task) {
      projectPickerTask = task;
      projectPickerOpen = true;
      render();
    }

    function closeProjectPicker() {
      projectPickerOpen = false;
      projectPickerTask = null;
      render();
    }

    function renderProjectPickerList() {
      const container = document.getElementById("project-picker-list");
      container.innerHTML = "";
      if (!projectPickerTask) return;

      const noneRow = document.createElement("div");
      noneRow.className = "row template-row";
      noneRow.textContent = "Без проекта";
      noneRow.onclick = () => assignTaskProject(projectPickerTask, null);
      container.append(noneRow);

      for (const p of projectsData) {
        const row = document.createElement("div");
        row.className =
          "row template-row" + (projectPickerTask.project_id === p.id ? " picker-selected" : "");
        row.textContent = p.title;
        row.onclick = () => assignTaskProject(projectPickerTask, p.id);
        container.append(row);
      }
      if (projectsData.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Пока нет проектов — создайте в разделе «Проекты»";
        container.append(empty);
      }
    }

    // Черновики строки добавления — переживают пересборку списка. render()
    // перестраивает ВСЕ списки на любое действие в приложении (даже в
    // другом месте), а не только тот, где что-то реально изменилось —
    // без этого набранный текст стирался бы на середине печати от
    // совершенно не связанного действия (например, досрочно пришёл ответ
    // сети на отметку "готово" где-то в другом списке).
    const addTaskDrafts = {};

    // Строка добавления — теперь последняя строка самого списка (не
    // отдельное поле под ним), без кружка статуса/ручки/шторки — только
    // поле ввода (для Инбокса — ещё и необязательная дата) и кнопка
    // подтверждения. Всегда остаётся последней и не участвует в
    // перетаскивании (см. dragSiblings/tryReorder — ищут только
    // .reorder-row, этот класс сюда не попадает).
    function renderAddTaskRow(ctx) {
      const draft = addTaskDrafts[ctx.listKey] || (addTaskDrafts[ctx.listKey] = { text: "", date: null });

      const row = document.createElement("div");
      row.className = "row add-task-row";

      let input;
      if (ctx.withDatePicker) {
        const wrap = document.createElement("div");
        wrap.className = "input-with-icon";
        input = document.createElement("input");
        input.type = "text";
        input.placeholder = "Новая задача";
        input.value = draft.text;
        wrap.append(input);

        const dateBtn = document.createElement("button");
        dateBtn.className = "small-btn" + (draft.date ? " date-set" : "");
        dateBtn.setAttribute("aria-label", "Задать дату (необязательно)");
        dateBtn.innerHTML = calendarIcon();
        const dateInput = document.createElement("input");
        dateInput.type = "date";
        dateInput.value = draft.date || "";
        dateInput.onchange = () => {
          draft.date = dateInput.value || null;
          dateBtn.classList.toggle("date-set", !!draft.date);
        };
        dateBtn.onclick = () => (dateInput.showPicker ? dateInput.showPicker() : dateInput.click());
        dateBtn.append(dateInput);
        wrap.append(dateBtn);
        row.append(wrap);
      } else {
        input = document.createElement("input");
        input.type = "text";
        input.placeholder = "Новая задача";
        input.value = draft.text;
        row.append(input);
      }

      // Значок шаблонов (Phase 18) — слева от кнопки подтверждения, только
      // там, где это уместно (не в Инбоксе, см. showTemplatesPicker/пункт
      // 5 требований). Открывает bottom sheet со списком частых задач.
      if (ctx.showTemplatesPicker) {
        const templatesBtn = document.createElement("button");
        templatesBtn.className = "small-btn templates-btn";
        templatesBtn.setAttribute("aria-label", "Частые задачи");
        templatesBtn.innerHTML = starIcon();
        templatesBtn.onclick = () => openTemplatesPicker(ctx.dateFor);
        row.append(templatesBtn);
      }

      const submitBtn = document.createElement("button");
      submitBtn.className = "icon-btn add-task-submit";
      submitBtn.setAttribute("aria-label", "Добавить задачу");
      submitBtn.innerHTML = plusIcon();
      // Пусто — кнопка неяркая (button:disabled уже даёт нужный opacity) и
      // реально некликабельна, а не просто тусклая на вид: понятно без
      // подписи, что нажимать пока нечего. Первый же введённый символ
      // возвращает её к обычному виду.
      submitBtn.disabled = !draft.text.trim();
      input.addEventListener("input", () => {
        draft.text = input.value;
        submitBtn.disabled = !input.value.trim();
      });

      const submit = () => {
        const value = input.value.trim();
        if (!value) return;
        const dueDate = ctx.withDatePicker ? draft.date : ctx.dateFor();
        addTaskDrafts[ctx.listKey] = { text: "", date: null };
        createTaskFor(dueDate, value);
      };
      submitBtn.onclick = submit;
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") submit();
      });
      row.append(submitBtn);

      return row;
    }

    // Список в режиме переноса должен рисоваться выше затемняющего фона
    // .reorder-scrim (см. .reorder-active-list в CSS) — но yesterday-list/
    // today-list/inbox-list живут внутри #screen-stack, а он
    // position:fixed, что per спецификации CSS безусловно создаёт
    // собственный stacking context (независимо от z-index/transform) —
    // никакой z-index внутри #screen-stack не способен подняться выше
    // .reorder-scrim, который сам position:fixed и находится СНАРУЖИ
    // #screen-stack: список навсегда заперт в контексте предка (БАГ,
    // тихо сломался с появлением #screen-stack в Phase 25, всплыл только
    // сейчас). Единственный настоящий выход — физически вынести DOM-узел
    // списка за пределы #screen-stack на время режима переноса,
    // оставив вместо него comment-маркер, чтобы вернуть на место при
    // выходе. templates-list эта проблема не касается — он живёт в
    // #templates-sheet, который сам уже верхнеуровневый position:fixed
    // сосед .reorder-scrim, а не потомок #screen-stack.
    // "Окно" режима переноса (item 2, Phase 32) — раньше элевация просто
    // фиксировала список на его исходных координатах без ограничения
    // высоты: если задач было больше, чем помещалось на экран, конец
    // списка был физически недостижим (не скроллился). Теперь при входе
    // список превращается в плавающее окно по центру экрана, максимум
    // 80vh, скроллится сам (.reorder-window в CSS) — перетаскивание
    // строк (setupDragReorder) на это не влияет: оно двигает саму
    // строку через translateY и сравнивает getBoundingClientRect (уже
    // viewport-relative, скролл контейнера учтён автоматически).
    function applyReorderElevation(container, active) {
      if (active && !container._reorderPlaceholder) {
        const placeholder = document.createComment("reorder-anchor");
        container.parentNode.insertBefore(placeholder, container);
        container._reorderPlaceholder = placeholder;
        document.body.appendChild(container);
        container.classList.add("reorder-window");
      } else if (!active && container._reorderPlaceholder) {
        container._reorderPlaceholder.parentNode.insertBefore(container, container._reorderPlaceholder);
        container._reorderPlaceholder.remove();
        container._reorderPlaceholder = null;
        container.classList.remove("reorder-window");
        container.scrollTop = 0;
      }
    }

    function renderList(container, tasks, ctx) {
      const reorderMode = isReorderActive(ctx.listKey);
      // Список в режиме переноса рисуется выше затемняющего фона (см.
      // .reorder-active-list в CSS) — тем самым и выглядит "на переднем
      // плане", а всё остальное на странице просто перекрыто .reorder-scrim.
      container.classList.toggle("reorder-active-list", reorderMode);
      applyReorderElevation(container, reorderMode);
      // Значок шаблонов доступен и внутри открытого окна переноса (см.
      // renderAddTaskRow ниже) — пока поверх него открыта шторка
      // шаблонов, само окно переноса тоже должно выглядеть неактивным
      // (item, Phase 38), а не чётким вторым "передним планом".
      container.classList.toggle("reorder-dimmed", reorderMode && templatesPickerOpen);
      container.innerHTML = "";
      const sorted = sortByOrder(tasks);
      if (sorted.length === 0) {
        renderEmpty(container);
      } else {
        sorted.forEach((t) => {
          if (reorderMode) {
            container.append(renderReorderRow(t, ctx));
          } else if (ctx.style === "swipe") {
            container.append(renderSwipeableTaskRow(t, ctx));
          } else {
            container.append(renderTaskRow(t, ctx));
          }
        });
      }
      container.append(renderAddTaskRow(ctx));
    }

    // Долгое нажатие где угодно в поле списка (500мс без сдвига > 8px)
    // включает режим переноса для этого списка (см. enterReorderMode).
    // Исключены только элементы с собственной, уже занятой семантикой
    // жеста — чекбокс/кнопки/свайп-зона/шторка/поля ввода — иначе долгий
    // палец на них тоже включил бы перенос, отбирая жест у их обычного
    // тапа/свайпа.
    // listKey — строка либо функция-геттер (для недельного дня, у
    // которого выбранная дата может смениться, см. renderWeekDetail):
    // резолвим на каждое использование, а не один раз при вызове, иначе
    // долгое нажатие, начатое на одной дате, могло бы отработать по
    // уже неактуальному ключу.
    function attachReorderEntry(container, listKey) {
      const resolveKey = () => (typeof listKey === "function" ? listKey() : listKey);
      let timer = null;
      let startX = 0;
      let startY = 0;
      let pointerId = null;
      function clear() {
        clearTimeout(timer);
        timer = null;
        pointerId = null;
      }
      container.addEventListener("pointerdown", (e) => {
        if (isReorderActive(resolveKey())) return;
        if (e.target.closest(".checkbox, .small-btn, .icon-btn, .swipe-zone, .swipe-actions, input")) return;
        startX = e.clientX;
        startY = e.clientY;
        pointerId = e.pointerId;
        clearTimeout(timer);
        timer = setTimeout(() => enterReorderMode(resolveKey()), REORDER_HOLD_MS);
      });
      // pointermove/up/cancel — на document, а не на container: тот же
      // приём, что и у остальных жестов переноса в приложении (см.
      // setupDragReorder/attachSheetOverswipeClose) — реальное движение
      // пальца в Telegram WebView не всегда продолжает попадать именно в
      // исходный контейнер, значит и таймер долгого нажатия рискует не
      // очиститься движением, если слушать только на нём самом.
      document.addEventListener("pointermove", (e) => {
        if (!timer || e.pointerId !== pointerId) return;
        if (Math.abs(e.clientX - startX) > REORDER_MOVE_THRESHOLD || Math.abs(e.clientY - startY) > REORDER_MOVE_THRESHOLD) {
          clear();
        }
      });
      document.addEventListener("pointerup", (e) => {
        if (e.pointerId === pointerId) clear();
      });
      document.addEventListener("pointercancel", (e) => {
        if (e.pointerId === pointerId) clear();
      });
    }

    // Оверсвайп списка внутри bottom sheet — докрутил список до края
    // (верх или низ), продолжаешь тянуть — вся шторка следует за пальцем;
    // отпустил дальше порога — закрывается. Большая активная зона (весь
    // список, не узкая ручка) и слушатели на document — тот же приём, что
    // и у drag-реордера (Phase 13): не зависим от надёжности
    // setPointerCapture в Telegram WebView.
    const SHEET_CLOSE_THRESHOLD = 90;

    function attachSheetOverswipeClose(sheetEl, listEl, closeFn, isBlockedFn) {
      const handle = sheetEl.querySelector(".bottom-sheet-handle");
      let dragging = false;
      let mode = null; // 'top' | 'bottom' | null — пока не решили, куда тянут
      let startY = 0;
      let dy = 0;

      function atTop() {
        return listEl.scrollTop <= 0;
      }
      function atBottom() {
        return listEl.scrollTop + listEl.clientHeight >= listEl.scrollHeight - 1;
      }

      listEl.addEventListener("pointerdown", (e) => {
        if (isBlockedFn && isBlockedFn()) return;
        dragging = true;
        mode = null;
        startY = e.clientY;
        dy = 0;
      });

      document.addEventListener(
        "pointermove",
        (e) => {
          if (!dragging) return;
          const currentDy = e.clientY - startY;

          if (mode === null) {
            if (currentDy > 4 && atTop()) mode = "top";
            else if (currentDy < -4 && atBottom()) mode = "bottom";
            else return; // обычный скролл списка — не мешаем
          }
          if (mode === "top" && currentDy < 0) {
            mode = null;
            sheetEl.style.transform = "";
            handle.classList.remove("armed");
            return;
          }
          if (mode === "bottom" && currentDy > 0) {
            mode = null;
            sheetEl.style.transform = "";
            handle.classList.remove("armed");
            return;
          }

          e.preventDefault();
          dy = currentDy;
          sheetEl.style.transform = `translateY(${currentDy}px)`;
          handle.classList.toggle("armed", Math.abs(currentDy) > SHEET_CLOSE_THRESHOLD);
        },
        { passive: false }
      );

      document.addEventListener("pointerup", () => {
        if (!dragging) return;
        dragging = false;
        handle.classList.remove("armed");
        if (Math.abs(dy) > SHEET_CLOSE_THRESHOLD) closeFn();
        sheetEl.style.transform = "";
        mode = null;
        dy = 0;
      });
    }

    // Переход главный ⇄ расширенный экран (Phase 25) — всегда свайп ВВЕРХ
    // (снизу того экрана, что сейчас виден), с отставанием от пальца по
    // расстоянию (не по времени — фиксированный коэффициент, не таймер),
    // подсветкой шеврона и вибро после ~0.5с удержания. Раз оба перехода
    // делаются одним и тем же направлением жеста, а не разными (главный
    // всегда сверху стека, расширенный всегда прямо под ним) — при
    // возврате с расширенного на главный временно переставляем main на
    // третий слот (сразу под extended), чтобы жест естественным образом
    // "тянул к следующему", а после доезда мгновенно (без transition)
    // возвращаем main на нулевой слот — тот же приём, что уже
    // используется в недельной карусели (перестановка данных панелей
    // после доезда), только тут переставляется позиция экрана, а не
    // данные внутри него — DOM с обработчиками/id не дублируется.
    function attachScreenTransition() {
      const stack = document.getElementById("screen-stack");
      const mainScreen = document.getElementById("main-screen");
      const pillMain = document.getElementById("pill-main");
      const pillExtended = document.getElementById("pill-extended");
      const hamburgerBtn = document.getElementById("hamburger-btn");

      const DAMPING = 0.55;
      const OPEN_THRESHOLD_PX = 70; // «стандартный» свайп, не доля высоты экрана
      const HAPTIC_DELAY_MS = 500;

      let showingMain = true;

      function vh() {
        return window.innerHeight;
      }

      // Гамбургер-меню (Phase 30) нужен только на расширенном экране
      // (item 2, Phase 31) — переключаем видимость вместе с showingMain,
      // в каждой точке, где он меняется (pointerup-переход и
      // toggleScreen). Переключение экрана в принципе недоступно, пока
      // открыт сам гамбургер/любая шторка (их .reorder-scrim блокирует
      // и свайп, и тап по полоске) — специально закрывать раскрывашку
      // тут не нужно, этот сценарий физически недостижим.
      function updateHamburgerVisibility() {
        hamburgerBtn.classList.toggle("visible", !showingMain);
      }
      updateHamburgerVisibility();

      // Экран, на который переключаемся, должен открываться сверху, а не
      // с той прокруткой, что осталась с прошлого раза (иначе после
      // скролла вниз на расширенном экране и возврата свайпом видно
      // низ, а не верх — БАГ). .screen-content у каждого экрана
      // скроллится независимо, сбрасываем перед показом.
      function resetTargetScroll(willShowMain) {
        const target = willShowMain ? mainScreen : document.getElementById("extended-screen");
        const content = target.querySelector(".screen-content");
        if (content) content.scrollTop = 0;
      }

      function setupPill(pillEl) {
        let dragging = false;
        let startY = 0;
        let lastRaw = 0;
        let pointerId = null;
        let hapticTimer = null;

        pillEl.addEventListener("pointerdown", (e) => {
          dragging = true;
          pointerId = e.pointerId;
          startY = e.clientY;
          lastRaw = 0;
          stack.classList.add("dragging");
          // Уходим с расширенного на главный — временно "подставляем" main
          // третьим слотом под extended, чтобы жест тянул в естественную
          // сторону (см. комментарий выше).
          if (!showingMain) mainScreen.style.top = vh() * 2 + "px";

          clearTimeout(hapticTimer);
          hapticTimer = setTimeout(() => {
            if (!dragging) return;
            tg?.HapticFeedback?.impactOccurred("medium");
          }, HAPTIC_DELAY_MS);
        });

        document.addEventListener("pointermove", (e) => {
          if (!dragging || e.pointerId !== pointerId) return;
          const raw = Math.max(0, startY - e.clientY); // >0 когда тянут вверх
          lastRaw = raw;
          const eased = raw * DAMPING;
          const base = showingMain ? 0 : -vh();
          // Диапазон зависит от направления: main->extended едет в
          // [-vh, 0], а extended->main — в [-2vh, -vh] (main временно на
          // третьем слоте, см. pointerdown выше) — иначе на втором
          // направлении clamp по [-vh,0] обрезал бы движение сразу же.
          const rangeMin = showingMain ? -vh() : -2 * vh();
          const rangeMax = showingMain ? 0 : -vh();
          const clamped = Math.max(rangeMin, Math.min(rangeMax, base - eased));
          stack.style.transform = `translateY(${clamped}px)`;

          const engaged = raw > OPEN_THRESHOLD_PX;
          pillEl.querySelector(".screen-chevron").classList.toggle("armed", engaged);
          pillEl.querySelector(".pill-label").classList.toggle("armed", engaged);
        });

        document.addEventListener("pointerup", (e) => {
          if (!dragging || e.pointerId !== pointerId) return;
          dragging = false;
          clearTimeout(hapticTimer);
          stack.classList.remove("dragging");
          pillEl.querySelector(".screen-chevron").classList.remove("armed");
          pillEl.querySelector(".pill-label").classList.remove("armed");

          const raw = lastRaw;
          const base = showingMain ? 0 : -vh();

          if (raw > OPEN_THRESHOLD_PX) {
            const willShowMain = !showingMain;
            resetTargetScroll(willShowMain);
            stack.style.transform = `translateY(${willShowMain ? -2 * vh() : -vh()}px)`;
            if (willShowMain) {
              // Доехали до временного третьего слота — мгновенно, без
              // transition, возвращаем main на его настоящее место (слот 0)
              // и стек в исходное translateY(0). Контент идентичен, скачка
              // не видно.
              const settle = () => {
                stack.classList.add("dragging"); // отключить transition на кадр
                mainScreen.style.top = "0";
                stack.style.transform = "translateY(0px)";
                // force reflow, потом вернуть transition
                void stack.offsetHeight;
                stack.classList.remove("dragging");
              };
              stack.addEventListener("transitionend", settle, { once: true });
            }
            showingMain = willShowMain;
            // На главный уходим со своей вкладкой в расширенном как есть
            // (вернутся — увидят то же самое), а вот заходя на расширенный
            // — всегда с "Аналитики" (item 2, Phase 35), как и раньше,
            // когда это был верх одной длинной страницы.
            if (!willShowMain) switchExtendedTab("analytics");
            updateHamburgerVisibility();
          } else {
            stack.style.transform = `translateY(${base}px)`;
            if (!showingMain) mainScreen.style.top = "0"; // не доехали — вернуть слот сразу
          }
        });

        // Прерванный жест (например, входящий звонок) — как отпускание до
        // порога: пружинит назад, никакого перехода.
        document.addEventListener("pointercancel", (e) => {
          if (!dragging || e.pointerId !== pointerId) return;
          dragging = false;
          clearTimeout(hapticTimer);
          stack.classList.remove("dragging");
          pillEl.querySelector(".screen-chevron").classList.remove("armed");
          pillEl.querySelector(".pill-label").classList.remove("armed");
          const base = showingMain ? 0 : -vh();
          stack.style.transform = `translateY(${base}px)`;
          if (!showingMain) mainScreen.style.top = "0";
        });
      }

      setupPill(pillMain);
      setupPill(pillExtended);

      // Тап по подписи — страховка для тех, кто не найдёт жест.
      pillMain.addEventListener("click", (e) => {
        if (e.target.closest("svg, span")) toggleScreen();
      });
      pillExtended.addEventListener("click", (e) => {
        if (e.target.closest("svg, span")) toggleScreen();
      });
      function toggleScreen() {
        if (showingMain) {
          resetTargetScroll(false);
          stack.style.transform = `translateY(-${vh()}px)`;
          showingMain = false;
          switchExtendedTab("analytics");
        } else {
          resetTargetScroll(true);
          mainScreen.style.top = vh() * 2 + "px";
          stack.style.transform = `translateY(-${2 * vh()}px)`;
          stack.addEventListener(
            "transitionend",
            () => {
              stack.classList.add("dragging");
              mainScreen.style.top = "0";
              stack.style.transform = "translateY(0px)";
              void stack.offsetHeight;
              stack.classList.remove("dragging");
            },
            { once: true }
          );
          showingMain = true;
        }
        updateHamburgerVisibility();
      }
    }

    const _dayOpts = {
      yesterday: {
        listKey: "yesterday",
        style: "swipe",
        showMoveToToday: true,
        showTemplatesPicker: true,
        dateFor: () => boardState.days.yesterday?.date,
      },
      today: {
        listKey: "today",
        style: "swipe",
        showMoveToToday: false,
        showTemplatesPicker: true,
        dateFor: () => boardState.days.today?.date,
      },
    };

    const WEEKDAY_LABELS = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
    let selectedWeekDate = null;
    // Персистентный элемент списка дня недели (Phase 32, БАГ) —
    // renderWeekDetail раньше создавал новый <div> на КАЖДЫЙ вызов
    // render() (не только при смене дня), а applyReorderElevation
    // (Phase 29) при активном режиме переноса физически переносит
    // такой узел в <body> с comment-маркером на его месте — если узел
    // пересоздаётся, маркер уничтожается вместе со старым el.innerHTML,
    // а перенесённый в body клон осиротевает: следующий вызов
    // applyReorderElevation на НОВОМ узле не находит на месте то, что
    // ожидает, кидает исключение и рвёт остаток render() (в т.ч. так и
    // не доходит до включения .reorder-scrim — "размытие не работает").
    // Теперь список для дня недели — один и тот же элемент, живёт, пока
    // выбран хоть какой-то день; при смене дня просто перерисовываются
    // его дети через renderList, как у yesterday/today/inbox.
    let weekDetailListEl = null;
    let weekStart = null; // ISO понедельника недели, которая сейчас показана

    function computeWeekStart(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d));
      const weekday = (dt.getUTCDay() + 6) % 7; // Пн=0 ... Вс=6
      dt.setUTCDate(dt.getUTCDate() - weekday);
      return dt.toISOString().slice(0, 10);
    }

    function weekDotState(tasks) {
      // Пустой день — совсем без точки (null), не отдельный визуальный
      // "пустой" вариант — раньше это был класс "empty", который случайно
      // совпадал с общим .empty (плейсхолдер "список пуст") и тянул чужие
      // стили.
      if (tasks.length === 0) return null;
      const important = tasks.some((t) => t.priority === "высокий" || t.priority === "event");
      if (important || tasks.length > 5) return "bright";
      if (tasks.length >= 4) return "medium";
      return "dim";
    }

    function fillWeekGrid(gridEl, wStart) {
      gridEl.innerHTML = "";
      const todayIso = boardState.days.today?.date;
      for (let i = 0; i < 7; i++) {
        const iso = addDaysIso(wStart, i);
        const tasks = tasksForDate(iso);
        const cell = document.createElement("button");
        cell.className =
          "week-cell" + (iso === todayIso ? " today" : "") + (iso === selectedWeekDate ? " selected" : "");

        const label = document.createElement("span");
        label.className = "wc-label";
        label.textContent = WEEKDAY_LABELS[i];

        const num = document.createElement("span");
        num.className = "wc-num";
        num.textContent = String(parseInt(iso.slice(8, 10), 10));

        const dot = document.createElement("span");
        const state = weekDotState(tasks);
        dot.className = "week-dot" + (state ? " " + state : "");

        cell.append(label, num, dot);
        cell.onclick = () => {
          selectedWeekDate = selectedWeekDate === iso ? null : iso;
          renderWeekCarousel();
          renderWeekDetail();
        };
        gridEl.append(cell);
      }
    }

    const _weekGridEls = {
      prev: document.querySelector('#week-carousel .week-grid[data-slot="prev"]'),
      current: document.querySelector('#week-carousel .week-grid[data-slot="current"]'),
      next: document.querySelector('#week-carousel .week-grid[data-slot="next"]'),
    };

    // Три панели (пред./тек./след. неделя) — контент недель-соседей уже
    // готов заранее, чтобы во время свайпа (перетаскивания .week-track)
    // они сразу были видны по бокам, ещё до того как мы решим, что жест
    // завершён.
    function renderWeekCarousel() {
      if (!weekStart) return;
      fillWeekGrid(_weekGridEls.prev, addDaysIso(weekStart, -7));
      fillWeekGrid(_weekGridEls.current, weekStart);
      fillWeekGrid(_weekGridEls.next, addDaysIso(weekStart, 7));
    }

    function renderWeekDetail() {
      const el = document.getElementById("week-day-detail");
      if (!selectedWeekDate) {
        // Ничего не выбрано (в т.ч. после смены недели, см.
        // settleWeekCarousel) — прячем список и роняем ссылку, чтобы
        // при следующем выборе дня создать чистый узел заново, а не
        // держать закрытый предположениями про его текущее состояние.
        // Не может случиться, пока активен режим переноса для него
        // (см. weekDetailListEl выше) — переключение недели физически
        // недостижимо, пока открыт .reorder-scrim.
        el.innerHTML = "";
        weekDetailListEl = null;
        return;
      }

      const listKey = "cal:" + selectedWeekDate;
      if (!weekDetailListEl) {
        // БАГ (Phase 33): раньше тут ещё проверялось !el.contains(...) —
        // но пока активен режим переноса, элемент ЗАКОНОМЕРНО не лежит
        // в el (он в <body>, см. applyReorderElevation), и это условие
        // ошибочно пересоздавало список заново. Новый узел создавался,
        // рендерился в el, а СТАРЫЙ (настоящий, элевированный) так и
        // оставался висеть в body — applyReorderElevation(false) на нём
        // никогда не вызывался, потому что renderList теперь работал
        // с другим объектом. Тап по фону закрывал режим переноса
        // (scrim гас), но осиротевшее окно оставалось на экране до
        // перезахода в приложение. Проверяем только на null.
        weekDetailListEl = document.createElement("div");
        weekDetailListEl.className = "list";
        // Геттер, не фиксированная строка — selectedWeekDate может
        // смениться позже, а attachReorderEntry вызывается только один
        // раз для этого персистентного узла (см. объявление
        // weekDetailListEl выше).
        attachReorderEntry(weekDetailListEl, () => "cal:" + selectedWeekDate);
        el.innerHTML = "";
        el.append(weekDetailListEl);
      }
      renderList(weekDetailListEl, tasksForDate(selectedWeekDate), {
        listKey,
        style: "swipe",
        showMoveToToday: false,
        showTemplatesPicker: true,
        dateFor: () => selectedWeekDate,
      });
    }

    function renderInboxHeader() {
      const title = document.getElementById("inbox-title");
      title.textContent = boardState.inbox.length ? `Инбокс (${boardState.inbox.length})` : "Инбокс";
    }

    function render() {
      for (const key of ["yesterday", "today"]) {
        const el = document.getElementById(`${key}-list`);
        if (boardState.days[key]) renderList(el, boardState.days[key].tasks, _dayOpts[key]);
      }
      renderList(document.getElementById("inbox-list"), boardState.inbox, {
        listKey: "inbox",
        style: "plain",
        showDateButton: true,
        showTrashButton: true,
        withDatePicker: true,
      });
      renderInboxHeader();
      renderWeekCarousel();
      renderWeekDetail();
      refreshMonthDayDetail();
      renderTemplatesList();
      renderProjectsPage();
      renderGoalsPages();
      renderProjectPickerList();
      renderColorPickerList();
      renderCreateEntityForm();
      renderDatePickerGrid();
      const anySheetOpen =
        templatesPickerOpen ||
        projectPickerOpen ||
        colorPickerProject !== null ||
        createEntityKind !== null ||
        datePickerOpen ||
        sideDrawerOpen ||
        helpSheetOpen;
      document
        .getElementById("reorder-scrim")
        .classList.toggle("visible", reorderActiveKey !== null || anySheetOpen);
      document.getElementById("templates-sheet").classList.toggle("visible", templatesPickerOpen);
      document
        .getElementById("project-picker-sheet")
        .classList.toggle("visible", projectPickerOpen);
      document
        .getElementById("color-picker-sheet")
        .classList.toggle("visible", colorPickerProject !== null);
      document
        .getElementById("create-entity-sheet")
        .classList.toggle("visible", createEntityKind !== null);
      document.getElementById("date-picker-sheet").classList.toggle("visible", datePickerOpen);
      document.getElementById("side-drawer").classList.toggle("visible", sideDrawerOpen);
      document.getElementById("help-sheet").classList.toggle("visible", helpSheetOpen);
    }

    function addDaysIso(iso, days) {
      const [y, m, d] = iso.split("-").map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d));
      dt.setUTCDate(dt.getUTCDate() + days);
      return dt.toISOString().slice(0, 10);
    }

    async function loadBoard() {
      try {
        boardState = await api("/miniapp/api/tasks");
        const firstLoad = weekStart === null;
        if (firstLoad) {
          const tomorrowIso = addDaysIso(boardState.days.today.date, 1);
          weekStart = computeWeekStart(tomorrowIso);
          selectedWeekDate = tomorrowIso;
          // По умолчанию в месячном календаре выбран сегодняшний день
          // (item 3, Phase 35) — а не пустой выбор, как раньше.
          calSelectedDay = boardState.days.today.date;
        }
        render();
        // Центрируем полоску недель на "текущей" (средней) панели только
        // при первой загрузке — на каждой перерисовке (после отметки
        // задачи и т.д.) позицию свайпа трогать нельзя.
        if (firstLoad) recenterWeekCarousel();
        // Подсветка "сегодня" в месячном календаре и лаконичная инфа дня
        // читают boardState — обновляем на всякий случай при каждой
        // перезагрузке доски, не только по навигации по месяцу.
        renderMonthCalendar();
        if (calSelectedDay) showDayInfo(calSelectedDay);
      } catch (e) {
        document.getElementById("today-list").innerHTML =
          '<div class="empty">Не удалось загрузить задачи.</div>';
      }
    }

    async function toggleTaskDone(task) {
      const id = task.id;
      const newDone = !task.done;
      const prevDone = task.done;
      task.done = newDone;
      pendingIds.add(id);
      rebucketTask(task);
      render();
      try {
        await api(`/miniapp/api/tasks/${encodeURIComponent(id)}/done`, {
          method: "POST",
          body: JSON.stringify({ done: newDone }),
        });
      } catch (e) {
        task.done = prevDone;
        rebucketTask(task);
        alert("Не удалось обновить статус.");
      } finally {
        pendingIds.delete(id);
        render();
      }
    }

    async function setTaskDueDate(task, value) {
      // value — либо чистая дата ("2026-09-01", обычный <input type=date>),
      // либо datetime-local ("2026-09-01T14:30", событие со временем).
      // due_date локально остаётся чистой датой (им живёт вся бакетизация
      // по дням), время — отдельно в due_time; на бэкенд шлём value целиком,
      // там разбирается на timestamp.
      const id = task.id;
      const prevDate = task.due_date;
      const prevTime = task.due_time;
      const prevSortOrder = task.sort_order;
      task.due_date = value.slice(0, 10);
      task.due_time = value.length > 10 ? value.slice(11, 16) : null;
      // Как и на бэкенде (см. api.py set_task_due_date) — перенос на другой
      // день уносит задачу в конец списка того дня, а не оставляет её на
      // случайной позиции среди задач, с которыми она физически больше не
      // соседствует.
      task.sort_order = Date.now();
      pendingIds.add(id);
      rebucketTask(task);
      render();
      try {
        await api(`/miniapp/api/tasks/${encodeURIComponent(id)}/due-date`, {
          method: "POST",
          body: JSON.stringify({ due_date: value }),
        });
      } catch (e) {
        task.due_date = prevDate;
        task.due_time = prevTime;
        task.sort_order = prevSortOrder;
        rebucketTask(task);
        alert("Не удалось поставить дату.");
      } finally {
        pendingIds.delete(id);
        render();
      }
    }
